# Licensing of every file in the repository, in the format of the REUSE
# specification 3.3 (https://reuse.software/spec-3.3/). PHP files also carry an
# SPDX header; this file covers the rest. `reuse lint` checks it in CI.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Foresi contributors <https://github.com/foresi/foresi/graphs/contributors>"
SPDX-License-Identifier = "AGPL-3.0-only"

# Lucide icons, ISC (src/Ui/assets/icons/lucide/LICENSE).
[[annotations]]
path = "src/Ui/assets/icons/lucide/**"
precedence = "override"
SPDX-FileCopyrightText = "Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

# Inter web fonts, SIL Open Font License 1.1 (OFL.txt next to them).
[[annotations]]
path = "src/Ui/assets/theme/fonts/inter/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"

# PDF fonts made from Inter and Gelasio, SIL Open Font License 1.1 (README.md
# there tells which file comes from which).
[[annotations]]
path = ["src/Shared/resources/pdf-fonts/inter*", "src/Shared/resources/pdf-fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/Shared/resources/pdf-fonts/gelasio*", "src/Shared/resources/pdf-fonts/OFL-Gelasio.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Gelasio Project Authors <https://github.com/SorkinType/Gelasio>"
SPDX-License-Identifier = "OFL-1.1"
