# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The product name shown on every page; the only place it is defined.
    app.product_name: Foresi
    # The released version, named as the issuing system in electronic documents. A release sets it.
    app.version: 0.4.0
    # Uploaded import sources; never below public/, tenant directories inside.
    app.import_files_dir: '%kernel.project_dir%/var/imports'
    # Logos and stamps; never below public/. From the kernel, not from the environment
    # variable: that one is relative, and the web server would resolve it inside public/.
    app.firm_image_dir: '%kernel.share_dir%/firm-images'
    # A firm's mail server may not be in a private, loopback or link-local network,
    # as tenants type the host. An installation whose server is inside sets this.
    app.mail.allow_private_hosts: false
    # A webhook endpoint may not be in a private, loopback or link-local network either,
    # as people type the URL. Local development against a receiver on this machine sets this.
    app.webhooks.allow_private_hosts: false
    # Links in sent mail are built on DEFAULT_URI; a loopback base would make them dead,
    # so sending refuses one. Development and the tests allow it.
    app.mail.allow_local_links: false
    # The PDFs exactly as they were sent; never below public/. Back it up with the database.
    app.sent_documents_dir: '%kernel.share_dir%/sent-documents'
    # Raw bank mail as it arrived; never below public/. Back it up with the database.
    app.inbound_mail_dir: '%kernel.share_dir%/inbound-mail'
    # The PDFs pulled from iDoklad accounts; never below public/. Back it up with the database.
    app.idoklad_files_dir: '%kernel.share_dir%/idoklad-documents'
    # The PDFs imported documents keep as their originals; never below public/. Back it up with the database.
    app.original_documents_dir: '%kernel.share_dir%/original-documents'
    # Files attached to records, one directory per tenant; never below public/. Back it up with the database.
    app.attachments_dir: '%kernel.share_dir%/attachments'
    # Seconds between a mention or an assignment and its e-mail, skipped if read in the inbox meanwhile.
    app.notification_mail_delay: 120
    # The health check is degraded when less of the data directory's disk is free, in percent.
    env(HEALTH_DISK_MIN_FREE_PERCENT): '5'
    # Error mails to the operator; both empty sends none (docs/logging.md).
    env(OPERATOR_MAILER_DSN): ''
    env(OPERATOR_EMAIL): ''
    # Mail of the installation itself, such as invitations; empty sends none (docs/operations.md).
    env(SYSTEM_MAILER_DSN): ''
    env(SYSTEM_MAIL_FROM): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Development tool: registered, and so routable, in the dev and test environments only.
            - '../src/Ui/Controller/CatalogueController.php'

    # Country modules plug into the core through tagged interfaces.
    _instanceof:
        App\Party\Domain\RegistrationNumberValidator:
            tags: ['app.registration_number_validator']
        App\Party\Domain\DomesticBankAccount:
            tags: ['app.domestic_bank_account']
        # A country module plugs into invoicing with its rules.
        App\Invoicing\Application\InvoicingCountry:
            tags: ['app.invoicing_country']
        # Modules plug into the import by implementing its target contract.
        App\Import\Application\Target\ImportTarget:
            tags: ['app.import_target']
        # ...and contribute presets of the known sources they can read.
        App\Import\Domain\Preset\SourcePreset:
            tags: ['app.import_preset']
        # Timed work done once per tenant and period; see App\Tenancy\Application\Schedule.
        App\Tenancy\Application\Schedule\ScheduledJob:
            tags: ['app.scheduled_job']
        # Timed work of the installation, with no tenant; see App\Tenancy\Application\Schedule\OperatorTask.
        App\Tenancy\Application\Schedule\OperatorTask:
            tags: ['app.operator_task']
        # The module that owns a kind of record decides who reaches its attachments.
        App\Attachment\Application\AttachmentAccess:
            tags: ['app.attachment_access']
        # A country module plugs into banking with the parsers of its banks' mail.
        App\Banking\Application\BankMessageParser:
            tags: ['app.bank_message_parser']
        # The stages of an iDoklad import; each one orders itself.
        App\Idoklad\Application\Import\ImportStage:
            tags: ['app.idoklad_import_stage']

    # The tenant of a request signed in with a personal API token is the token's; otherwise the session's choice.
    App\Identity\Application\ActiveTenantStore:
        alias: App\Identity\Infrastructure\Security\RequestActiveTenantStore

    App\Party\Application\RegistrationNumberFactory:
        arguments:
            $validators: !tagged_iterator app.registration_number_validator

    App\Party\Application\ImportPartyValues:
        arguments:
            $domesticAccounts: !tagged_iterator app.domestic_bank_account

    App\Party\Application\ManageFirmBankAccounts:
        arguments:
            $domesticAccounts: !tagged_iterator app.domestic_bank_account
    # Banking records the movements that fix an account's currency.
    App\Party\Application\BankAccountUsage:
        alias: App\Banking\Infrastructure\MovementUsage

    App\Invoicing\Application\InvoicingCountries:
        arguments:
            $countries: !tagged_iterator app.invoicing_country

    App\Banking\Application\BankMessageParsers:
        arguments:
            $parsers: !tagged_iterator app.bank_message_parser

    App\Banking\Application\MailReader:
        alias: App\Banking\Infrastructure\Mime\ZbatesonMailReader
    # Whose authentication results are believed, per channel; empty lists verify no message.
    # The webhook has its own list and never falls back to the mailbox's.
    App\Banking\Application\TrustSettings:
        arguments:
            $authservIds: '%env(csv:BANK_INBOX_TRUSTED_AUTHSERV)%'
            $arcSealers: '%env(csv:BANK_INBOX_TRUSTED_ARC)%'
            $webhookAuthservIds: '%env(csv:INBOUND_WEBHOOK_TRUSTED_AUTHSERV)%'
    # A firm's stored switches, or the defaults while it has none.
    App\Banking\Application\FirmPairingRules:
        alias: App\Banking\Infrastructure\Doctrine\DoctrineFirmPairings
    # The inbound address of a bank account; empty means bank mail is not set up here.
    App\Banking\Application\InboundAddresses:
        arguments:
            $template: '%env(string:BANK_INBOX_ADDRESS)%'
    App\Banking\Application\BankMovements:
        alias: App\Banking\Infrastructure\Doctrine\DoctrineBankMovements
    App\Banking\Application\Candidates:
        alias: App\Banking\Infrastructure\Doctrine\DoctrineCandidates
    # The operator mailbox bank mail is polled from; none when BANK_INBOX_HOST is empty.
    App\Banking\Application\InboundMailbox:
        factory: ['App\Banking\Infrastructure\Imap\ImapInboundMailbox', 'fromSettings']
        arguments:
            $host: '%env(string:BANK_INBOX_HOST)%'
            $port: '%env(int:BANK_INBOX_PORT)%'
            $encryption: '%env(string:BANK_INBOX_ENCRYPTION)%'
            $user: '%env(string:BANK_INBOX_USER)%'
            $password: '%env(string:BANK_INBOX_PASSWORD)%'
            $folder: '%env(string:BANK_INBOX_FOLDER)%'
    App\Banking\Application\InboundMessages:
        alias: App\Banking\Infrastructure\Doctrine\DoctrineInboundMessages
    App\Banking\Application\Ownership:
        alias: App\Banking\Infrastructure\IdentityOwnership
    # How often a message of the operator mailbox failed, across polls.
    App\Banking\Application\PollFailures:
        alias: App\Banking\Infrastructure\CachePollFailures
    App\Banking\Application\InboundFiles:
        alias: App\Banking\Infrastructure\Files\DiskInboundFiles
    App\Banking\Application\InboundProcessing:
        alias: App\Banking\Infrastructure\Messenger\MessengerInboundProcessing
    App\Banking\Application\PendingChanges:
        alias: App\Banking\Infrastructure\Doctrine\DoctrinePendingChanges
    App\Banking\Infrastructure\Files\DiskInboundFiles:
        arguments:
            $root: '%app.inbound_mail_dir%'

    App\Country\CzechRepublic\Invoicing\IsdocWriter:
        arguments:
            $issuingSystem: '%app.product_name% %app.version%'

    App\Invoicing\Infrastructure\Pdf\PdfEngine:
        arguments:
            $logoDirectories: ['%app.firm_image_dir%']

    App\Party\Infrastructure\Http\FilesystemFirmImages:
        arguments:
            $root: '%app.firm_image_dir%'

    App\Import\Infrastructure\LocalImportFiles:
        arguments:
            $root: '%app.import_files_dir%'

    App\Import\Application\Target\TargetRegistry:
        arguments:
            $targets: !tagged_iterator app.import_target

    App\Import\Application\PresetRegistry:
        arguments:
            $presets: !tagged_iterator app.import_preset

    # Declared here (private) so PHPStan, which reads the dev container, knows the
    # id used by the wiring test; it is made public in the test env below.
    test.registration_number_factory:
        alias: App\Party\Application\RegistrationNumberFactory
    test.invoice_send_firm_limiter:
        alias: limiter.invoice_send_firm
    test.document_link_limiter:
        alias: limiter.document_link
    test.inbound_mail_limiter:
        alias: limiter.inbound_mail
    test.inbound_mail_relay_limiter:
        alias: limiter.inbound_mail_relay
    test.invitation_link_limiter:
        alias: limiter.invitation_link
    test.invoice_balances:
        alias: App\Invoicing\Application\InvoiceBalances
    test.idoklad_import:
        alias: App\Idoklad\Application\Import\RunIdokladImport

    App\Shared\Infrastructure\Registry\RegistryCache:
        arguments:
            $registryCache: '@cache.registry'

    App\Shared\Infrastructure\Registry\PublicRegistryClient:
        arguments:
            $registryOutgoingLimiter: '@limiter.registry_outgoing'

    # Mail goes out through the firm's own server. Named here so the test and e2e
    # environments can swap the gateway, and PHPStan, which reads the dev container, knows the ids.
    App\Invoicing\Application\MailGateway:
        alias: App\Invoicing\Infrastructure\Mail\SymfonyMailGateway
    App\Invoicing\Application\MailServers:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailServers
    App\Invoicing\Application\MailSecrets:
        alias: App\Invoicing\Infrastructure\Mail\SodiumMailSecrets
    # Events are recorded on the connection of the use case; the transaction hooks tell the same object how the unit ended.
    App\Shared\Application\Event\EventRecorder:
        alias: App\Events\Infrastructure\Dbal\DbalEventRecorder
    App\Shared\Application\Event\EventOutbox:
        alias: App\Events\Infrastructure\Dbal\DbalEventRecorder
    App\Shared\Application\Sealer:
        alias: App\Shared\Infrastructure\Crypto\SodiumSealer
    App\Invoicing\Application\MailHostPolicy:
        alias: App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy
    App\Webhooks\Application\WebhookSecrets:
        alias: App\Webhooks\Infrastructure\Crypto\SodiumWebhookSecrets
    App\Webhooks\Application\WebhookUrlPolicy:
        alias: App\Webhooks\Infrastructure\Http\DnsWebhookUrlPolicy
    # Redirects are never followed and, unless this installation posts to its own network, private addresses are refused.
    webhooks.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Webhooks\Infrastructure\Http\WebhookHttpClientFactory', 'create']
        arguments: ['%app.webhooks.allow_private_hosts%']
    App\Invoicing\Application\MailTemplates:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailTemplates
    App\Invoicing\Application\DocumentTitles:
        alias: App\Invoicing\Infrastructure\Pdf\TranslatedDocumentTitles
    App\Invoicing\Application\RecurringAlertTexts:
        alias: App\Invoicing\Infrastructure\Mail\TranslatedRecurringAlertTexts
    App\Invoicing\Application\InvoiceSends:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineInvoiceSends
    App\Invoicing\Application\SentFiles:
        alias: App\Invoicing\Infrastructure\Mail\DiskSentFiles
    # What is still owed on invoices, from the recorded payments; the SQL
    # condition comes from the same implementation, which passes
    # InvoiceBalancesContract and is authoritative, so reminders may be switched on.
    App\Invoicing\Application\InvoiceBalances:
        alias: App\Invoicing\Infrastructure\Doctrine\PaymentBalances
    App\Invoicing\Infrastructure\Doctrine\OwingInvoiceCondition:
        alias: App\Invoicing\Infrastructure\Doctrine\PaymentBalances
    App\Invoicing\Application\DocumentLinks:
        alias: App\Invoicing\Infrastructure\Mail\RouterDocumentLinks
    App\Invoicing\Application\SendLimits:
        alias: App\Invoicing\Infrastructure\Mail\RateLimitedSends
    App\Invoicing\Application\InvoiceSendQueue:
        alias: App\Invoicing\Infrastructure\Messenger\MessengerInvoiceSendQueue
    App\Invoicing\Application\RecurringIssueQueue:
        alias: App\Invoicing\Infrastructure\Messenger\MessengerRecurringIssueQueue
    App\Invoicing\Application\PublicDocuments:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrinePublicDocuments
    App\Invoicing\Application\InvoicePayments:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineInvoicePayments
    # A cancelled bank payment returns its movement to the unmatched ones.
    App\Invoicing\Application\PaymentSourceRelease:
        alias: App\Banking\Infrastructure\ReleaseMovement
    # Time is the work an invoice may bill; issuing it locks the time.
    App\Invoicing\Application\BilledWork:
        alias: App\Timesheet\Application\TimeBilledWork
    # An invoice in the trash frees its time, and restoring it bills the time again.
    App\Invoicing\Application\BilledWorkRelease:
        alias: App\Timesheet\Application\ReleaseTime
    # A line of invoiced time names its invoice.
    App\Work\Application\InvoiceNumbers:
        alias: App\Timesheet\Infrastructure\Doctrine\DoctrineInvoiceNumbers

    # Links to sent documents are derived from the application secret, never stored.
    App\Invoicing\Application\LinkTokens:
        arguments:
            $secret: '%kernel.secret%'

    App\Invoicing\Infrastructure\Mail\DiskSentFiles:
        arguments:
            $root: '%app.sent_documents_dir%'
    App\Invoicing\Infrastructure\Pdf\DiskOriginalDocuments:
        arguments:
            $root: '%app.original_documents_dir%'
    App\Attachment\Infrastructure\Storage\DiskAttachmentFiles:
        arguments:
            $root: '%app.attachments_dir%'
    App\Attachment\Application\AttachmentPermissions:
        arguments:
            $accesses: !tagged_iterator app.attachment_access
    # Drawn documents, except an imported one that kept the PDF of its source.
    App\Invoicing\Application\InvoicePdf:
        alias: App\Invoicing\Infrastructure\Pdf\TcpdfInvoicePdf
    App\Invoicing\Infrastructure\Pdf\OriginalFirstInvoicePdf:
        decorates: App\Invoicing\Application\InvoicePdf
        arguments:
            $drawn: '@.inner'

    # The importer reads iDoklad accounts; only GET of read-only paths, see ReadOnlyPaths.
    App\Idoklad\Application\IdokladClient:
        alias: App\Idoklad\Infrastructure\Http\HttpIdokladClient
    App\Idoklad\Application\IdokladConnections:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineIdokladConnections
    App\Idoklad\Application\IdokladSnapshot:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineIdokladSnapshot
    App\Idoklad\Application\IdokladFiles:
        alias: App\Idoklad\Infrastructure\Files\DiskIdokladFiles
    App\Idoklad\Infrastructure\Files\DiskIdokladFiles:
        arguments:
            $root: '%app.idoklad_files_dir%'
    App\Idoklad\Application\IdokladJobs:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineIdokladJobs
    App\Idoklad\Application\IdokladQueue:
        alias: App\Idoklad\Infrastructure\Messenger\MessengerIdokladQueue
    App\Idoklad\Application\Import\IdokladLinks:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineIdokladLinks
    App\Idoklad\Application\Import\IdokladImportRuns:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineIdokladImportRuns
    App\Idoklad\Application\Import\ImportTransaction:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineImportTransaction
    App\Idoklad\Application\Import\ContactNames:
        alias: App\Idoklad\Infrastructure\Doctrine\DoctrineContactNames
    App\Idoklad\Application\Import\RunIdokladImport:
        arguments:
            $stages: !tagged_iterator app.idoklad_import_stage

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Application classes stay framework-free, so the reset tag is declared here:
    # long-running workers and Messenger never carry a tenant into the next job.
    App\Tenancy\Application\TenantContext:
        tags:
            - { name: kernel.reset, method: reset }

    App\Audit\Application\AuditCorrelation:
        tags:
            - { name: kernel.reset, method: reset }

when@dev:
    parameters:
        app.mail.allow_local_links: true

    services:
        App\Ui\Controller\CatalogueController:
            autowire: true
            autoconfigure: true

# The end-to-end environment (tests/e2e) runs the real application against its own
# SQLite database. Registry adapters are replaced by the fixture-backed fakes of the
# PHPUnit suite, so no browser test ever calls a live register.
when@e2e:
    parameters:
        app.mail.allow_local_links: true
        # The bank mail of the seed, gone with the e2e cache that serve.sh starts from.
        app.inbound_mail_dir: '%kernel.cache_dir%/inbound-mail'
        # The PDFs of the seeded iDoklad pull, gone with the e2e cache too.
        app.idoklad_files_dir: '%kernel.cache_dir%/idoklad-documents'
        app.attachments_dir: '%kernel.cache_dir%/attachments'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Ui\Controller\CatalogueController: ~

        # The seed stores an iDoklad pull; no browser test ever reaches iDoklad. A client with no
        # responses fails every request, so a pull or a key check started in a spec fails at once.
        App\Idoklad\Infrastructure\Http\HttpIdokladClient:
            arguments:
                $http: !service
                    class: Symfony\Component\HttpClient\MockHttpClient
                    arguments: [[]]

        App\Party\Application\CompanyRegistry:
            alias: App\Tests\Support\Registry\FakeCompanyRegistry
        App\Party\Application\VatRegistry:
            alias: App\Tests\Support\Registry\FakeVatRegistry
        App\Party\Application\VatPayerReliability:
            alias: App\Tests\Support\Registry\FakeVatPayerReliability
        App\Tests\Support\Registry\FakeCompanyRegistry: ~
        App\Tests\Support\Registry\FakeVatRegistry: ~
        App\Tests\Support\Registry\FakeVatPayerReliability: ~

        # Public handles for tests/e2e/seed.php.
        e2e.tenant_context:
            alias: App\Tenancy\Application\TenantContext
            public: true
        e2e.create_party:
            alias: App\Party\Application\CreateParty
            public: true
        e2e.registration_numbers:
            alias: App\Party\Application\RegistrationNumberFactory
            public: true
        e2e.password_hashers:
            alias: Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactoryInterface
            public: true
        e2e.entity_manager:
            alias: Doctrine\ORM\EntityManagerInterface
            public: true

        # Nothing is ever sent from the browser tests.
        App\Invoicing\Application\MailGateway:
            alias: App\Tests\Support\Mail\RecordingMailGateway
            public: true
        App\Tests\Support\Mail\RecordingMailGateway: ~
        # ...and no browser test asks a real DNS server for a mail host.
        App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy:
            arguments:
                $resolver: !closure '@App\Tests\Support\Mail\ExampleHostResolver'
        App\Tests\Support\Mail\ExampleHostResolver: ~
        e2e.mail_secrets:
            alias: App\Invoicing\Application\MailSecrets
            public: true
        e2e.issue_invoice:
            alias: App\Invoicing\Application\IssueInvoice
            public: true
        e2e.send_invoice:
            alias: App\Invoicing\Application\SendInvoice
            public: true
        e2e.link_tokens:
            alias: App\Invoicing\Application\LinkTokens
            public: true
        e2e.record_payment:
            alias: App\Invoicing\Application\RecordPayment
            public: true
        e2e.record_movement:
            alias: App\Banking\Application\RecordMovement
            public: true
        e2e.pair_movement:
            alias: App\Banking\Application\PairMovement
            public: true
        e2e.generate_address:
            alias: App\Banking\Application\GenerateAddress
            public: true
        e2e.receive_inbound_mail:
            alias: App\Banking\Application\ReceiveInboundMail
            public: true
        e2e.save_recurring:
            alias: App\Invoicing\Application\SaveRecurringInvoice
            public: true
        e2e.recurring_lifecycle:
            alias: App\Invoicing\Application\RecurringLifecycle
            public: true
        e2e.issue_recurring:
            alias: App\Invoicing\Application\IssueRecurringOccurrence
            public: true
        e2e.tenant_clock:
            alias: App\Tenancy\Application\TenantClock
            public: true
        e2e.manage_projects:
            alias: App\Work\Application\ManageProjects
            public: true
        e2e.manage_sections:
            alias: App\Work\Application\ManageSections
            public: true
        e2e.manage_tasks:
            alias: App\Work\Application\ManageTasks
            public: true
        e2e.manage_labels:
            alias: App\Work\Application\ManageLabels
            public: true
        e2e.manage_comments:
            alias: App\Work\Application\ManageComments
            public: true
        e2e.manage_sharing:
            alias: App\Work\Application\ManageSharing
            public: true
        e2e.manage_time:
            alias: App\Work\Application\ManageTime
            public: true
        e2e.upload_attachment:
            alias: App\Attachment\Application\UploadAttachment
            public: true
        e2e.token_storage:
            alias: security.token_storage
            public: true
        e2e.rate_store:
            alias: App\ExchangeRate\Application\RateStore
            public: true
        e2e.record_received_document:
            alias: App\Purchasing\Application\RecordReceivedDocument
            public: true

when@test:
    parameters:
        # Inside the test cache, so a test never writes to the real share directory.
        app.firm_image_dir: '%kernel.cache_dir%/firm-images'
        app.sent_documents_dir: '%kernel.cache_dir%/sent-documents'
        app.original_documents_dir: '%kernel.cache_dir%/original-documents'
        app.inbound_mail_dir: '%kernel.cache_dir%/inbound-mail'
        app.idoklad_files_dir: '%kernel.cache_dir%/idoklad-documents'
        app.mail.allow_local_links: true

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # In memory, so lookups never leak between test runs.
        test.party_lookup_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.party_refresh_checks_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.registry_outgoing_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.login_throttling_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.mail_test_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.two_factor_code_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.invoice_send_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.invoice_send_firm_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.document_link_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.inbound_mail_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.inbound_mail_relay_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.health_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.invitation_link_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        # Lets a test spend the budget of a firm.
        test.invoice_send_firm_limiter:
            alias: limiter.invoice_send_firm
            public: true
        test.document_link_limiter:
            alias: limiter.document_link
            public: true
        test.inbound_mail_limiter:
            alias: limiter.inbound_mail
            public: true
        test.inbound_mail_relay_limiter:
            alias: limiter.inbound_mail_relay
            public: true
        test.invitation_link_limiter:
            alias: limiter.invitation_link
            public: true

        # The generic audit query; the fake import target answers changedSince()
        # with it, while targets of the application check their own entities.
        App\Audit\Application\AuditTrail:
            alias: App\Audit\Infrastructure\Doctrine\DoctrineAuditTrail
            public: true

        # Lets a test make the gate's lock fail once.
        App\Tests\Import\Support\FlakyImportLock:
            decorates: App\Import\Application\ImportLock

        # A target living in memory, for the pipeline tests.
        App\Tests\Import\Support\FakeTarget:
            public: true
            tags: ['app.import_target']

        # The tests drive the import services directly, not only through the screens.
        App\Import\Application\StartImport: { public: true }
        App\Import\Application\ExportRecords: { public: true }
        App\Import\Application\ConfigureImport: { public: true }
        App\Import\Application\CheckImport: { public: true }
