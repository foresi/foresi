# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The product name shown on every page; the only place it is defined.
    app.product_name: Foresi
    # The released version, named as the issuing system in electronic documents. A release sets it.
    app.version: 0.4.0
    # Uploaded import sources; never below public/, tenant directories inside.
    app.import_files_dir: '%kernel.project_dir%/var/imports'
    # Logos and stamps; never below public/. From the kernel, not from the environment
    # variable: that one is relative, and the web server would resolve it inside public/.
    app.firm_image_dir: '%kernel.share_dir%/firm-images'
    # A firm's mail server may not be in a private, loopback or link-local network,
    # as tenants type the host. An installation whose server is inside sets this.
    app.mail.allow_private_hosts: false
    # Links in sent mail are built on DEFAULT_URI; a loopback base would make them dead,
    # so sending refuses one. Development and the tests allow it.
    app.mail.allow_local_links: false
    # The PDFs exactly as they were sent; never below public/. Back it up with the database.
    app.sent_documents_dir: '%kernel.share_dir%/sent-documents'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Development tool: registered, and so routable, in the dev and test environments only.
            - '../src/Ui/Controller/CatalogueController.php'

    # Country modules plug into the core through tagged interfaces.
    _instanceof:
        App\Party\Domain\RegistrationNumberValidator:
            tags: ['app.registration_number_validator']
        App\Party\Domain\DomesticBankAccount:
            tags: ['app.domestic_bank_account']
        # A country module plugs into invoicing with its rules.
        App\Invoicing\Application\InvoicingCountry:
            tags: ['app.invoicing_country']
        # Modules plug into the import by implementing its target contract.
        App\Import\Application\Target\ImportTarget:
            tags: ['app.import_target']
        # ...and contribute presets of the known sources they can read.
        App\Import\Domain\Preset\SourcePreset:
            tags: ['app.import_preset']
        # Timed work done once per tenant and period; see App\Tenancy\Application\Schedule.
        App\Tenancy\Application\Schedule\ScheduledJob:
            tags: ['app.scheduled_job']

    App\Party\Application\RegistrationNumberFactory:
        arguments:
            $validators: !tagged_iterator app.registration_number_validator

    App\Party\Application\ImportPartyValues:
        arguments:
            $domesticAccounts: !tagged_iterator app.domestic_bank_account

    App\Invoicing\Application\InvoicingCountries:
        arguments:
            $countries: !tagged_iterator app.invoicing_country

    App\Country\CzechRepublic\Invoicing\IsdocWriter:
        arguments:
            $issuingSystem: '%app.product_name% %app.version%'

    App\Invoicing\Infrastructure\Pdf\PdfEngine:
        arguments:
            $logoDirectories: ['%app.firm_image_dir%']

    App\Party\Infrastructure\Http\FilesystemFirmImages:
        arguments:
            $root: '%app.firm_image_dir%'

    App\Import\Infrastructure\LocalImportFiles:
        arguments:
            $root: '%app.import_files_dir%'

    App\Import\Application\Target\TargetRegistry:
        arguments:
            $targets: !tagged_iterator app.import_target

    App\Import\Application\PresetRegistry:
        arguments:
            $presets: !tagged_iterator app.import_preset

    # Declared here (private) so PHPStan, which reads the dev container, knows the
    # id used by the wiring test; it is made public in the test env below.
    test.registration_number_factory:
        alias: App\Party\Application\RegistrationNumberFactory
    test.invoice_send_firm_limiter:
        alias: limiter.invoice_send_firm
    test.document_link_limiter:
        alias: limiter.document_link
    test.invoice_balances:
        alias: App\Invoicing\Application\InvoiceBalances

    App\Shared\Infrastructure\Registry\RegistryCache:
        arguments:
            $registryCache: '@cache.registry'

    App\Shared\Infrastructure\Registry\PublicRegistryClient:
        arguments:
            $registryOutgoingLimiter: '@limiter.registry_outgoing'

    # Mail goes out through the firm's own server. Named here so the test and e2e
    # environments can swap the gateway, and PHPStan, which reads the dev container, knows the ids.
    App\Invoicing\Application\MailGateway:
        alias: App\Invoicing\Infrastructure\Mail\SymfonyMailGateway
    App\Invoicing\Application\MailServers:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailServers
    App\Invoicing\Application\MailSecrets:
        alias: App\Invoicing\Infrastructure\Mail\SodiumMailSecrets
    App\Invoicing\Application\MailHostPolicy:
        alias: App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy
    App\Invoicing\Application\MailTemplates:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailTemplates
    App\Invoicing\Application\DocumentTitles:
        alias: App\Invoicing\Infrastructure\Pdf\TranslatedDocumentTitles
    App\Invoicing\Application\InvoiceSends:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrineInvoiceSends
    App\Invoicing\Application\SentFiles:
        alias: App\Invoicing\Infrastructure\Mail\DiskSentFiles
    # What is still owed on invoices. The payments module rebinds this to an
    # authoritative implementation that passes InvoiceBalancesContractTest, and
    # the SQL condition below to the same implementation.
    App\Invoicing\Application\InvoiceBalances:
        alias: App\Invoicing\Infrastructure\Doctrine\DueDateBalances
    App\Invoicing\Infrastructure\Doctrine\OwingInvoiceCondition:
        alias: App\Invoicing\Infrastructure\Doctrine\DueDateBalances
    App\Invoicing\Application\DocumentLinks:
        alias: App\Invoicing\Infrastructure\Mail\RouterDocumentLinks
    App\Invoicing\Application\SendLimits:
        alias: App\Invoicing\Infrastructure\Mail\RateLimitedSends
    App\Invoicing\Application\InvoiceSendQueue:
        alias: App\Invoicing\Infrastructure\Messenger\MessengerInvoiceSendQueue
    App\Invoicing\Application\RecurringIssueQueue:
        alias: App\Invoicing\Infrastructure\Messenger\MessengerRecurringIssueQueue
    App\Invoicing\Application\PublicDocuments:
        alias: App\Invoicing\Infrastructure\Doctrine\DoctrinePublicDocuments

    # Links to sent documents are derived from the application secret, never stored.
    App\Invoicing\Application\LinkTokens:
        arguments:
            $secret: '%kernel.secret%'

    App\Invoicing\Infrastructure\Mail\DiskSentFiles:
        arguments:
            $root: '%app.sent_documents_dir%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Application classes stay framework-free, so the reset tag is declared here:
    # long-running workers and Messenger never carry a tenant into the next job.
    App\Tenancy\Application\TenantContext:
        tags:
            - { name: kernel.reset, method: reset }

    App\Audit\Application\AuditCorrelation:
        tags:
            - { name: kernel.reset, method: reset }

when@dev:
    parameters:
        app.mail.allow_local_links: true

    services:
        App\Ui\Controller\CatalogueController:
            autowire: true
            autoconfigure: true

# The end-to-end environment (tests/e2e) runs the real application against its own
# SQLite database. Registry adapters are replaced by the fixture-backed fakes of the
# PHPUnit suite, so no browser test ever calls a live register.
when@e2e:
    parameters:
        app.mail.allow_local_links: true

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Ui\Controller\CatalogueController: ~

        App\Party\Application\CompanyRegistry:
            alias: App\Tests\Support\Registry\FakeCompanyRegistry
        App\Party\Application\VatRegistry:
            alias: App\Tests\Support\Registry\FakeVatRegistry
        App\Party\Application\VatPayerReliability:
            alias: App\Tests\Support\Registry\FakeVatPayerReliability
        App\Tests\Support\Registry\FakeCompanyRegistry: ~
        App\Tests\Support\Registry\FakeVatRegistry: ~
        App\Tests\Support\Registry\FakeVatPayerReliability: ~

        # Public handles for tests/e2e/seed.php.
        e2e.tenant_context:
            alias: App\Tenancy\Application\TenantContext
            public: true
        e2e.create_party:
            alias: App\Party\Application\CreateParty
            public: true
        e2e.registration_numbers:
            alias: App\Party\Application\RegistrationNumberFactory
            public: true
        e2e.password_hashers:
            alias: Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactoryInterface
            public: true
        e2e.entity_manager:
            alias: Doctrine\ORM\EntityManagerInterface
            public: true

        # Nothing is ever sent from the browser tests.
        App\Invoicing\Application\MailGateway:
            alias: App\Tests\Support\Mail\RecordingMailGateway
            public: true
        App\Tests\Support\Mail\RecordingMailGateway: ~
        # ...and no browser test asks a real DNS server for a mail host.
        App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy:
            arguments:
                $resolver: !closure '@App\Tests\Support\Mail\ExampleHostResolver'
        App\Tests\Support\Mail\ExampleHostResolver: ~
        e2e.mail_secrets:
            alias: App\Invoicing\Application\MailSecrets
            public: true
        e2e.issue_invoice:
            alias: App\Invoicing\Application\IssueInvoice
            public: true
        e2e.send_invoice:
            alias: App\Invoicing\Application\SendInvoice
            public: true
        e2e.link_tokens:
            alias: App\Invoicing\Application\LinkTokens
            public: true
        e2e.save_recurring:
            alias: App\Invoicing\Application\SaveRecurringInvoice
            public: true
        e2e.recurring_lifecycle:
            alias: App\Invoicing\Application\RecurringLifecycle
            public: true
        e2e.issue_recurring:
            alias: App\Invoicing\Application\IssueRecurringOccurrence
            public: true

when@test:
    parameters:
        # Inside the test cache, so a test never writes to the real share directory.
        app.firm_image_dir: '%kernel.cache_dir%/firm-images'
        app.sent_documents_dir: '%kernel.cache_dir%/sent-documents'
        app.mail.allow_local_links: true

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # In memory, so lookups never leak between test runs.
        test.party_lookup_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.party_refresh_checks_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.registry_outgoing_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.login_throttling_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.mail_test_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.invoice_send_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.invoice_send_firm_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.document_link_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        # Lets a test spend the budget of a firm.
        test.invoice_send_firm_limiter:
            alias: limiter.invoice_send_firm
            public: true
        test.document_link_limiter:
            alias: limiter.document_link
            public: true

        # The generic audit query; the fake import target answers changedSince()
        # with it, while targets of the application check their own entities.
        App\Audit\Application\AuditTrail:
            alias: App\Audit\Infrastructure\Doctrine\DoctrineAuditTrail
            public: true

        # Lets a test make the gate's lock fail once.
        App\Tests\Import\Support\FlakyImportLock:
            decorates: App\Import\Application\ImportLock

        # A target living in memory, for the pipeline tests.
        App\Tests\Import\Support\FakeTarget:
            public: true
            tags: ['app.import_target']

        # The tests drive the import services directly, not only through the screens.
        App\Import\Application\StartImport: { public: true }
        App\Import\Application\ExportRecords: { public: true }
        App\Import\Application\ConfigureImport: { public: true }
        App\Import\Application\CheckImport: { public: true }
        App\Import\Application\RunImport: { public: true }
        App\Import\Application\UndoImport: { public: true }
        App\Import\Application\CancelImport: { public: true }
        App\Import\Application\ImportErrorFile: { public: true }

        # Public for the tests, which use the ports directly.
        App\Import\Application\Imports:
            alias: App\Import\Infrastructure\Doctrine\DoctrineImports
            public: true
        App\Import\Application\ProfileRepository:
            alias: App\Import\Infrastructure\Doctrine\DoctrineProfileRepository
            public: true
        App\Import\Application\ImportFiles:
            alias: App\Import\Infrastructure\LocalImportFiles
            public: true

        # Public for the tests and the worker of the parallel counter test, which use the ports directly.
        App\Invoicing\Application\NumberCounter:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineNumberCounter
            public: true
        App\Invoicing\Application\SeriesCatalog:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineSeriesCatalog
            public: true
        App\Party\Application\TransactionalWork:
            alias: App\Party\Infrastructure\Doctrine\DoctrineTransactionalWork
            public: true
        App\Invoicing\Application\FirmInvoicingSettings:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineFirmInvoicingSettings
            public: true
        App\Invoicing\Application\InvoiceStore:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineInvoiceStore
            public: true
        App\Invoicing\Application\InvoiceBalances:
            alias: App\Invoicing\Infrastructure\Doctrine\DueDateBalances
            public: true
        test.invoice_balances:
            alias: App\Invoicing\Application\InvoiceBalances
            public: true
        App\Invoicing\Application\ConflictRetry:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineConflictRetry
            public: true
        App\Invoicing\Application\IssueInvoice: { public: true }
        App\Invoicing\Application\EditInvoice: { public: true }
        App\Party\Application\ContactSettingsForFirm: { public: true }
        App\Invoicing\Application\NewInvoiceDefaults: { public: true }
        App\Invoicing\Application\CustomerPicker: { public: true }
        App\Invoicing\Application\TrashInvoice: { public: true }
        App\Invoicing\Application\MarkDelivered: { public: true }
        App\Invoicing\Application\IssuedDocumentFactory: { public: true }
        App\Invoicing\Application\IssueRules: { public: true }
        App\Invoicing\Application\CustomerCopies: { public: true }
        App\Invoicing\Application\LinePricing: { public: true }
        App\Invoicing\Application\NumberAllocator: { public: true }
        # The recurring templates and their daily run, for the tests that drive them directly.
        App\Invoicing\Application\SaveRecurringInvoice: { public: true }
        App\Invoicing\Application\IssueRecurringInvoices: { public: true, tags: ['app.scheduled_job'] }
        App\Invoicing\Application\RecurringLifecycle: { public: true }
        App\Invoicing\Application\IssueRecurringOccurrence: { public: true }
        App\Invoicing\Application\RecurringInvoices:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineRecurringInvoices
            public: true

        # A scheduled job that counts its runs, and the run records it is claimed through.
        App\Tests\Tenancy\Support\CountingJob:
            tags: ['app.scheduled_job']
        App\Tenancy\Application\Schedule\ScheduledJobRuns:
            alias: App\Tenancy\Infrastructure\Schedule\DoctrineScheduledJobRuns
            public: true
        # Nothing uses the tenant's clock yet; the jobs that will are on their way.
        App\Tenancy\Application\TenantClock: { public: true }

        # Tests never send mail: the gateway records instead.
        App\Invoicing\Application\MailGateway:
            alias: App\Tests\Support\Mail\RecordingMailGateway
            public: true
        App\Tests\Support\Mail\RecordingMailGateway: ~
        App\Invoicing\Application\MailServers:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailServers
            public: true
        App\Invoicing\Application\MailSecrets:
            alias: App\Invoicing\Infrastructure\Mail\SodiumMailSecrets
            public: true
        App\Invoicing\Application\MailHostPolicy:
            alias: App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy
            public: true
        # No test asks a real DNS server for a mail host.
        App\Invoicing\Infrastructure\Mail\DnsMailHostPolicy:
            arguments:
                $resolver: !closure '@App\Tests\Support\Mail\ExampleHostResolver'
        App\Tests\Support\Mail\ExampleHostResolver: ~
        App\Invoicing\Application\MailTemplates:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineMailTemplates
            public: true
        App\Invoicing\Application\MailVariables: { public: true }
        App\Invoicing\Application\SendInvoice: { public: true }
        App\Invoicing\Application\LinkTokens:
            public: true
            arguments:
                $secret: '%kernel.secret%'
        App\Invoicing\Application\InvoiceSends:
            alias: App\Invoicing\Infrastructure\Doctrine\DoctrineInvoiceSends
            public: true
        App\Invoicing\Application\DocumentLinks:
            alias: App\Invoicing\Infrastructure\Mail\RouterDocumentLinks
            public: true
        App\Invoicing\Application\SentFiles:
            alias: App\Invoicing\Infrastructure\Mail\DiskSentFiles
            public: true

        # Stands in for a plugin adding a sidebar item.
        App\Tests\Ui\Support\TestNavigationProvider: ~
        App\Tests\Ui\Support\ShellProbeController: ~
        App\Ui\Controller\CatalogueController: ~

        # Registry adapters are replaced by fixture-backed fakes: no test ever calls a live register.
        App\Party\Application\CompanyRegistry:
            alias: App\Tests\Support\Registry\FakeCompanyRegistry
            public: true
        App\Party\Application\VatRegistry:
            alias: App\Tests\Support\Registry\FakeVatRegistry
            public: true
        App\Party\Application\VatPayerReliability:
            alias: App\Tests\Support\Registry\FakeVatPayerReliability
            public: true
        App\Tests\Support\Registry\FakeCompanyRegistry: ~
        App\Tests\Support\Registry\FakeVatRegistry: ~
        App\Tests\Support\Registry\FakeVatPayerReliability: ~

        # Lets a test make storing a party fail with a domain error after it was written.
        App\Tests\Party\Infrastructure\Support\RejectingParties:
            decorates: App\Party\Application\Parties

        # Lets a test lose the race for a registration number: the form check sees no other firm.
        App\Tests\Party\Infrastructure\Support\RacingLegalEntities:
            decorates: App\Party\Application\LegalEntities

        # Public alias in the test env only, so the wiring of the factory can be tested.
        test.registration_number_factory:
            alias: App\Party\Application\RegistrationNumberFactory
            public: true

        # The default logger writes to stderr. Tests log expected errors (404, invalid CSRF), and
        # Infection aborts its initial test run on any stderr output, so the test log goes to a file.
        logger:
            class: Symfony\Component\HttpKernel\Log\Logger
            arguments:
                $minLevel: info
                $output: '%kernel.cache_dir%/test.log'
