# Automatic reminders of overdue invoices. Without recorded payments every paid
# invoice would look unpaid, so the switch stays off while the bound
# InvoiceBalances is not authoritative; the tests and the browser tests may
# switch it on regardless. PaymentBalances, bound by default, is authoritative.
parameters:
    app.reminders.allow_without_payments: false

when@test:
    parameters:
        app.reminders.allow_without_payments: true

when@e2e:
    parameters:
        app.reminders.allow_without_payments: true
