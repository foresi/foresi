# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions
        height: '1em'
        width: '1em'

    # Throw an exception if an icon is not found (icons are locked in assets/icons)
    ignore_not_found: false


when@dev:
    ux_icons:
        # Nothing is fetched from the Iconify API at runtime. Add icons with
        # `bin/console ux:icons:import lucide:<name>` and commit them.
        iconify:
            enabled: false

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
