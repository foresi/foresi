doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        # Each module's bundle maps its own entities and adds its types and functions
        # (Foresi\Shared\Infrastructure\Module\ModuleBundle).

# The end-to-end environment (tests/e2e) owns its databases, one SQLite file per world under
# var/e2e. Only the world's name comes from the environment (tests/e2e/world.php checks it), so
# no local .env file can ever point the browser tests at real data.
when@e2e:
    parameters:
        env(E2E_WORLD): 'main'
    doctrine:
        dbal:
            url: 'sqlite:///%kernel.project_dir%/var/e2e/%env(E2E_WORLD)%.db'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
