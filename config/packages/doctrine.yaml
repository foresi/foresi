doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            vat_id: Foresi\Party\Infrastructure\Doctrine\VatIdType

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain'
                prefix: 'Foresi\Shared\Domain'
                alias: Shared
            Instance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Instance/Domain'
                prefix: 'Foresi\Instance\Domain'
                alias: Instance
            Party:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Party/Domain'
                prefix: 'Foresi\Party\Domain'
                alias: Party
            Invoicing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Invoicing/Domain'
                prefix: 'Foresi\Invoicing\Domain'
                alias: Invoicing
            Banking:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Banking/Domain'
                prefix: 'Foresi\Banking\Domain'
                alias: Banking
            Import:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Import/Domain'
                prefix: 'Foresi\Import\Domain'
                alias: Import
            Idoklad:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Idoklad/Domain'
                prefix: 'Foresi\Idoklad\Domain'
                alias: Idoklad
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'Foresi\Identity\Domain'
                alias: Identity
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Domain'
                prefix: 'Foresi\Audit\Domain'
                alias: Audit
            Work:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Work/Domain'
                prefix: 'Foresi\Work\Domain'
                alias: Work
            Timesheet:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Timesheet/Domain'
                prefix: 'Foresi\Timesheet\Domain'
                alias: Timesheet
            Attachment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Attachment/Domain'
                prefix: 'Foresi\Attachment\Domain'
                alias: Attachment
            CashFlow:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CashFlow/Domain'
                prefix: 'Foresi\CashFlow\Domain'
                alias: CashFlow
            Purchasing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Purchasing/Domain'
                prefix: 'Foresi\Purchasing\Domain'
                alias: Purchasing
            ExchangeRate:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ExchangeRate/Domain'
                prefix: 'Foresi\ExchangeRate\Domain'
                alias: ExchangeRate
            Webhooks:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Webhooks/Domain'
                prefix: 'Foresi\Webhooks\Domain'
                alias: Webhooks
        dql:
            string_functions:
                CAST_TEXT: Foresi\Party\Infrastructure\Doctrine\CastTextFunction

when@test:
    doctrine:
        orm:
            mappings:
                SharedFixtures:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Shared/Fixtures'
                    prefix: 'Foresi\Tests\Shared\Fixtures'
                    alias: SharedFixtures
                AuditFixtures:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Audit/Fixtures'
                    prefix: 'Foresi\Tests\Audit\Fixtures'
                    alias: AuditFixtures

# The end-to-end environment (tests/e2e) owns its databases, one SQLite file per world under
# var/e2e. Only the world's name comes from the environment (tests/e2e/world.php checks it), so
# no local .env file can ever point the browser tests at real data.
when@e2e:
    parameters:
        env(E2E_WORLD): 'main'
    doctrine:
        dbal:
            url: 'sqlite:///%kernel.project_dir%/var/e2e/%env(E2E_WORLD)%.db'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
