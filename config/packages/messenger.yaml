framework:
    messenger:
        failure_transport: failed

        # A message that cannot be read goes to the failed transport instead of being lost.
        serializer:
            default_serializer: App\Shared\Infrastructure\Messenger\KeepUndecodableMessages

        transports:
            # Default queue. redeliver_timeout must exceed the longest handler, or a slow
            # message is delivered to a second worker while the first is still on it.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    redeliver_timeout: 7200
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 4
            # Low priority: public register re-checks. Consume it after async.
            registry:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: registry
                    redeliver_timeout: 7200
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 4
            # Outgoing mail, apart so a slow mail server never holds up other work. The
            # retries wait 1, 4, 16, 64 and 256 minutes, about 5.7 hours in all, which
            # outlasts greylisting. A permanent refusal skips them.
            mail:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: mail
                    redeliver_timeout: 600
                retry_strategy:
                    max_retries: 5
                    delay: 60000
                    multiplier: 4
            # The relay of domain events and their delivery to async listeners. On the
            # database connection, so the relay stores its deliveries in its own
            # transaction. A listener that fails is retried after 5 s, 30 s, 3 min,
            # 18 min and 1.8 h, about 2.1 hours in all.
            events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: events
                    redeliver_timeout: 600
                retry_strategy:
                    max_retries: 5
                    delay: 5000
                    multiplier: 6
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: failed

        buses:
            messenger.bus.default:
                middleware:
                    - App\Tenancy\Infrastructure\Messenger\TenantMiddleware
                    # A delivery waiting for another worker's lease is put back, not retried.
                    - App\Invoicing\Infrastructure\Messenger\WaitForLeaseMiddleware

        routing:
            # The import pipeline: one message per chunk, so a crash loses one chunk, not the import.
            App\Import\Application\Message\ReadImportFile: async
            App\Import\Application\Message\CheckImportChunk: async
            App\Import\Application\Message\RunImportChunk: async
            App\Import\Application\Message\ArchiveMissing: async
            App\Import\Application\Message\UndoImportChunk: async
            # The pulls, checks and runs of the move from iDoklad.
            App\Idoklad\Application\Message\ProcessIdokladJob: async
            # Imported contacts are checked in the public registers later, at low priority.
            App\Party\Application\RecheckRegistry: registry
            # Timed work: the schedule ticks, and each due job runs in its tenant.
            App\Tenancy\Application\Schedule\RunScheduledJob: async
            # Operator tasks, such as polling the bank inbox, run with no tenant.
            App\Tenancy\Application\Schedule\RunOperatorTask: async
            # Inbound bank mail is processed in its tenant after it was stored.
            App\Banking\Application\ProcessInboundMessage: async
            # A recurring template saved or resumed after the day's run, issued at once.
            App\Invoicing\Application\IssueRecurringTemplate: async
            # Sending documents by e-mail, on its own queue.
            App\Invoicing\Application\DeliverInvoiceSend: mail
            # The delayed e-mail of a mention or an assignment, decided in its tenant; it queues system mail.
            App\Work\Application\SendNotificationMail: async
            # Mail of the installation itself, such as invitations, with the same retries.
            App\Shared\Application\SystemMail: mail
            # A commit that recorded events asks the relay to number and enqueue them.
            App\Events\Application\RelayEvents: events
            # Each event once to each async listener, in the event's tenant.
            App\Events\Application\DeliverEvent: events

# The end-to-end environment has no worker: messages are handled inline.
when@e2e:
    framework:
        messenger:
            transports:
                async: 'sync://'
                registry: 'sync://'
                mail: 'sync://'
                events: 'sync://'
                failed: 'in-memory://'
