security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The inbound mail webhook checks its own bearer secret: no user and no session.
        inbound_mail:
            pattern: ^/inbound/mail$
            stateless: true
        # The health endpoint for an uptime monitor: no user and no session.
        health:
            pattern: ^/health$
            stateless: true
        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard

            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

            login_throttling:
                max_attempts: 5
                interval: '1 minute'

            # The code step after the password; see config/packages/scheb_2fa.yaml.
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: app_dashboard
                enable_csrf: true
                csrf_token_id: two_factor
                auth_code_parameter_name: _auth_code
                trusted_parameter_name: _trusted

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Signing out stays possible halfway through the code step.
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        # The code step, between the password and the full sign-in.
        - { path: ^/login/code, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # The development catalogue shows no data; its route exists in dev and test only.
        - { path: ^/_catalogue$, roles: PUBLIC_ACCESS }
        # Links to sent documents, opened by customers from their mail.
        - { path: ^/d/, roles: PUBLIC_ACCESS }
        # Raw bank mail from a relay, which proves itself with the webhook secret.
        - { path: ^/inbound/mail$, roles: PUBLIC_ACCESS }
        # Numbers about the installation only, for an uptime monitor.
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # Invitation links, opened before the invited person has an account or has signed in.
        - { path: ^/invitation/, roles: PUBLIC_ACCESS }
        # The signed link in a notification e-mail that stops that kind of e-mail, and its one-click POST.
        - { path: ^/unsubscribe/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        firewalls:
            main:
                login_throttling:
                    # In memory, so attempts never leak between test runs.
                    storage_service: test.login_throttling_storage
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
