# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true
    csrf_protection: true

    rate_limiter:
        # Outgoing calls to public registers. PublicRegistryClient keys the limiter by registry
        # name (ares, vies, adis), so each host gets its own budget of 300 calls per minute.
        # ARES may restrict clients above 500 queries per minute; stay well under that.
        registry_outgoing:
            policy: sliding_window
            limit: 300
            interval: '1 minute'

        # Registry lookups of the contact form, per signed-in user.
        party_lookup:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

        # Manual "refresh checks" on a contact, per signed-in user.
        party_refresh_checks:
            policy: sliding_window
            limit: 10
            interval: '1 minute'

        # Test e-mails of a firm's mail server, per signed-in user.
        mail_test:
            policy: sliding_window
            limit: 5
            interval: '1 minute'

        # Documents sent by e-mail, per signed-in user and per firm.
        invoice_send:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        invoice_send_firm:
            policy: sliding_window
            limit: 500
            interval: '1 day'

        # Public links to sent documents, per client address.
        document_link:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

        # The inbound mail webhook, per client address, counted before its secret is checked.
        inbound_mail:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

    #esi: true
    #fragments: true

when@test:
    framework:
        rate_limiter:
            party_lookup:
                storage_service: test.party_lookup_storage
            party_refresh_checks:
                storage_service: test.party_refresh_checks_storage
            registry_outgoing:
                storage_service: test.registry_outgoing_storage
            mail_test:
                storage_service: test.mail_test_storage
            invoice_send:
                storage_service: test.invoice_send_storage
            invoice_send_firm:
                storage_service: test.invoice_send_firm_storage
            document_link:
                storage_service: test.document_link_storage
            inbound_mail:
                storage_service: test.inbound_mail_storage
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@e2e:
    framework:
        # Fixed here so the browser tests need no local .env file; never used outside tests/e2e.
        secret: 'e2e-only-secret-not-for-real-use'
