name: Release

# Every merge to main whose Conventional Commit type is feat, fix or perf, or
# which is breaking, is published as a release; see .github/scripts/release.sh.
# A run publishes whatever is missing since the newest release, so a queued run
# replaced by a newer one loses nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creating releases and tags needs write access; reading the notes from the
    # merged pull request needs read access to pull requests.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # gh authenticates with GH_TOKEN; git never pushes in this job.
          persist-credentials: false

      - name: Publish the releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh

      # Releases made with the workflow token start no other workflow, so the
      # website, whose release pages read them, is asked to rebuild here.
      - name: Rebuild the website
        if: steps.release.outputs.published != '0'
        env:
          DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "WEBSITE_DEPLOY_HOOK is not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$DEPLOY_HOOK" > /dev/null

  # Splits every package into its read-only repository foresi/<name> (ADR 0034,
  # Distribution), after the release so that a tag cut by this run goes along.
  # It runs here and not on its own push trigger because tags made with the
  # workflow token start no other workflow. Until the SPLIT_TOKEN secret exists
  # it does nothing; tags are pushed only from the repository variable
  # SPLIT_SINCE on, the first lockstep tag.
  split:
    name: Split packages
    needs: release
    if: github.repository == 'foresi/foresi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release job may have cut a tag after this run started.
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # The pushes authenticate with SPLIT_TOKEN, not the workflow token.
          persist-credentials: false

      - name: Split and push
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          SPLIT_SINCE: ${{ vars.SPLIT_SINCE }}
        run: |
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "SPLIT_TOKEN is not set; nothing to do."
            exit 0
          fi
          .github/scripts/split.sh --push ${SPLIT_SINCE:+--since "$SPLIT_SINCE"}

  # Tells the instances that follow every release that the split is done, so
  # they update now instead of at their next scheduled check: a
  # repository_dispatch of type foresi-release to each repository in the secret
  # RELEASE_DISPATCH_REPOSITORIES (owner/name, separated by spaces), with the
  # token RELEASE_DISPATCH_TOKEN (Contents: read and write on those
  # repositories). Both are secrets so that this public workflow names no
  # private repository. Without them it does nothing.
  dispatch:
    name: Notify instances
    needs: split
    if: github.repository == 'foresi/foresi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          REPOSITORIES: ${{ secrets.RELEASE_DISPATCH_REPOSITORIES }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$REPOSITORIES" ]; then
            echo "RELEASE_DISPATCH_TOKEN or RELEASE_DISPATCH_REPOSITORIES is not set; nothing to do."
            exit 0
          fi
          failed=0
          for repository in $REPOSITORIES; do
            echo "::add-mask::$repository"
            if gh api --silent -X POST "repos/$repository/dispatches" -f event_type=foresi-release; then
              echo "notified one instance"
            else
              echo "::error title=Dispatch::an instance repository refused the dispatch"
              failed=1
            fi
          done
          exit $failed
