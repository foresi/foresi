name: Mutation testing (full)

# The pull request run skips mutants whose tests are slow (see infection.json5).
# This run skips none, with the same thresholds.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infection:
    name: Mutation testing (full)
    # Scheduled runs happen on the default branch; a manual run can pick another ref.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          coverage: pcov
          tools: composer:v2
          # Same upload limits as docs/import.md asks of a server; the upload tests rely on them.
          ini-values: upload_max_filesize=64M, post_max_size=64M

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Mutation testing, no mutant skipped
        run: composer infection:full
