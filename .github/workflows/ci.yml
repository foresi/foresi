name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A new push to a pull request replaces the run still going for it. Runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SQLite leg. The test environment uses an in-memory database (.env.test),
  # which every parallel Infection process gets for itself, so no DATABASE_URL
  # is set here. The migrations run against the dev database, var/data.db.
  quality:
    name: Quality gate (sqlite)
    runs-on: ubuntu-latest
    # Mutation testing skips no mutant and dominates the run time.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, dom, gd, iconv, intl, pdo_sqlite, pdo_pgsql
          coverage: pcov
          tools: composer:v2
          # Same upload limits as docs/import.md asks of a server; the upload tests rely on them.
          ini-values: upload_max_filesize=64M, post_max_size=64M

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # veraPDF checks the invoice PDFs against PDF/A-3a. The installer is pinned
      # by SHA-256, and a missing binary fails the tests instead of skipping them.
      - name: Set up Java for veraPDF
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install veraPDF
        env:
          VERAPDF_VERSION: 1.30.3
          VERAPDF_SHA256: b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verapdf-installer"
          cd "$RUNNER_TEMP/verapdf-installer"
          curl -fsSL -o installer.zip "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          echo "${VERAPDF_SHA256}  installer.zip" | sha256sum --check
          unzip -q installer.zip
          cat > auto-install.xml <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>${RUNNER_TEMP}/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select"><pack index="0" name="veraPDF Runtime" selected="true"/><pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/></com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "verapdf-greenfield-${VERAPDF_VERSION}/verapdf-izpack-installer-${VERAPDF_VERSION}.jar" auto-install.xml
          echo "${RUNNER_TEMP}/verapdf" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/verapdf/verapdf" --version

      # The invoice PDF tests read the file with Poppler, as a person's tools would.
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The ISDOC schema has no stated licence, so it is fetched, not committed. The
      # script refuses a file whose SHA-256 differs from the one it pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/isdoc-schema
          key: isdoc-schema-${{ hashFiles('bin/fetch-isdoc-schema') }}

      - name: Fetch the ISDOC schema
        run: composer isdoc:schema

      - name: Migrations match the mapping
        run: |
          bin/console doctrine:migrations:migrate --no-interaction
          bin/console doctrine:schema:validate

      # Every reversible migration goes down and up again; see the script for
      # the migrations that are irreversible by design.
      - name: Migration round trip
        run: bin/migration-roundtrip

      - name: Quality gate
        env:
          REQUIRE_VERAPDF: '1'
          REQUIRE_ISDOC_SCHEMA: '1'
          REQUIRE_POPPLER: '1'
        run: composer qa

      - name: Mutation testing
        run: composer infection

      # A production build must fail on any missing asset or import. Strict
      # missing_import_mode makes asset-map:compile throw; the output is also
      # checked for warnings.
      - name: Frontend build (prod)
        shell: bash
        env:
          APP_ENV: prod
          APP_SECRET: ci-build-only
        run: |
          set -euo pipefail
          for step in "importmap:install" "tailwind:build --minify" "asset-map:compile"; do
            log="build-${step%% *}.log"
            # shellcheck disable=SC2086
            bin/console $step > "$log" 2>&1 || { cat "$log"; exit 1; }
            cat "$log"
            if grep -iE 'warning|unable to find|could not be found' "$log"; then exit 1; fi
          done

      - name: Security audit
        run: composer audit

  # PostgreSQL leg. Static analysis does not depend on the database, so only
  # migrations, mapping and the test suite run here. Infection is not run:
  # its parallel processes would share this one database.
  postgres:
    name: Tests (postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, dom, gd, iconv, intl, pdo_sqlite, pdo_pgsql
          coverage: pcov
          tools: composer:v2
          # Same upload limits as docs/import.md asks of a server; the upload tests rely on them.
          ini-values: upload_max_filesize=64M, post_max_size=64M

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # veraPDF checks the invoice PDFs against PDF/A-3a. The installer is pinned
      # by SHA-256, and a missing binary fails the tests instead of skipping them.
      - name: Set up Java for veraPDF
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install veraPDF
        env:
          VERAPDF_VERSION: 1.30.3
          VERAPDF_SHA256: b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verapdf-installer"
          cd "$RUNNER_TEMP/verapdf-installer"
          curl -fsSL -o installer.zip "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          echo "${VERAPDF_SHA256}  installer.zip" | sha256sum --check
          unzip -q installer.zip
          cat > auto-install.xml <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>${RUNNER_TEMP}/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select"><pack index="0" name="veraPDF Runtime" selected="true"/><pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/></com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "verapdf-greenfield-${VERAPDF_VERSION}/verapdf-izpack-installer-${VERAPDF_VERSION}.jar" auto-install.xml
          echo "${RUNNER_TEMP}/verapdf" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/verapdf/verapdf" --version

      # The invoice PDF tests read the file with Poppler, as a person's tools would.
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The ISDOC schema has no stated licence, so it is fetched, not committed. The
      # script refuses a file whose SHA-256 differs from the one it pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/isdoc-schema
          key: isdoc-schema-${{ hashFiles('bin/fetch-isdoc-schema') }}

      - name: Fetch the ISDOC schema
        run: composer isdoc:schema

      - name: Migrations match the mapping
        run: |
          bin/console doctrine:migrations:migrate --no-interaction
          bin/console doctrine:schema:validate

      # Every reversible migration goes down and up again; see the script for
      # the migrations that are irreversible by design.
      - name: Migration round trip
        run: bin/migration-roundtrip

      # The tests build their own schema with the schema tool, which cannot
      # drop the foreign keys the migrations named, so start from an empty database.
      - name: Reset the database
        run: bin/console doctrine:schema:drop --full-database --force

      - name: Tests
        env:
          REQUIRE_VERAPDF: '1'
          REQUIRE_ISDOC_SCHEMA: '1'
          REQUIRE_POPPLER: '1'
        run: composer phpunit

  # The next PHP release. composer.json allows it (>=8.4), so the test suite
  # runs on it too, on the in-memory SQLite database of the test environment.
  php85:
    name: Tests (php 8.5, sqlite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: ctype, dom, gd, iconv, intl, pdo_sqlite
          tools: composer:v2
          # Same upload limits as docs/import.md asks of a server; the upload tests rely on them.
          ini-values: upload_max_filesize=64M, post_max_size=64M

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The ISDOC schema has no stated licence, so it is fetched, not committed. The
      # script refuses a file whose SHA-256 differs from the one it pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/isdoc-schema
          key: isdoc-schema-${{ hashFiles('bin/fetch-isdoc-schema') }}

      - name: Fetch the ISDOC schema
        run: composer isdoc:schema

      - name: Tests
        run: composer phpunit
