name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev): publishes the result for the badge
# in the README and uploads the findings to code scanning. Not a check of pull
# requests. The scorecard job may use only the actions the publishing API
# allows (checkout, upload-artifact, upload-sarif, scorecard-action) and no
# workflow-level env or defaults.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard
    if: github.repository == 'foresi/foresi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
