name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Dev dependencies are needed: the e2e environment uses the registry fakes of the test suite.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: bin/console importmap:install

      - name: Build styles
        run: bin/console tailwind:build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Screenshot baselines are kept per platform. Linux baselines are generated on request or when none are committed yet. Decided before the
      # tests run, because generating them creates the files the check looks for.
      - name: Decide whether to generate Linux screenshot baselines
        id: baselines
        env:
          REQUESTED: ${{ inputs.update-snapshots }}
          NONE_COMMITTED: ${{ hashFiles('tests/e2e/screenshots/desktop-linux/**') == '' }}
        run: |
          if [ "$REQUESTED" = "true" ] || [ "$NONE_COMMITTED" = "true" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

      # While baselines are being generated, the screenshot specs (tagged @visual) are skipped here.
      - name: End-to-end, accessibility, layout and screenshot tests
        working-directory: tests/e2e
        env:
          GENERATING: ${{ steps.baselines.outputs.generate }}
        run: |
          if [ "$GENERATING" = "true" ]; then
            npx playwright test --grep-invert @visual
          else
            npx playwright test
          fi

      - name: Generate Linux screenshot baselines
        if: ${{ steps.baselines.outputs.generate == 'true' }}
        working-directory: tests/e2e
        run: npx playwright test --grep @visual --update-snapshots=all

      - name: Upload the Linux screenshot baselines
        if: ${{ steps.baselines.outputs.generate == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-linux
          path: tests/e2e/screenshots/*-linux/
          retention-days: 7

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
