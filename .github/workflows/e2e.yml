name: E2E

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main before it lands.
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The browser tests in four shards side by side, each with its own server and freshly
  # seeded database. Playwright splits them by file, so a file of tests that write data
  # still runs whole and in order. The job named "E2E" below is the required check.
  shard:
    name: E2E (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, gd, iconv, intl, pdo_sqlite
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Dev dependencies are needed: the e2e environment uses the registry fakes of the test suite.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: bin/console importmap:install

      - name: Build styles
        run: bin/console tailwind:build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Screenshot tests (tagged @visual) are off while the layout redesign keeps changing the UI;
      # playwright.config.ts skips them. They come back afterwards on a few key screens.
      - name: End-to-end, accessibility and layout tests
        working-directory: tests/e2e
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --shard="${SHARD}/4"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  # The required check. It stays named "E2E" and passes only when every shard passed.
  e2e:
    name: E2E
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Shards: ${SHARDS}"
          [ "${SHARDS}" = success ]
