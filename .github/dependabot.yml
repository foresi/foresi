version: 2
updates:
  # Actions are pinned to full commit SHAs with the version in a trailing
  # comment; Dependabot updates both together.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    # Foresi stays on the Symfony 7.4 LTS line until its support ends; a move to
    # a new major version is a planned upgrade, not a weekly bump.
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
    # One pull request a week for the minor and patch updates; a major version
    # keeps a pull request of its own, so it can be judged on its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The end-to-end test tooling (Playwright, axe).
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      e2e-tooling:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
