# SPDX-License-Identifier: AGPL-3.0-only
# Architecture rules (see docs/adr/0002-modular-monolith.md). Domain depends on
# the shared kernel only: Shared Domain plus the Tenancy and Audit domain
# contracts (TenantOwned/TenantId, Audited/AuditExcluded), and Doctrine ORM
# mapping attributes. A module's Domain may reference another module's Domain
# only where declared below (Identity -> Party). Tenancy and Audit, the base
# modules, never depend on the modules built on them. Raw DBAL connections are
# allowed in Infrastructure only.
deptrac:
  paths:
    - src
  layers:
    - name: SharedDomain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: SharedApplication
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    # The contract of a module: its published events and their kind. Depends on the shared domain only.
    - name: Contract
      collectors:
        - type: classLike
          value: ^App\\[A-Za-z]+\\Contract\\.*
    - name: SharedInfrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*
    - name: TenancyDomain
      collectors:
        - type: directory
          value: src/Tenancy/Domain/.*
    - name: TenancyApplication
      collectors:
        - type: directory
          value: src/Tenancy/Application/.*
    - name: TenancyInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Tenancy/Infrastructure/.*
          must_not:
            - type: classLike
              value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
            - type: classLike
              value: ^App\\Tenancy\\Infrastructure\\Messenger\\TenantStamp$
    # The sanctioned cross-tenant read; the only Tenancy infrastructure other modules may use.
    - name: TenantFilterBypass
      collectors:
        - type: classLike
          value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
    # The tenant a queued message belongs to, which a listener outside the handler reads.
    - name: TenantStamp
      collectors:
        - type: classLike
          value: ^App\\Tenancy\\Infrastructure\\Messenger\\TenantStamp$
    - name: PartyDomain
      collectors:
        - type: directory
          value: src/Party/Domain/.*
    - name: PartyApplication
      collectors:
        - type: directory
          value: src/Party/Application/.*
    - name: PartyInfrastructure
      collectors:
        - type: directory
          value: src/Party/Infrastructure/.*
    - name: ImportDomain
      collectors:
        - type: directory
          value: src/Import/Domain/.*
    - name: ImportApplication
      collectors:
        - type: directory
          value: src/Import/Application/.*
    - name: ImportInfrastructure
      collectors:
        - type: directory
          value: src/Import/Infrastructure/.*
    # Reads iDoklad accounts into a snapshot for the import; the vendor's names stay here.
    - name: IdokladDomain
      collectors:
        - type: directory
          value: src/Idoklad/Domain/.*
    - name: IdokladApplication
      collectors:
        - type: directory
          value: src/Idoklad/Application/.*
    - name: IdokladInfrastructure
      collectors:
        - type: directory
          value: src/Idoklad/Infrastructure/.*
    - name: IdentityDomain
      collectors:
        - type: directory
          value: src/Identity/Domain/.*
    - name: IdentityApplication
      collectors:
        - type: directory
          value: src/Identity/Application/.*
    - name: IdentityInfrastructure
      collectors:
        - type: directory
          value: src/Identity/Infrastructure/.*
    - name: AuditDomain
      collectors:
        - type: directory
          value: src/Audit/Domain/.*
    - name: AuditApplication
      collectors:
        - type: directory
          value: src/Audit/Application/.*
    - name: AuditInfrastructure
      collectors:
        - type: directory
          value: src/Audit/Infrastructure/.*
    # Domain events: the catalogue of contract events, and later their recording, relay and feed.
    - name: EventsDomain
      collectors:
        - type: directory
          value: src/Events/Domain/.*
    - name: EventsApplication
      collectors:
        - type: directory
          value: src/Events/Application/.*
    - name: EventsInfrastructure
      collectors:
        - type: directory
          value: src/Events/Infrastructure/.*
    # Outbound webhooks: endpoints that receive the domain events as signed requests.
    - name: WebhooksDomain
      collectors:
        - type: directory
          value: src/Webhooks/Domain/.*
    - name: WebhooksApplication
      collectors:
        - type: directory
          value: src/Webhooks/Application/.*
    - name: WebhooksInfrastructure
      collectors:
        - type: directory
          value: src/Webhooks/Infrastructure/.*
    - name: InvoicingDomain
      collectors:
        - type: directory
          value: src/Invoicing/Domain/.*
    - name: InvoicingApplication
      collectors:
        - type: directory
          value: src/Invoicing/Application/.*
    - name: InvoicingInfrastructure
      collectors:
        - type: directory
          value: src/Invoicing/Infrastructure/.*
    # Bank movements, inbound bank mail and pairing. The layers exist before all
    # their code does: a directory collector matching nothing is no error.
    - name: BankingDomain
      collectors:
        - type: directory
          value: src/Banking/Domain/.*
    - name: BankingApplication
      collectors:
        - type: directory
          value: src/Banking/Application/.*
    - name: BankingInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Banking/Infrastructure/.*
          must_not:
            - type: directory
              value: src/Banking/Infrastructure/Imap/.*
    # The IMAP adapter, the only code that may use the IMAP library and what it brings.
    - name: BankingImap
      collectors:
        - type: directory
          value: src/Banking/Infrastructure/Imap/.*
    # Projects and tasks of the organisation, shared by its firms.
    - name: WorkDomain
      collectors:
        - type: directory
          value: src/Work/Domain/.*
    - name: WorkApplication
      collectors:
        - type: directory
          value: src/Work/Application/.*
    - name: WorkInfrastructure
      collectors:
        - type: directory
          value: src/Work/Infrastructure/.*
    # Rates of time and, later, the invoicing of time. The layers exist before all
    # their code does: a directory collector matching nothing is no error.
    - name: TimesheetDomain
      collectors:
        - type: directory
          value: src/Timesheet/Domain/.*
    - name: TimesheetApplication
      collectors:
        - type: directory
          value: src/Timesheet/Application/.*
    - name: TimesheetInfrastructure
      collectors:
        - type: directory
          value: src/Timesheet/Infrastructure/.*
    # Files kept for records of any module; the owning module decides who reaches them.
    - name: AttachmentDomain
      collectors:
        - type: directory
          value: src/Attachment/Domain/.*
    - name: AttachmentApplication
      collectors:
        - type: directory
          value: src/Attachment/Application/.*
    - name: AttachmentInfrastructure
      collectors:
        - type: directory
          value: src/Attachment/Infrastructure/.*
    # Received documents: the cost side of a firm (ADR 0028).
    - name: PurchasingDomain
      collectors:
        - type: directory
          value: src/Purchasing/Domain/.*
    - name: PurchasingApplication
      collectors:
        - type: directory
          value: src/Purchasing/Application/.*
    - name: PurchasingInfrastructure
      collectors:
        - type: directory
          value: src/Purchasing/Infrastructure/.*
    # Exchange rates to CZK: the port, the store and the schedule. A source plugs in from a country module.
    - name: ExchangeRateDomain
      collectors:
        - type: directory
          value: src/ExchangeRate/Domain/.*
    - name: ExchangeRateApplication
      collectors:
        - type: directory
          value: src/ExchangeRate/Application/.*
    - name: ExchangeRateInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/ExchangeRate/Infrastructure/.*
          must_not:
            - type: directory
              value: src/ExchangeRate/Infrastructure/Schedule/.*
    # The one class that joins the rates to the schedule of the installation.
    - name: ExchangeRateSchedule
      collectors:
        - type: directory
          value: src/ExchangeRate/Infrastructure/Schedule/.*
    - name: CountryCzechRepublic
      collectors:
        - type: directory
          value: src/Country/CzechRepublic/.*
    # Presentation shared by all modules (Twig components, layout helpers).
    - name: Ui
      collectors:
        - type: directory
          value: src/Ui/.*
    - name: VendorSymfony
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Symfony\\
          must_not:
            - type: classLike
              value: ^Symfony\\Component\\Uid\\
            - type: classLike
              value: ^Symfony\\Component\\HtmlSanitizer\\
            - type: classLike
              value: ^Symfony\\AI\\McpBundle\\
    # The MCP SDK and its bundle, pre-1.0: only the adapter in the shared infrastructure may use them (ADR 0027).
    - name: VendorMcp
      collectors:
        - type: classLike
          value: ^(Mcp|Symfony\\AI\\McpBundle)\\
    # OpenAPI attributes of the REST endpoints; only infrastructure may use them.
    - name: VendorOpenApi
      collectors:
        - type: classLike
          value: ^(OpenApi|Nelmio\\ApiDocBundle)\\
    # symfony/uid is an internal detail of App\Shared\Domain\Id only.
    - name: VendorUid
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Uid\\
    - name: VendorBrick
      collectors:
        - type: classLike
          value: ^Brick\\(Money|Math)\\
    # Spreadsheets; only the infrastructure of Import and of Invoicing (the list for the accountant) may use it.
    - name: VendorOpenSpout
      collectors:
        - type: classLike
          value: ^OpenSpout\\
    # PDF rendering and barcodes; only the infrastructure of Invoicing (PDFs) and of Identity (the enrolment QR code) may use it.
    - name: VendorTecnick
      collectors:
        - type: classLike
          value: ^Com\\Tecnick\\
    # Logging handlers and processors; only the shared infrastructure may use it. Code logs through PSR-3.
    - name: VendorMonolog
      collectors:
        - type: classLike
          value: ^Monolog\\
    # MIME parsing; only the Banking module's infrastructure may use it.
    - name: VendorZbateson
      collectors:
        - type: classLike
          value: ^ZBateson\\
    # IMAP and the Laravel collections and Carbon it is built on; only the IMAP adapter may use them.
    - name: VendorImapEngine
      collectors:
        - type: classLike
          value: ^(DirectoryTree|Illuminate|Carbon)\\
    # Markdown parsing and HTML sanitizing; only the shared infrastructure may use them.
    - name: VendorCommonMark
      collectors:
        - type: classLike
          value: ^League\\CommonMark\\
    - name: VendorHtmlSanitizer
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\HtmlSanitizer\\
    # Which packages Composer installed; only the module registry in the shared infrastructure may ask.
    - name: VendorComposer
      collectors:
        - type: classLike
          value: ^Composer\\InstalledVersions$
    - name: VendorDoctrineOrmMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\ORM\\Mapping\\
    - name: VendorDbalConnection
      collectors:
        - type: classLike
          value: ^Doctrine\\DBAL\\Connection$
    - name: VendorDoctrine
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Doctrine\\
          must_not:
            - type: classLike
              value: ^Doctrine\\ORM\\Mapping\\
            - type: classLike
              value: ^Doctrine\\DBAL\\Connection$
  ruleset:
    SharedDomain:
      - Contract
      - VendorDoctrineOrmMapping
      # brick/money is an internal detail of App\Shared\Domain\Money only.
      - VendorBrick
      - VendorUid
    SharedApplication:
      - Contract
      - SharedDomain
      # The autoconfigure tag attribute of the listener ports.
      - VendorSymfony
    SharedInfrastructure:
      - Contract
      - SharedDomain
      - SharedApplication
      - VendorSymfony
      - VendorMonolog
      - VendorMcp
      - VendorOpenApi
      - VendorCommonMark
      - VendorHtmlSanitizer
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorComposer
    TenancyDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
    TenancyApplication:
      - Contract
      - TenancyDomain
      - SharedDomain
      - SharedApplication
    TenancyInfrastructure:
      - Contract
      - SharedInfrastructure
      - TenancyDomain
      - TenancyApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenantStamp
    TenantFilterBypass:
      - VendorDoctrine
      - TenancyInfrastructure
    TenantStamp:
      - VendorSymfony
    PartyDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      # TenantOwned / TenantId are the tenant-scoping contract of owned entities.
      - TenancyDomain
      # Party is audited: it implements the Audited marker.
      - AuditDomain
    PartyApplication:
      - Contract
      - PartyDomain
      # The image store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    PartyInfrastructure:
      - Contract
      - SharedInfrastructure
      - PartyDomain
      - TenancyDomain
      - PartyApplication
      - VendorSymfony
      - VendorOpenApi
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      # The history of a party reads its audit entries.
      - AuditDomain
      # Contributes the sidebar item and its count.
      - Ui
      # Contacts are an import target with a preset for the iDoklad export,
      # and the import screens link to the address book.
      - ImportDomain
      - ImportApplication
      - ImportInfrastructure
    ImportDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
    ImportApplication:
      - Contract
      - ImportDomain
      # The file store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    ImportInfrastructure:
      - Contract
      - SharedInfrastructure
      - ImportDomain
      - TenancyDomain
      - ImportApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorOpenSpout
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - IdentityDomain
      - AuditApplication
      # The import screens and the finish notice in the app shell.
      - Ui
    IdokladDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      # The credentials and the snapshot belong to a firm.
      - PartyDomain
    IdokladApplication:
      - Contract
      - IdokladDomain
      - SharedDomain
      - TenancyDomain
      - PartyDomain
      - PartyApplication
      # The client secret is sealed with the keys of the mail server passwords,
      # and the import creates series and moves their counters.
      - InvoicingApplication
      - InvoicingDomain
      # The import writes contacts through the contact import target, as a file import does.
      - ImportApplication
      - ImportDomain
      # The jobs of the move run in the tenant that asked for them.
      - TenancyApplication
    IdokladInfrastructure:
      - Contract
      - IdokladDomain
      - IdokladApplication
      # The import transaction binds the tenant again after a failure.
      - TenancyApplication
      - VendorSymfony
      - VendorDoctrine
      - SharedDomain
      - PartyDomain
      # The screens of the move: for the owner, of a firm, with the blockers of an undo and amounts as documents print them.
      - PartyApplication
      - IdentityApplication
      - InvoicingApplication
    IdentityDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      # Membership is tenant-owned and may link the party a user represents.
      - TenancyDomain
      - PartyDomain
      - AuditDomain
    IdentityApplication:
      - Contract
      - IdentityDomain
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - AuditApplication
      # An invitation and a membership link the contact a guest represents.
      - PartyDomain
    IdentityInfrastructure:
      - Contract
      - SharedInfrastructure
      # The QR code of the two-factor enrolment.
      - VendorTecnick
      - IdentityDomain
      - IdentityApplication
      - VendorSymfony
      - VendorOpenApi
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenantFilterBypass
      - TenancyApplication
      - PartyApplication
      - AuditApplication
      # The audit actor names its kind.
      - AuditDomain
      # The start page in the sidebar, for the staff or for a guest.
      - Ui
      # The user command links a guest user to a contact of the tenant.
      - PartyDomain
    AuditDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      # AuditEntry is tenant-owned.
      - TenancyDomain
    AuditApplication:
      - Contract
      - AuditDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    AuditInfrastructure:
      - Contract
      - SharedInfrastructure
      - AuditDomain
      # The created-entry path honours the tenant of TenantOwned entities.
      - TenancyDomain
      - AuditApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    InvoicingDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
    InvoicingApplication:
      - Contract
      - InvoicingDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
    InvoicingInfrastructure:
      - Contract
      - SharedInfrastructure
      - InvoicingDomain
      - InvoicingApplication
      - VendorSymfony
      - VendorOpenApi
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      # Also implements the Tenancy port TenantZoneFallback (FirmCountryZones):
      # Invoicing knows the firms and their countries, Tenancy never depends on it.
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
      - Ui
      - VendorTecnick
      - VendorOpenSpout
      # A failed delivery is recorded in the tenant of its message.
      - TenancyDomain
      - TenantStamp
      # The public link page reads the frozen data of a send across tenants.
      - TenantFilterBypass
    # Banking builds on Party and Invoicing; they never use Banking, which plugs
    # into them through the ports they declare.
    BankingDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
      - InvoicingDomain
    BankingApplication:
      - Contract
      - BankingDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
    BankingInfrastructure:
      - Contract
      - SharedInfrastructure
      - BankingDomain
      - BankingApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorZbateson
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
      # The secret token of an inbound address names its tenant: looked up across tenants.
      - TenantFilterBypass
      # The bank settings of a firm are for its owner.
      - IdentityApplication
      # Notices on every page about bank mail that needs someone.
      - Ui
    BankingImap:
      - BankingDomain
      - BankingApplication
      - VendorSymfony
      - VendorImapEngine
      - SharedDomain
      - SharedApplication
    # Work builds on Party (the client of a project) and Identity (the people
    # responsible for and watching a task); neither of them uses Work.
    WorkDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
      - IdentityDomain
    WorkApplication:
      - Contract
      - WorkDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
    WorkInfrastructure:
      - Contract
      - SharedInfrastructure
      - WorkDomain
      - WorkApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
      # The project screens, the sidebar item and "Shared with me".
      - Ui
      # The time report as CSV, as the address book and the invoice list export.
      - VendorOpenSpout
      # Who reaches the files of a task.
      - AttachmentDomain
      - AttachmentApplication
    # Timesheet builds on Work (projects and time), Party (clients and firms),
    # Identity (people) and Invoicing; none of them uses Timesheet, which reads
    # them through their application ports, as Banking reads Party.
    TimesheetDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - WorkDomain
      - PartyDomain
      - IdentityDomain
      - InvoicingDomain
    TimesheetApplication:
      - Contract
      - TimesheetDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - WorkDomain
      - WorkApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
      - InvoicingDomain
      - InvoicingApplication
    TimesheetInfrastructure:
      - Contract
      - SharedInfrastructure
      - TimesheetDomain
      - TimesheetApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - WorkDomain
      - WorkApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
      - InvoicingDomain
      - InvoicingApplication
      - Ui
    # Attachments build on Tenancy and Audit only; modules plug into them with
    # AttachmentAccess (Work -> Attachment), never the other way round.
    AttachmentDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
    AttachmentApplication:
      - Contract
      - AttachmentDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
    # Its controller is open to guests (Identity's OpenToGuest marker): what a
    # guest may see of a record is the module's AttachmentAccess to decide.
    AttachmentInfrastructure:
      - Contract
      - AttachmentDomain
      - AttachmentApplication
      - IdentityApplication
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - TenancyDomain
      - TenancyApplication
      - VendorSymfony
      - VendorDoctrine
      - VendorDoctrineOrmMapping
    # Purchasing builds on Party (firms and suppliers), Identity (people), the
    # attachment store, which keeps the original files, and the exchange rates;
    # no module uses Purchasing but the navigation of Ui, and it never uses
    # Invoicing.
    PurchasingDomain:
      - Contract
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
    PurchasingApplication:
      - Contract
      - PurchasingDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
      - AttachmentDomain
      - AttachmentApplication
      - ExchangeRateDomain
      - ExchangeRateApplication
      - VendorBrick
    PurchasingInfrastructure:
      - Contract
      - SharedInfrastructure
      - PurchasingDomain
      - PurchasingApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - IdentityDomain
      - IdentityApplication
      - AttachmentDomain
      - AttachmentApplication
      - Ui
    # A country module may implement the ports of Party Application (company and
    # tax registers). It reaches registers only through the shared registry client,
    # the one place that talks HTTP to public registers. It plugs its banks' mail
    # parsers into Banking.
    CountryCzechRepublic:
      - SharedDomain
      - SharedInfrastructure
      - ExchangeRateApplication
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
      - BankingDomain
      - BankingApplication
    EventsDomain:
      - Contract
      - SharedDomain
    EventsApplication:
      - Contract
      - EventsDomain
      - SharedDomain
