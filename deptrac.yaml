# SPDX-License-Identifier: AGPL-3.0-only
# Architecture rules (see docs/adr/0002-modular-monolith.md). Domain depends on
# the shared kernel only: Shared Domain plus the Tenancy and Audit domain
# contracts (TenantOwned/TenantId, Audited/AuditExcluded), and Doctrine ORM
# mapping attributes. A module's Domain may reference another module's Domain
# only where declared below (Identity -> Party). Tenancy and Audit, the base
# modules, never depend on the modules built on them. Raw DBAL connections are
# allowed in Infrastructure only.
deptrac:
  paths:
    - src
  layers:
    - name: SharedDomain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: SharedApplication
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    - name: SharedInfrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*
    - name: TenancyDomain
      collectors:
        - type: directory
          value: src/Tenancy/Domain/.*
    - name: TenancyApplication
      collectors:
        - type: directory
          value: src/Tenancy/Application/.*
    - name: TenancyInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Tenancy/Infrastructure/.*
          must_not:
            - type: classLike
              value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
    # The sanctioned cross-tenant read; the only Tenancy infrastructure other modules may use.
    - name: TenantFilterBypass
      collectors:
        - type: classLike
          value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
    - name: PartyDomain
      collectors:
        - type: directory
          value: src/Party/Domain/.*
    - name: PartyApplication
      collectors:
        - type: directory
          value: src/Party/Application/.*
    - name: PartyInfrastructure
      collectors:
        - type: directory
          value: src/Party/Infrastructure/.*
    - name: ImportDomain
      collectors:
        - type: directory
          value: src/Import/Domain/.*
    - name: ImportApplication
      collectors:
        - type: directory
          value: src/Import/Application/.*
    - name: ImportInfrastructure
      collectors:
        - type: directory
          value: src/Import/Infrastructure/.*
    - name: IdentityDomain
      collectors:
        - type: directory
          value: src/Identity/Domain/.*
    - name: IdentityApplication
      collectors:
        - type: directory
          value: src/Identity/Application/.*
    - name: IdentityInfrastructure
      collectors:
        - type: directory
          value: src/Identity/Infrastructure/.*
    - name: AuditDomain
      collectors:
        - type: directory
          value: src/Audit/Domain/.*
    - name: AuditApplication
      collectors:
        - type: directory
          value: src/Audit/Application/.*
    - name: AuditInfrastructure
      collectors:
        - type: directory
          value: src/Audit/Infrastructure/.*
    - name: InvoicingDomain
      collectors:
        - type: directory
          value: src/Invoicing/Domain/.*
    - name: InvoicingApplication
      collectors:
        - type: directory
          value: src/Invoicing/Application/.*
    - name: InvoicingInfrastructure
      collectors:
        - type: directory
          value: src/Invoicing/Infrastructure/.*
    - name: CountryCzechRepublic
      collectors:
        - type: directory
          value: src/Country/CzechRepublic/.*
    # Presentation shared by all modules (Twig components, layout helpers).
    - name: Ui
      collectors:
        - type: directory
          value: src/Ui/.*
    - name: VendorSymfony
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Symfony\\
          must_not:
            - type: classLike
              value: ^Symfony\\Component\\Uid\\
    # symfony/uid is an internal detail of App\Shared\Domain\Id only.
    - name: VendorUid
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Uid\\
    - name: VendorBrick
      collectors:
        - type: classLike
          value: ^Brick\\(Money|Math)\\
    # Spreadsheet reading; only the Import module's infrastructure may use it.
    - name: VendorOpenSpout
      collectors:
        - type: classLike
          value: ^OpenSpout\\
    # PDF rendering; only the Invoicing module's infrastructure may use it.
    - name: VendorTecnick
      collectors:
        - type: classLike
          value: ^Com\\Tecnick\\
    - name: VendorDoctrineOrmMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\ORM\\Mapping\\
    - name: VendorDbalConnection
      collectors:
        - type: classLike
          value: ^Doctrine\\DBAL\\Connection$
    - name: VendorDoctrine
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Doctrine\\
          must_not:
            - type: classLike
              value: ^Doctrine\\ORM\\Mapping\\
            - type: classLike
              value: ^Doctrine\\DBAL\\Connection$
  ruleset:
    SharedDomain:
      - VendorDoctrineOrmMapping
      # brick/money is an internal detail of App\Shared\Domain\Money only.
      - VendorBrick
      - VendorUid
    SharedApplication:
      - SharedDomain
    SharedInfrastructure:
      - SharedDomain
      - SharedApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
    TenancyDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
    TenancyApplication:
      - TenancyDomain
      - SharedDomain
      - SharedApplication
    TenancyInfrastructure:
      - SharedInfrastructure
      - TenancyDomain
      - TenancyApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
    TenantFilterBypass:
      - VendorDoctrine
      - TenancyInfrastructure
    PartyDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # TenantOwned / TenantId are the tenant-scoping contract of owned entities.
      - TenancyDomain
      # Party is audited: it implements the Audited marker.
      - AuditDomain
    PartyApplication:
      - PartyDomain
      # The image store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    PartyInfrastructure:
      - SharedInfrastructure
      - PartyDomain
      - TenancyDomain
      - PartyApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      # The history of a party reads its audit entries.
      - AuditDomain
      # Contributes the sidebar item and its count.
      - Ui
      # Contacts are an import target with a preset for the iDoklad export,
      # and the import screens link to the address book.
      - ImportDomain
      - ImportApplication
      - ImportInfrastructure
    ImportDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
    ImportApplication:
      - ImportDomain
      # The file store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    ImportInfrastructure:
      - SharedInfrastructure
      - ImportDomain
      - TenancyDomain
      - ImportApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorOpenSpout
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - IdentityDomain
      - AuditApplication
      # The import screens and the finish notice in the app shell.
      - Ui
    IdentityDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # Membership is tenant-owned and may link the party a user represents.
      - TenancyDomain
      - PartyDomain
      - AuditDomain
    IdentityApplication:
      - IdentityDomain
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - AuditApplication
    IdentityInfrastructure:
      - SharedInfrastructure
      - IdentityDomain
      - IdentityApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenantFilterBypass
      - TenancyApplication
      - PartyApplication
      - AuditApplication
    AuditDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # AuditEntry is tenant-owned.
      - TenancyDomain
    AuditApplication:
      - AuditDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    AuditInfrastructure:
      - SharedInfrastructure
      - AuditDomain
      # The created-entry path honours the tenant of TenantOwned entities.
      - TenancyDomain
      - AuditApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    InvoicingDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
    InvoicingApplication:
      - InvoicingDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
    InvoicingInfrastructure:
      - SharedInfrastructure
      - InvoicingDomain
      - InvoicingApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
      - Ui
      - VendorTecnick
    # A country module may implement the ports of Party Application (company and
    # tax registers). It reaches registers only through the shared registry client,
    # the one place that talks HTTP to public registers.
    CountryCzechRepublic:
      - SharedDomain
      - SharedInfrastructure
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
    # Symfony and Twig only: Ui never reaches into a module's Domain.
    Ui:
      - VendorSymfony
      - VendorUid
      - SharedDomain
      - SharedApplication
