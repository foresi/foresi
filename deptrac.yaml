# SPDX-License-Identifier: AGPL-3.0-only
# Architecture rules (see docs/adr/0002-modular-monolith.md). Domain depends on
# the shared kernel only: Shared Domain plus the Tenancy and Audit domain
# contracts (TenantOwned/TenantId, Audited/AuditExcluded), and Doctrine ORM
# mapping attributes. A module's Domain may reference another module's Domain
# only where declared below (Identity -> Party). Tenancy and Audit, the base
# modules, never depend on the modules built on them. Raw DBAL connections are
# allowed in Infrastructure only.
deptrac:
  paths:
    - src
  layers:
    - name: SharedDomain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: SharedApplication
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    - name: SharedInfrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*
    - name: TenancyDomain
      collectors:
        - type: directory
          value: src/Tenancy/Domain/.*
    - name: TenancyApplication
      collectors:
        - type: directory
          value: src/Tenancy/Application/.*
    - name: TenancyInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Tenancy/Infrastructure/.*
          must_not:
            - type: classLike
              value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
            - type: classLike
              value: ^App\\Tenancy\\Infrastructure\\Messenger\\TenantStamp$
    # The sanctioned cross-tenant read; the only Tenancy infrastructure other modules may use.
    - name: TenantFilterBypass
      collectors:
        - type: classLike
          value: ^App\\Tenancy\\Infrastructure\\Doctrine\\TenantFilterBypass$
    # The tenant a queued message belongs to, which a listener outside the handler reads.
    - name: TenantStamp
      collectors:
        - type: classLike
          value: ^App\\Tenancy\\Infrastructure\\Messenger\\TenantStamp$
    - name: PartyDomain
      collectors:
        - type: directory
          value: src/Party/Domain/.*
    - name: PartyApplication
      collectors:
        - type: directory
          value: src/Party/Application/.*
    - name: PartyInfrastructure
      collectors:
        - type: directory
          value: src/Party/Infrastructure/.*
    - name: ImportDomain
      collectors:
        - type: directory
          value: src/Import/Domain/.*
    - name: ImportApplication
      collectors:
        - type: directory
          value: src/Import/Application/.*
    - name: ImportInfrastructure
      collectors:
        - type: directory
          value: src/Import/Infrastructure/.*
    - name: IdentityDomain
      collectors:
        - type: directory
          value: src/Identity/Domain/.*
    - name: IdentityApplication
      collectors:
        - type: directory
          value: src/Identity/Application/.*
    - name: IdentityInfrastructure
      collectors:
        - type: directory
          value: src/Identity/Infrastructure/.*
    - name: AuditDomain
      collectors:
        - type: directory
          value: src/Audit/Domain/.*
    - name: AuditApplication
      collectors:
        - type: directory
          value: src/Audit/Application/.*
    - name: AuditInfrastructure
      collectors:
        - type: directory
          value: src/Audit/Infrastructure/.*
    - name: InvoicingDomain
      collectors:
        - type: directory
          value: src/Invoicing/Domain/.*
    - name: InvoicingApplication
      collectors:
        - type: directory
          value: src/Invoicing/Application/.*
    - name: InvoicingInfrastructure
      collectors:
        - type: directory
          value: src/Invoicing/Infrastructure/.*
    # Bank movements, inbound bank mail and pairing. The layers exist before all
    # their code does: a directory collector matching nothing is no error.
    - name: BankingDomain
      collectors:
        - type: directory
          value: src/Banking/Domain/.*
    - name: BankingApplication
      collectors:
        - type: directory
          value: src/Banking/Application/.*
    - name: BankingInfrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Banking/Infrastructure/.*
          must_not:
            - type: directory
              value: src/Banking/Infrastructure/Imap/.*
    # The IMAP adapter, the only code that may use the IMAP library and what it brings.
    - name: BankingImap
      collectors:
        - type: directory
          value: src/Banking/Infrastructure/Imap/.*
    - name: CountryCzechRepublic
      collectors:
        - type: directory
          value: src/Country/CzechRepublic/.*
    # Presentation shared by all modules (Twig components, layout helpers).
    - name: Ui
      collectors:
        - type: directory
          value: src/Ui/.*
    - name: VendorSymfony
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Symfony\\
          must_not:
            - type: classLike
              value: ^Symfony\\Component\\Uid\\
    # symfony/uid is an internal detail of App\Shared\Domain\Id only.
    - name: VendorUid
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Uid\\
    - name: VendorBrick
      collectors:
        - type: classLike
          value: ^Brick\\(Money|Math)\\
    # Spreadsheet reading; only the Import module's infrastructure may use it.
    - name: VendorOpenSpout
      collectors:
        - type: classLike
          value: ^OpenSpout\\
    # PDF rendering; only the Invoicing module's infrastructure may use it.
    - name: VendorTecnick
      collectors:
        - type: classLike
          value: ^Com\\Tecnick\\
    # MIME parsing; only the Banking module's infrastructure may use it.
    - name: VendorZbateson
      collectors:
        - type: classLike
          value: ^ZBateson\\
    # IMAP and the Laravel collections and Carbon it is built on; only the IMAP adapter may use them.
    - name: VendorImapEngine
      collectors:
        - type: classLike
          value: ^(DirectoryTree|Illuminate|Carbon)\\
    - name: VendorDoctrineOrmMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\ORM\\Mapping\\
    - name: VendorDbalConnection
      collectors:
        - type: classLike
          value: ^Doctrine\\DBAL\\Connection$
    - name: VendorDoctrine
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Doctrine\\
          must_not:
            - type: classLike
              value: ^Doctrine\\ORM\\Mapping\\
            - type: classLike
              value: ^Doctrine\\DBAL\\Connection$
  ruleset:
    SharedDomain:
      - VendorDoctrineOrmMapping
      # brick/money is an internal detail of App\Shared\Domain\Money only.
      - VendorBrick
      - VendorUid
    SharedApplication:
      - SharedDomain
    SharedInfrastructure:
      - SharedDomain
      - SharedApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
    TenancyDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
    TenancyApplication:
      - TenancyDomain
      - SharedDomain
      - SharedApplication
    TenancyInfrastructure:
      - SharedInfrastructure
      - TenancyDomain
      - TenancyApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenantStamp
    TenantFilterBypass:
      - VendorDoctrine
      - TenancyInfrastructure
    TenantStamp:
      - VendorSymfony
    PartyDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # TenantOwned / TenantId are the tenant-scoping contract of owned entities.
      - TenancyDomain
      # Party is audited: it implements the Audited marker.
      - AuditDomain
    PartyApplication:
      - PartyDomain
      # The image store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    PartyInfrastructure:
      - SharedInfrastructure
      - PartyDomain
      - TenancyDomain
      - PartyApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      # The history of a party reads its audit entries.
      - AuditDomain
      # Contributes the sidebar item and its count.
      - Ui
      # Contacts are an import target with a preset for the iDoklad export,
      # and the import screens link to the address book.
      - ImportDomain
      - ImportApplication
      - ImportInfrastructure
    ImportDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
    ImportApplication:
      - ImportDomain
      # The file store is keyed by tenant.
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
    ImportInfrastructure:
      - SharedInfrastructure
      - ImportDomain
      - TenancyDomain
      - ImportApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorOpenSpout
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - IdentityDomain
      - AuditApplication
      # The import screens and the finish notice in the app shell.
      - Ui
    IdentityDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # Membership is tenant-owned and may link the party a user represents.
      - TenancyDomain
      - PartyDomain
      - AuditDomain
    IdentityApplication:
      - IdentityDomain
      - TenancyDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - AuditApplication
    IdentityInfrastructure:
      - SharedInfrastructure
      - IdentityDomain
      - IdentityApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenantFilterBypass
      - TenancyApplication
      - PartyApplication
      - AuditApplication
    AuditDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      # AuditEntry is tenant-owned.
      - TenancyDomain
    AuditApplication:
      - AuditDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    AuditInfrastructure:
      - SharedInfrastructure
      - AuditDomain
      # The created-entry path honours the tenant of TenantOwned entities.
      - TenancyDomain
      - AuditApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - PartyApplication
      - IdentityApplication
    InvoicingDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
    InvoicingApplication:
      - InvoicingDomain
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
    InvoicingInfrastructure:
      - SharedInfrastructure
      - InvoicingDomain
      - InvoicingApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - SharedDomain
      - SharedApplication
      - TenancyApplication
      - IdentityApplication
      - AuditApplication
      - AuditDomain
      - PartyApplication
      - PartyDomain
      - Ui
      - VendorTecnick
      # A failed delivery is recorded in the tenant of its message.
      - TenancyDomain
      - TenantStamp
      # The public link page reads the frozen data of a send across tenants.
      - TenantFilterBypass
    # Banking builds on Party and Invoicing; they never use Banking, which plugs
    # into them through the ports they declare.
    BankingDomain:
      - VendorDoctrineOrmMapping
      - SharedDomain
      - TenancyDomain
      - AuditDomain
      - PartyDomain
      - InvoicingDomain
    BankingApplication:
      - BankingDomain
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
    BankingInfrastructure:
      - SharedInfrastructure
      - BankingDomain
      - BankingApplication
      - VendorSymfony
      - VendorUid
      - VendorDoctrine
      - VendorDoctrineOrmMapping
      - VendorDbalConnection
      - VendorZbateson
      - SharedDomain
      - SharedApplication
      - TenancyDomain
      - TenancyApplication
      - AuditDomain
      - AuditApplication
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
      # The secret token of an inbound address names its tenant: looked up across tenants.
      - TenantFilterBypass
    BankingImap:
      - BankingDomain
      - BankingApplication
      - VendorSymfony
      - VendorImapEngine
      - SharedDomain
      - SharedApplication
    # A country module may implement the ports of Party Application (company and
    # tax registers). It reaches registers only through the shared registry client,
    # the one place that talks HTTP to public registers. It plugs its banks' mail
    # parsers into Banking.
    CountryCzechRepublic:
      - SharedDomain
      - SharedInfrastructure
      - PartyDomain
      - PartyApplication
      - InvoicingDomain
      - InvoicingApplication
      - BankingDomain
      - BankingApplication
    # Symfony and Twig only: Ui never reaches into a module's Domain.
    Ui:
      - VendorSymfony
      - VendorUid
      - SharedDomain
      - SharedApplication
