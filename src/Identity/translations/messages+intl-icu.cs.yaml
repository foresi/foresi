  tab:
    tokens: Tokeny
    connect: MCP
  connect:
    intro: Foresi má MCP server. Claude a další AI klienti s ním čtou a mění vaše data. Přidejte adresu serveru do svého klienta; ten otevře Foresi v prohlížeči, kde se přihlásíte a vyberete, co smí. Skripty a klienti bez přihlášení přes OAuth místo toho použijí token.
    server: Adresa MCP serveru
    steps:
      title: Postup
      client: Přidejte adresu serveru do svého klienta podle návodu níže.
      sign_in: Klient při připojení otevře Foresi v prohlížeči. Přihlaste se, zkontrolujte, o co klient žádá, a povolte to. Pro Clauda na začátek stačí jen čtení.
      check: Ověřte spojení prvním promptem.
    install:
      title: Instalace promptem
      text: Vložte prompt do Claude Code nebo jiného agenta, který umí spouštět příkazy. Přečte si nastavení této instalace, přidá server a ověří spojení; od vás chce jen token.
      prompt: "Nainstaluj MCP server Foresi podle návodu {url} — příkazy spusť sám a ode mě chtěj jen API token."
      file: Návod pro agenty:
    clients: Návod pro klienty
    client:
      claude_code:
        title: Claude Code
        text: Spusťte příkaz v terminálu. Pak v Claude Code napište /mcp, vyberte foresi a přihlaste se v prohlížeči.
      claude_ai:
        title: claude.ai a Claude Desktop
        text: V Claude otevřete Nastavení → Konektory → Přidat vlastní konektor. Zadejte název Foresi a adresu serveru, pole pro OAuth nechte prázdná. Při připojení vás Foresi přihlásí a zeptá se, co smí Claude dělat. Claude Desktop konektory z claude.ai převezme.
      cursor:
        title: Cursor
        text: Přidejte server do ~/.cursor/mcp.json, nebo do .cursor/mcp.json v projektu. Cursor se při prvním připojení přihlásí přes OAuth.
      vscode:
        title: VS Code
        text: Přidejte server do .vscode/mcp.json. VS Code má klíč servers, ne mcpServers, a při prvním spuštění serveru se přihlásí přes OAuth.
    token:
      title: Místo toho použít token
      text: Pro skripty a klienty bez přihlášení přes OAuth vytvořte token v záložce Tokeny a posílejte ho v hlavičce Authorization. Místo <token> vložte svůj token; okno nového tokenu ukáže příkaz pro Claude Code i s tokenem.
      header: Hlavička
      client:
        claude_code:
          title: Claude Code s tokenem
          text: Spusťte příkaz v terminálu. Pak v Claude Code napište /mcp a zkontrolujte, že je server foresi připojený.
        desktop:
          title: Claude Desktop přes konfigurační soubor
          text: V Claude Desktop otevřete Nastavení → Vývojář → Upravit konfiguraci a do claude_desktop_config.json přidejte server přes most mcp-remote (potřebuje Node.js). Pak Claude Desktop ukončete a spusťte znovu.
        cursor:
          title: Cursor s tokenem
          text: Přidejte server s hlavičkou do ~/.cursor/mcp.json, nebo do .cursor/mcp.json v projektu.
        vscode:
          title: VS Code s tokenem
          text: Přidejte server do .vscode/mcp.json. VS Code si token vyžádá při prvním spuštění serveru, takže v souboru nezůstane.
        other:
          title: Skript nebo jiný MCP klient
          text: Transport Streamable HTTP, adresa serveru výše a v každém požadavku tato hlavička.
    check:
      title: První prompt pro Clauda
      text: Vložte ho do nového chatu. Claude zavolá nástroj whoami a řekne, kdo je přihlášený a co klient smí.
      prompt: Použij MCP server Foresi. Nejdřív zavolej whoami a řekni mi, za koho jsi přihlášený a co smíš dělat. Pak mi ukaž pět posledních neuhrazených faktur. Nic neměň, dokud tě o to výslovně nepožádám.
    scopes:
      title: Co smí klient
      text: Práva vyberete na obrazovce souhlasu při připojení klienta, nebo při vytvoření tokenu. Pro jiná práva klienta připojte znovu, nebo vytvořte nový token. Změna vždy zahrnuje čtení. Nástroj, na který klient nemá právo, odpoví odmítnutím.
      hint: Pro Clauda začněte s právem „Číst vše“. Zápis přidejte jen u toho, co má opravdu měnit.
      list: Práva, která klient může dostat
    safety:
      title: Bezpečnost
      consent: Připojujte jen klienty, které znáte. Obrazovka souhlasu ukáže, jestli je název aplikace ověřený její doménou, nebo ho aplikace jen uvádí.
      secret: Token je jako heslo. Nevkládejte ho do chatu ani do souborů, které sdílíte nebo ukládáte do gitu.
      approve: V klientovi nechte zapnuté schvalování nástrojů, hlavně u zápisů.
      injection: Data z jiných zdrojů, třeba e-maily nebo webové stránky, mohou obsahovat pokyny pro AI. Klient s právem zápisu by je mohl provést.
      disconnect: Aplikaci, kterou už nepoužíváte, odpojte v Nastavení → API a MCP. Přístup ztratí okamžitě.
      revoke: Token, který už nepotřebujete nebo mohl uniknout, zrušte v záložce Tokeny. Přestane platit okamžitě.
    docs: Podrobný popis nástrojů a REST API
