  refused:
    two_factor_required: A token can only be created with two-factor sign-in.
    name: Enter a name of up to 80 characters.
    expiry: Choose how long the token lasts.
    scopes: Choose what the token may do.
  tab:
    tokens: Tokens
    connect: MCP
  connect:
    intro: Foresi has an MCP server. Claude and other AI clients read and change your data through it. Add the server address to your client; it opens Foresi in the browser, where you sign in and choose what it may do. Scripts and clients without OAuth sign-in use a token instead.
    server: MCP server address
    steps:
      title: Steps
      client: Add the server address to your client as shown below.
      sign_in: When the client connects, it opens Foresi in the browser. Sign in, check what the client asks for and approve it. For Claude, reading is enough to start with.
      check: Check the connection with a first prompt.
    install:
      title: Install with a prompt
      text: Paste the prompt into Claude Code or another agent that can run commands. It reads the setup of this installation, adds the server and checks the connection; it asks you only for the token.
      prompt: "Install the Foresi MCP server by following {url} — run the commands yourself and ask me only for the API token."
      file: The setup for agents:
    clients: Setup for each client
    client:
      claude_code:
        title: Claude Code
        text: Run the command in a terminal. Then type /mcp in Claude Code, choose foresi and sign in in the browser.
      claude_ai:
        title: claude.ai and Claude Desktop
        text: In Claude, open Settings → Connectors → Add custom connector. Enter the name Foresi and the server address and leave the OAuth fields empty. When you connect, Foresi signs you in and asks what Claude may do. Claude Desktop takes over the connectors of claude.ai.
      cursor:
        title: Cursor
        text: Add the server to ~/.cursor/mcp.json, or to .cursor/mcp.json in a project. Cursor signs in with OAuth when it first connects.
      vscode:
        title: VS Code
        text: Add the server to .vscode/mcp.json. VS Code uses the key servers, not mcpServers, and signs in with OAuth when it first starts the server.
    token:
      title: Use a token instead
      text: For scripts and for clients without OAuth sign-in, create a token on the Tokens tab and send it in the Authorization header. Put your token in place of <token>; the new token's window shows the Claude Code command with the token in it.
      header: Header
      client:
        claude_code:
          title: Claude Code with a token
          text: Run the command in a terminal. Then type /mcp in Claude Code and check that the server foresi is connected.
        desktop:
          title: Claude Desktop with the configuration file
          text: Open Settings → Developer → Edit Config in Claude Desktop and add the server to claude_desktop_config.json through the mcp-remote bridge (it needs Node.js). Then quit Claude Desktop and start it again.
        cursor:
          title: Cursor with a token
          text: Add the server with the header to ~/.cursor/mcp.json, or to .cursor/mcp.json in a project.
        vscode:
          title: VS Code with a token
          text: Add the server to .vscode/mcp.json. VS Code asks for the token when it first starts the server, so the token stays out of the file.
        other:
          title: A script or another MCP client
          text: Streamable HTTP transport, the server address above and this header on every request.
    check:
      title: A first prompt for Claude
      text: Paste it into a new chat. Claude calls the tool whoami and says who is signed in and what the client may do.
      prompt: Use the Foresi MCP server. First call whoami and tell me who you are signed in as and what you may do. Then show me the five latest unpaid invoices. Do not change anything until I ask you to.
    scopes:
      title: What a client may do
      text: You choose the access on the consent screen when you connect a client, or when you create a token. To change it, connect the client again or create a new token. Changing always includes reading. A tool the client has no access to answers with a refusal.
      hint: For Claude, start with "Read everything". Add writing only for what it really has to change.
      list: The access a client can be given
    safety:
      title: Safety
      consent: Connect only clients you know. The consent screen says whether the app's name is verified by its domain or only stated by the app.
      secret: A token is like a password. Do not paste it into a chat or into files you share or commit to git.
      approve: Keep tool approval on in the client, above all for writes.
      injection: Data from elsewhere, such as e-mails or web pages, may carry instructions for the AI. A client that may write could carry them out.
      disconnect: Disconnect an app you no longer use under Settings → API and MCP. It loses its access at once.
      revoke: Revoke a token you no longer need, or that may have leaked, on the Tokens tab. It stops working at once.
    docs: The tools and the REST API in detail
