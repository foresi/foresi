        card: iDoklad API keys
        intro: In iDoklad, open Settings → Applications → API. It needs the Oblíbený or Prémiový tariff.
        read_only: Foresi only reads from iDoklad; it never changes or sends anything there.
        client_id: Client ID
        client_id_help: As iDoklad shows it under API
        client_secret: Client secret
        client_secret_help: Stored encrypted, never shown again
        client_secret_again: Type it again to change the keys
        submit: Connect
        back: Back
        error:
            client_id: Fill in the client ID.
            client_secret: Fill in the client secret.
        flash:
