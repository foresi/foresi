idoklad:
    import:
        contact:
            unknown_country: The country of the contact is not in the iDoklad snapshot.
            ambiguous: More than one contact in Foresi has this name or registration number.
        documents:
            series_unknown: No imported number series of the type and year of the document has its number.
            customer_not_linked: The purchaser of the document was not imported as a contact.
            currency_not_home: The document is not in the home currency; only home-currency documents are imported for now.
            country_unknown: The country of the purchaser or of the firm on the document is not in the iDoklad snapshot.
            payment_option_unsupported: The payment option of the document is not a bank transfer, cash or card.
            language_unsupported: Foresi does not issue documents in the language of the document.
            zero_rate_unsupported: A line has the zero VAT rate, whose treatment the snapshot does not say.
            invalid_value: A date, amount or price type of the document is missing or out of range.
            payment_not_linked: The payment the tax document taxes was not imported.
            advance_not_linked: The proforma invoice the document follows was not imported.
            advance_not_deductible: 'Nothing of an advance the invoice accounts is left to deduct: no paid advance or tax document of it in Foresi.'
            credit_note_unsupported: Credit notes are not imported yet.
            pdf_unreadable: The stored PDF of the document cannot be read.
            number_used_by_other_kind: A document of another kind of the firm has this number; numbers are unique across the kinds of documents.
            older_numbers: The number has the shape of no iDoklad sequence, so the document went to a series of older numbers of its shape.
            customer_address_as_issued: The document was issued with the customer's name only, without an address, and is imported so.
            issuer_vat_id_as_issued: The payer's document was issued without the firm's VAT ID and is imported so.
        series:
            unknown_type: Foresi does not issue documents of this iDoklad type.
            type_not_used: Foresi does not issue documents of this iDoklad type, so its sequence is left out.
            invalid_format: The number format cannot be read as a series format.
            invalid_counter: The year or the last number of the sequence is missing or out of range.
        payments:
            document_type_unsupported: The payment pays a document other than an issued invoice or a proforma invoice.
            document_not_linked: The document the payment pays was not imported.
            currency_not_home: The payment is not in the firm's home currency.
            payment_option_unsupported: Foresi does not record payments of this payment option.
            invalid_value: The date or the amount of the payment is missing.
            zero_amount: The payment is of nothing, so it is left out.
            refund_unsupported: The negative payment gives money back; an import does not record refunds yet.
        recurring:
            advance_unsupported: The template issues advance invoices, which Foresi does not repeat yet.
            unknown_type: Foresi does not repeat documents of this iDoklad type.
            foreign_currency: The template is not in the firm's home currency, which templates are limited to.
            invalid_schedule: The repetition, the first issue or the end of the template cannot be read as a Foresi schedule.
            customer_not_linked: The customer of the template was not imported from iDoklad.
            series_not_linked: The number series of the template was not imported from iDoklad.
            unknown_variable: A text holds a variable Foresi does not know; it would be printed as typed.
            invalid_item: An item has a quantity, price, discount, price type or VAT rate Foresi cannot take.
            unknown_payment_option: Foresi has no payment method for the payment option of the template.
            unsupported_language: Foresi prints invoices in Czech and English only.
            next_issue_mismatch: The next issue Foresi works out differs from the next issue in iDoklad.
            inactive: The template is switched off in iDoklad.
            accountant_not_sent: iDoklad sent each invoice to the accountant; Foresi does not, the accountant gets the monthly pack.
            note_not_carried: The note of the template is not carried over; templates in Foresi have no note.
            fixed_variable_symbol: iDoklad kept one variable symbol for every invoice; in Foresi each invoice takes its number.
            rounding_item_skipped: The rounding item is left out; Foresi rounds the total by the firm's setting.
            reanchored: iDoklad switched the template back on and counts it from that day; Foresi repeats it from the same day.
    title: Move from iDoklad
    entry: Move from iDoklad
    no_firm:
