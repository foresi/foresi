framework:
    validation:
        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    Foresi\Entity\: []

        # New passwords are checked against Have I Been Pwned (only a hash prefix leaves the
        # server); an installation without the internet turns it off with APP_PASSWORD_BREACH_CHECK.
        not_compromised_password:
            enabled: '%env(bool:APP_PASSWORD_BREACH_CHECK)%'

when@test:
    framework:
        validation:
            not_compromised_password: false
