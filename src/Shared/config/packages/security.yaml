security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # The user provider and the firewalls are declared by Foresi\Identity\IdentityBundle:
    # the api and mcp firewalls always, the session firewall (main) with its sign-in pages
    # and second factor only when Ui is installed (ADR 0038).

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Signing out stays possible halfway through the code step.
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        # The code step, between the password and the full sign-in.
        - { path: ^/login/code, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # The routes a module marks with the default _public, such as invitation links, links
        # to sent documents, raw bank mail from a relay, the signed unsubscribe link of a
        # notification e-mail, the health check and the development catalogue
        # (Foresi\Shared\Infrastructure\Security\PublicRoute).
        - { request_matcher: Foresi\Shared\Infrastructure\Security\PublicRoute, roles: PUBLIC_ACCESS }
        # The OpenAPI document describes the API and holds no data.
        - { path: ^/api/v1/openapi\.json$, roles: PUBLIC_ACCESS }
        # The consent screen of OAuth clients (ADR 0036) is behind the ordinary sign-in, by the last rule;
        # its token endpoint, registration and metadata are public routes above.
        # Everything else of the API and MCP needs a personal API token, or on MCP an OAuth access token.
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/mcp(/|$), roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
