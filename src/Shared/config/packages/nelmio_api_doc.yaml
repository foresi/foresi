# SPDX-License-Identifier: AGPL-3.0-only
# The OpenAPI document of the REST API, served at /api/v1/openapi.json (ADR 0027).
# The controllers describe their answers; the shapes of the presenters
# (Foresi\*\Infrastructure\Api\*Json) are written by hand here.
nelmio_api_doc:
    documentation:
        info:
            title: Foresi API
            description: The REST API of Foresi. Every request signs in with a personal API token.
            version: '1'
        security:
            - bearer: []
        components:
            securitySchemes:
                bearer:
                    type: http
                    scheme: bearer
                    description: A personal API token, issued in Settings, API.
            schemas:
                Money:
                    type: object
                    required: [amount_minor, currency]
                    properties:
                        amount_minor: { type: integer, description: The amount in minor units of the currency. }
                        currency: { type: string, example: CZK }
                Address:
                    type: object
                    required: [street, city, postal_code, country_code]
                    properties:
                        street: { type: string }
                        city: { type: string }
                        postal_code: { type: string }
                        country_code: { type: string, description: ISO 3166-1 alpha-2. }
                Reference:
                    type: object
                    required: [id, name]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                Problem:
                    type: object
                    description: An RFC 9457 problem document.
                    required: [type, title, status, detail, code]
                    properties:
                        type: { type: string, example: about:blank }
                        title: { type: string }
                        status: { type: integer }
                        detail: { type: string }
                        code: { type: string, description: 'A stable code, such as not_found, forbidden, invalid_parameter or rate_limited.' }
                        parameter: { type: string, description: 'The parameter that cannot be used, with invalid_parameter.' }
                FieldDefinition:
                    type: object
                    description: 'A custom field a module adds to a record (ADR 0045). Records carry its value under custom_fields, by its key.'
                    required: [key, record, kind, label, options, module, required, filterable, sortable, searchable, guests]
                    properties:
                        key: { type: string, description: 'Never changes, such as acme_fleet_industry.' }
                        record: { type: string, enum: [contact, deal, task, project, product] }
                        kind: { type: string, enum: [text, long_text, number, date, datetime, boolean, url, select, multi_select, contact, user] }
                        label: { type: string, description: 'In the language of the token''s person.' }
                        options:
                            type: array
                            nullable: true
                            description: 'The options of a select or a multi-select, whose keys its value takes; null for the other kinds.'
                            items:
                                type: object
                                required: [key, label]
                                properties:
                                    key: { type: string }
                                    label: { type: string }
                        module: { type: string, description: 'The id of the module that adds it.' }
                        required: { type: boolean, description: 'A new record needs a value.' }
                        filterable: { type: boolean, description: 'A filter condition of the record''s list may use the key as its field.' }
                        sortable: { type: boolean }
                        searchable: { type: boolean, description: 'The text search of the record reads it.' }
                        guests: { type: boolean, description: 'Guests see and write it.' }
                Me:
                    type: object
                    required: [user, token]
                    properties:
                        user: { $ref: '#/components/schemas/Profile' }
                        token:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                scopes: { type: array, items: { type: string, enum: [read, write] } }
                                expires_at: { type: string, format: date-time }
                Profile:
                    type: object
                    required: [id, email, display_name, language, text_size, density, photo_url]
                    properties:
                        id: { type: string, format: uuid }
                        email: { type: string }
                        display_name: { type: string }
                        language: { type: string, enum: [cs, en] }
                        text_size: { type: string, enum: [small, standard, large], description: 'How large the text is in the whole app: 13, 14 or 16 px body text.' }
                        density: { type: string, enum: [compact, normal, spacious], description: 'How tall the table rows are in the whole app, and with a mouse the fields and buttons.' }
                        photo_url: { type: string, format: uri, nullable: true, description: 'Opens only in a signed-in Foresi session; null without a photo.' }
                InvoiceListItem:
                    type: object
                    required: [id, number, kind, firm, customer, issue_date, due_date, tax_point_date, total, paid, remaining, payment_state, overdue, sent, sent_at, delivered, trashed, created_at]
                    properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        kind: { type: string, enum: [invoice, advance, payment_tax_document, correction_document] }
                        firm: { $ref: '#/components/schemas/Reference' }
                        customer: { $ref: '#/components/schemas/Reference' }
                        issue_date: { type: string, format: date }
                        due_date: { type: string, format: date }
                        tax_point_date: { type: string, format: date, nullable: true }
                        total: { $ref: '#/components/schemas/Money' }
                        paid: { $ref: '#/components/schemas/Money' }
                        remaining: { $ref: '#/components/schemas/Money' }
                        payment_state: { type: string, enum: [unpaid, partly_paid, paid, overpaid, to_refund] }
                        overdue: { type: boolean }
                        sent: { type: boolean, description: 'Whether it was sent to the customer: by e-mail, or marked sent by hand.' }
                        sent_at: { type: string, format: date-time, nullable: true, description: 'When it was first sent; null while it was not.' }
                        delivered: { type: boolean, deprecated: true, description: 'Deprecated: the older name of sent, with the same value.' }
                        trashed: { type: boolean }
                        created_at: { type: string, format: date-time }
                InvoiceLine:
                    type: object
                    properties:
                        id: { type: string, format: uuid, description: 'The id of the line, as the margin operations that rebill a line take it.' }
                        source_line_id: { type: string, format: uuid, nullable: true, description: 'The id of the line of the recurring invoice template this line was issued from; null for any other line.' }
                        description: { type: string }
                        quantity: { type: string, example: '1.0000' }
                        unit: { type: string }
                        unit_price: { $ref: '#/components/schemas/Money' }
                        price_type: { type: string, enum: [with_vat, without_vat, base_only] }
                        discount_percent: { type: string, example: '0.00' }
                        vat_treatment: { type: string, enum: [standard, reverse_charge, exempt, not_applicable] }
                        vat_rate_kind: { type: string, nullable: true, enum: [base, reduced, second_reduced] }
                        vat_rate_percent: { type: string, nullable: true, example: '21.00' }
                        net: { $ref: '#/components/schemas/Money' }
                        vat: { $ref: '#/components/schemas/Money' }
                        gross: { $ref: '#/components/schemas/Money' }
                InvoiceDetail:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        kind: { type: string, enum: [invoice, advance, payment_tax_document, correction_document] }
                        firm: { $ref: '#/components/schemas/Reference' }
                        customer:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                registration_number: { type: string, nullable: true }
                                vat_id: { type: string, nullable: true }
                                address: { $ref: '#/components/schemas/Address' }
                        issue_date: { type: string, format: date }
                        due_date: { type: string, format: date }
                        tax_point_date: { type: string, format: date, nullable: true }
                        currency: { type: string }
                        variable_symbol: { type: string }
                        order_number: { type: string }
                        description: { type: string }
                        payment_method: { type: string, enum: [bank_transfer, cash, card] }
                        net: { $ref: '#/components/schemas/Money' }
                        vat: { $ref: '#/components/schemas/Money' }
                        total: { $ref: '#/components/schemas/Money' }
                        payment_state: { type: string, enum: [unpaid, partly_paid, paid, overpaid, to_refund] }
                        sent: { type: boolean, description: 'Whether it was sent to the customer: by e-mail, or marked sent by hand.' }
                        sent_at: { type: string, format: date-time, nullable: true, description: 'When it was first sent; null while it was not.' }
                        delivered: { type: boolean, deprecated: true, description: 'Deprecated: the older name of sent, with the same value.' }
                        trashed: { type: boolean }
                        created_at: { type: string, format: date-time }
                        corrected_invoice_id: { type: string, format: uuid, nullable: true }
                        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
                        payments:
                            type: array
                            items:
                                type: object
                                properties:
                                    payment_id: { type: string, format: uuid }
                                    received_on: { type: string, format: date }
                                    allocated: { $ref: '#/components/schemas/Money' }
                                    settlement: { $ref: '#/components/schemas/Money' }
                                    method: { type: string, enum: [bank_transfer, cash, card] }
                                    source: { type: string, enum: [manual, bank_movement] }
                        corrections:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    number: { type: string }
                                    issue_date: { type: string, format: date }
                                    total: { $ref: '#/components/schemas/Money' }
                        balances:
                            type: object
                            properties:
                                paid: { $ref: '#/components/schemas/Money' }
                                corrections: { $ref: '#/components/schemas/Money' }
                                remaining: { $ref: '#/components/schemas/Money' }
                                to_refund: { $ref: '#/components/schemas/Money' }
                InvoicePage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } }
                        next_cursor: { type: string, nullable: true }
                        applied_view: { allOf: [{ $ref: '#/components/schemas/SavedView' }], nullable: true, description: 'The saved view the view parameter named; null without one.' }
                RecurringInvoiceSchedule:
                    type: object
                    properties:
                        first_issue_on: { type: string, format: date }
                        repeat: { type: string, enum: [day, week, month, year] }
                        every: { type: integer }
                        last_day_of_month: { type: boolean }
                        end: { type: string, enum: [never, on_date, after_count] }
                        ends_on: { type: string, format: date, nullable: true }
                        ends_after: { type: integer, nullable: true }
                RecurringInvoiceLine:
                    type: object
                    description: A line in the shape the writes take it. A stored template also gives the id of each line.
                    properties:
                        id: { type: string, format: uuid, description: 'The id of the line, kept when the template is revised; absent in a preview. The margin operations that rebill a line take it.' }
                        text: { type: string }
                        unit_price: { type: string, example: '1500.00' }
                        quantity: { type: string, example: '1.0000' }
                        unit: { type: string }
                        price_type: { type: string, enum: [without_vat, with_vat, base_only] }
                        vat: { type: string, enum: [base, reduced, second_reduced, reverse_charge, exempt, none] }
                        discount: { type: string, example: '0.00' }
                        supply_code: { type: string, nullable: true }
                RecurringInvoiceIssue:
                    type: object
                    properties:
                        issue_date: { type: string, format: date }
                        tax_point_date: { type: string, format: date }
                        due_date: { type: string, format: date }
                        description: { type: string }
                RecurringInvoiceListItem:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        state: { type: string, enum: [active, paused, ended] }
                        customer: { $ref: '#/components/schemas/Reference' }
                        description: { type: string }
                        schedule: { $ref: '#/components/schemas/RecurringInvoiceSchedule' }
                        delivery: { type: string, enum: [send, review], description: 'send e-mails each issued invoice to the customer; review only issues it, for a person to send.' }
                        next_issue_on: { type: string, format: date, nullable: true }
                        last_issue_on: { type: string, format: date, nullable: true }
                        issued_count: { type: integer }
                        failing: { type: boolean }
                RecurringInvoicePage:
                    type: object
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/RecurringInvoiceListItem' } }
                        page: { type: integer }
                        pages: { type: integer }
                        total: { type: integer }
                RecurringInvoiceDetail:
                    type: object
                    description: A template Foresi issues a sales invoice from on every date of its schedule.
                    properties:
                        id: { type: string, format: uuid }
                        version: { type: integer, description: 'Send it with a change, which is refused once someone saved since.' }
                        name: { type: string }
                        state: { type: string, enum: [active, paused, ended] }
                        trashed: { type: boolean }
                        currency: { type: string }
                        customer: { $ref: '#/components/schemas/Reference' }
                        series: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true }
                        payment_method: { type: string, enum: [bank_transfer, cash, card] }
                        bank_account: { type: string, nullable: true }
                        constant_symbol: { type: string }
                        order_number: { type: string }
                        description: { type: string }
                        text_before: { type: string }
                        text_after: { type: string }
                        language: { type: string, enum: [cs, en] }
                        schedule: { $ref: '#/components/schemas/RecurringInvoiceSchedule' }
                        tax_point: { type: string, enum: [issue_date, last_day_of_month] }
                        due_days: { type: integer }
                        delivery: { type: string, enum: [send, review] }
                        copy_to_me: { type: boolean }
                        copy_to_others: { type: boolean }
                        next_issue_on: { type: string, format: date, nullable: true }
                        last_issue_on: { type: string, format: date, nullable: true }
                        issued_count: { type: integer }
                        paused_at: { type: string, format: date-time, nullable: true }
                        ended_at: { type: string, format: date-time, nullable: true }
                        last_failure:
                            type: object
                            nullable: true
                            properties:
                                at: { type: string, format: date-time }
                                code: { type: string, nullable: true }
                        lines: { type: array, items: { $ref: '#/components/schemas/RecurringInvoiceLine' } }
                        next_issues: { type: array, items: { $ref: '#/components/schemas/RecurringInvoiceIssue' }, description: 'The next invoices it issues; none while paused or ended.' }
                        created_at: { type: string, format: date-time }
                RecurringInvoicePreview:
                    type: object
                    description: What a create with the fields sent would save; nothing is saved.
                    properties:
                        saves: { type: boolean }
                        problems: { type: array, items: { type: string }, description: 'What the rules would refuse, as "parameter: reason — message".' }
                        customer:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string, nullable: true }
                        series_id: { type: string, format: uuid, nullable: true }
                        name: { type: string }
                        payment_method: { type: string, enum: [bank_transfer, cash, card] }
                        bank_account: { type: string, nullable: true }
                        constant_symbol: { type: string }
                        order_number: { type: string }
                        description: { type: string }
                        text_before: { type: string }
                        text_after: { type: string }
                        language: { type: string, enum: [cs, en] }
                        schedule: { $ref: '#/components/schemas/RecurringInvoiceSchedule' }
                        tax_point: { type: string, enum: [issue_date, last_day_of_month] }
                        due_days: { type: integer }
                        delivery: { type: string, enum: [send, review] }
                        copy_to_me: { type: boolean }
                        copy_to_others: { type: boolean }
                        lines: { type: array, items: { $ref: '#/components/schemas/RecurringInvoiceLine' } }
                        next_issues: { type: array, items: { $ref: '#/components/schemas/RecurringInvoiceIssue' } }
                Contact:
                    type: object
                    required: [id, kind, name, roles, registration_country, registration_number, vat_id, email, billing_address, archived, custom_fields]
                    properties:
                        custom_fields: { $ref: '#/components/schemas/ContactCustomFields' }
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [person, sole_trader, company] }
                        name: { type: string }
                        roles: { type: array, items: { type: string, enum: [customer, supplier, partner, authority] } }
                        registration_country: { type: string, nullable: true }
                        registration_number: { type: string, nullable: true }
                        vat_id: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        billing_address: { allOf: [{ $ref: '#/components/schemas/Address' }], nullable: true }
                        archived: { type: boolean }
                Firm:
                    type: object
                    description: The one firm of the instance, the company that issues its documents and receives its payments.
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        registration_country: { type: string, example: CZ }
                        registration_number: { type: string }
                        vat_id: { type: string, nullable: true }
                        vat_status: { type: string, enum: [registered, not_registered, identified_person], description: 'The VAT status that holds today.' }
                        vat_statuses: { type: array, description: 'The VAT status over time, oldest first.', items: { $ref: '#/components/schemas/FirmVatStatus' } }
                        register_entry: { type: string }
                        address:
                            type: object
                            properties:
                                street: { type: string }
                                city: { type: string }
                                postal_code: { type: string }
                                country_code: { type: string }
                FirmVatStatus:
                    type: object
                    description: A VAT status of the firm from valid_from until the next one begins.
                    properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [registered, not_registered, identified_person] }
                        period_length: { type: string, enum: [month, quarter], nullable: true, description: 'The length of a VAT period; set exactly for a registered payer.' }
                        valid_from: { type: string, format: date, nullable: true, description: 'The first day; null for the status that held from the start.' }
                FirmVatStatusRemoved:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        removed: { type: boolean }
                ContactDetail:
                    allOf:
                        - $ref: '#/components/schemas/Contact'
                        - type: object
                          properties:
                              phone: { type: string }
                              mobile: { type: string }
                              website: { type: string }
                              unreliable_payer: { type: boolean }
                              addresses:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/Address'
                                          - type: object
                                            properties:
                                                id: { type: string, format: uuid }
                                                type: { type: string, enum: [billing, delivery, postal, other] }
                                                label: { type: string }
                              emails:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          id: { type: string, format: uuid }
                                          address: { type: string }
                                          purpose: { type: string, enum: [general, invoices, copy] }
                              bank_accounts:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          id: { type: string, format: uuid }
                                          iban: { type: string }
                                          bic: { type: string, nullable: true }
                                          label: { type: string }
                                          primary: { type: boolean }
                              contact_persons:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          id: { type: string, format: uuid }
                                          company: { $ref: '#/components/schemas/Reference' }
                                          person: { $ref: '#/components/schemas/Reference' }
                                          position: { type: string }
                                          primary: { type: boolean }
                ContactPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
                        next_cursor: { type: string, nullable: true }
                        applied_view: { allOf: [{ $ref: '#/components/schemas/SavedView' }], nullable: true, description: 'The saved view the view parameter named; null without one.' }
                Project:
                    type: object
                    required: [id, name, client, visibility, workflow, open_tasks, overdue_tasks, unassigned_tasks, nearest_due_on, archived, custom_fields]
                    properties:
                        custom_fields: { $ref: '#/components/schemas/ProjectCustomFields' }
                        id: { type: string, format: uuid }
                        name: { type: string }
                        client: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true }
                        visibility: { type: string, enum: [organisation, chosen], description: 'Open to the whole organisation, or to the people it is shared with.' }
                        workflow: { type: string, enum: [simple, development] }
                        open_tasks: { type: integer, description: 'Tasks and subtasks the person sees that are not finished.' }
                        overdue_tasks: { type: integer, description: 'Those of the open tasks whose due date is before today.' }
                        unassigned_tasks: { type: integer, description: 'Those of the open tasks with no one responsible.' }
                        nearest_due_on: { type: string, format: date, nullable: true, description: 'The earliest due date of the open tasks, in the past when one is overdue.' }
                        archived: { type: boolean }
                ProjectDetail:
                    allOf:
                        - $ref: '#/components/schemas/Project'
                        - type: object
                          required: [description, billable_by_default, statuses, sections, budget]
                          properties:
                              description: { type: string, description: Markdown. }
                              billable_by_default: { type: boolean, nullable: true, description: Null for a guest. }
                              statuses:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          id: { type: string, format: uuid }
                                          name: { type: string }
                                          type: { type: string, enum: [open, active, done, closed], description: 'done and closed finish a task.' }
                                          position: { type: integer }
                              sections:
                                  type: array
                                  description: The sections the person sees.
                                  items:
                                      type: object
                                      properties:
                                          id: { type: string, format: uuid }
                                          name: { type: string }
                                          position: { type: integer }
                              budget:
                                  type: object
                                  nullable: true
                                  description: 'The time budget in hours; null for a project without one.'
                                  properties:
                                      hours: { type: number }
                                      used_hours: { type: number }
                                      left_hours: { type: number, description: Negative over budget. }
                                      counting: { type: string, enum: [all, billable], description: Which time uses the budget. }
                                      estimate_hours: { type: number, description: The sum of the estimates of the tasks not in the trash. }
                ProjectBudget:
                    type: object
                    required: [project_id, hours, used_hours, left_hours, counting, estimate_hours, minutes, used_minutes, left_minutes, over_budget, estimate_minutes, changes]
                    properties:
                        id: { type: string, format: uuid, description: 'The change made; only in the answer of an inbox action that adds one.' }
                        project_id: { type: string, format: uuid }
                        hours: { type: number, nullable: true, description: 'The budget, the sum of the changes; null without any.' }
                        used_hours: { type: number, description: 'Time logged on the project by anyone, not in the trash and not on a task in the trash; billable only when counting is billable.' }
                        left_hours: { type: number, nullable: true, description: Negative over budget. }
                        counting: { type: string, enum: [all, billable] }
                        estimate_hours: { type: number }
                        minutes: { type: integer, nullable: true }
                        used_minutes: { type: integer }
                        left_minutes: { type: integer, nullable: true }
                        over_budget: { type: boolean }
                        estimate_minutes: { type: integer }
                        changes:
                            type: array
                            nullable: true
                            description: 'The latest first; null for a guest.'
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    effective_on: { type: string, format: date }
                                    hours: { type: number }
                                    minutes: { type: integer }
                                    note: { type: string }
                                    source_activity_id: { type: string, format: uuid, nullable: true }
                                    created_by:
                                        type: object
                                        description: 'Who entered it; the name is null for a person no longer known.'
                                        properties:
                                            id: { type: string, format: uuid }
                                            name: { type: string, nullable: true }
                                    created_at: { type: string, format: date-time }
                ProjectPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
                        next_cursor: { type: string, nullable: true }
                        applied_view: { allOf: [{ $ref: '#/components/schemas/SavedView' }], nullable: true, description: 'The saved view the view parameter named; null without one.' }
                Label:
                    type: object
                    required: [id, name, colour]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        colour: { type: string, enum: [gray, green, amber, red] }
                Task:
                    type: object
                    required: [id, title, project, section_id, parent_id, status, responsible, due_on, priority, labels, subtask_count, done, private, starred, url, custom_fields]
                    properties:
                        custom_fields: { $ref: '#/components/schemas/TaskCustomFields' }
                        id: { type: string, format: uuid }
                        title: { type: string }
                        project: { $ref: '#/components/schemas/Reference' }
                        section_id: { type: string, format: uuid, nullable: true }
                        parent_id: { type: string, format: uuid, nullable: true, description: 'The task this is a subtask of.' }
                        status:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                type: { type: string, enum: [open, active, done, closed] }
                        responsible: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true, description: 'The id is a membership, as responsible_id takes it.' }
                        due_on: { type: string, format: date, nullable: true }
                        priority: { type: string, enum: [none, low, medium, high, urgent] }
                        labels: { type: array, items: { $ref: '#/components/schemas/Label' } }
                        subtask_count: { type: integer }
                        done: { type: boolean, description: 'Its status is of type done or closed.' }
                        private: { type: boolean, description: 'Only the people it is shared with see it.' }
                        starred: { type: boolean, description: 'The person of the token starred it for My priorities; nobody else sees whose star it is.' }
                        url: { type: string, format: uri, description: 'The page of the task, for a person to open.' }
                StarredTaskOrder:
                    type: object
                    description: My priorities in their new order.
                    required: [task_ids]
                    properties:
                        task_ids: { type: array, items: { type: string, format: uuid } }
                TaskDetail:
                    allOf:
                        - $ref: '#/components/schemas/Task'
                        - type: object
                          required: [description, section, parent, watchers, subtasks, estimate_minutes, project_archived, created_at, completed_at]
                          properties:
                              description: { type: string, description: Markdown. }
                              section: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true }
                              parent:
                                  type: object
                                  nullable: true
                                  properties:
                                      id: { type: string, format: uuid }
                                      title: { type: string }
                              watchers: { type: array, items: { $ref: '#/components/schemas/Reference' } }
                              subtasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
                              estimate_minutes: { type: integer, nullable: true, description: Null for a guest. }
                              project_archived: { type: boolean }
                              created_at: { type: string, format: date-time }
                              completed_at: { type: string, format: date-time, nullable: true }
                TaskPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/Task' } }
                        next_cursor: { type: string, nullable: true }
                        applied_view: { allOf: [{ $ref: '#/components/schemas/SavedView' }], nullable: true, description: 'The saved view of the list work.my_tasks the view parameter named; null without one.' }
                TaskComment:
                    type: object
                    required: [id, author, text, internal, created_at, edited_at]
                    properties:
                        id: { type: string, format: uuid }
                        author: { $ref: '#/components/schemas/Reference' }
                        text: { type: string, description: 'Markdown, written by a person.' }
                        internal: { type: boolean, description: 'Read by the people of the organisation only.' }
                        created_at: { type: string, format: date-time }
                        edited_at: { type: string, format: date-time, nullable: true }
                TimeEntry:
                    type: object
                    required: [id, project, task, person, worked_on, minutes, started_at, ended_at, note, billable, running, invoiced]
                    properties:
                        id: { type: string, format: uuid }
                        project: { $ref: '#/components/schemas/Reference' }
                        task:
                            type: object
                            nullable: true
                            properties:
                                id: { type: string, format: uuid }
                                title: { type: string }
                        person: { $ref: '#/components/schemas/Reference' }
                        worked_on: { type: string, format: date }
                        minutes: { type: integer, nullable: true, description: 'Null while the timer runs.' }
                        started_at: { type: string, format: date-time, nullable: true }
                        ended_at: { type: string, format: date-time, nullable: true }
                        note: { type: string }
                        billable: { type: boolean }
                        running: { type: boolean }
                        invoiced: { type: boolean }
                TimeEntryPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/TimeEntry' } }
                        next_cursor: { type: string, nullable: true }
                Payment:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        firm: { $ref: '#/components/schemas/Reference' }
                        received_on: { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Money' }
                        direction: { type: string, enum: [incoming, refund] }
                        method: { type: string, enum: [bank_transfer, cash, card] }
                        source: { type: string, enum: [manual, bank_movement] }
                        note: { type: string }
                        bank_movement_id: { type: string, format: uuid, nullable: true }
                        cancelled_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                        allocations:
                            type: array
                            items:
                                type: object
                                properties:
                                    invoice:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            number: { type: string }
                                    amount: { $ref: '#/components/schemas/Money' }
                                    settlement: { $ref: '#/components/schemas/Money' }
                Event:
                    type: object
                    description: A domain event. Its facts are ids, codes and amounts as text, never personal data.
                    required: [id, type, version, position, occurred_at, subject, data, correlation_id, actor]
                    properties:
                        id: { type: string, format: uuid }
                        type: { type: string, example: invoicing.invoice.paid }
                        version: { type: integer, description: 'The version of the type; a type only gains facts within a version.' }
                        position: { type: integer, description: 'The place in the feed. Read on after the highest position you have seen.' }
                        occurred_at: { type: string, format: date-time }
                        subject:
                            type: object
                            required: [type, id, url]
                            properties:
                                type: { type: string, example: invoice }
                                id: { type: string }
                                url: { type: string, nullable: true, description: 'The API path of the subject.' }
                        data: { type: object, additionalProperties: true }
                        correlation_id: { type: string, nullable: true, description: 'Ties the events of one piece of work together.' }
                        actor:
                            type: object
                            required: [kind]
                            properties:
                                kind: { type: string }
                EventPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
                        next_cursor: { type: string, nullable: true }
                PaymentPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
                        next_cursor: { type: string, nullable: true }
                SavedView:
                    type: object
                    description: A saved view of a list (spec D2), private to its owner or shared with the staff; a view a module ships has a system key and no owner.
                    properties:
                        id: { type: string, format: uuid }
                        list: { type: string, description: 'The list, such as invoicing.invoices.' }
                        name: { type: string }
                        system_key: { type: string, nullable: true }
                        visibility: { type: string, enum: [private, shared] }
                        owner_id: { type: string, format: uuid, nullable: true }
                        filters:
                            type: object
                            properties:
                                match: { type: string, enum: [all] }
                                conditions:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            field: { type: string }
                                            op: { type: string }
                                            value: { description: 'A value of the field''s type; see GET /api/v1/lists.' }
                        sort: { type: array, items: { type: object, properties: { field: { type: string }, dir: { type: string, enum: [asc, desc] } } } }
                        display: { type: object, nullable: true }
                        show_count: { type: boolean }
                        placement: { type: string, enum: [primary, overflow] }
                        position: { type: integer }
                        hidden: { type: boolean }
                        may_edit: { type: boolean, description: 'Whether the token''s person may change or delete it.' }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                ViewList:
                    type: object
                    description: A list saved views filter, with what a filter on it may use.
                    properties:
                        key: { type: string }
                        fields:
                            type: array
                            items:
                                type: object
                                properties:
                                    key: { type: string }
                                    type: { type: string, enum: [enum, reference, text, number, date, boolean] }
                                    label: { type: string }
                                    operators: { type: array, items: { type: string } }
                                    options: { type: array, items: { type: string } }
                        columns:
                            type: array
                            items:
                                type: object
                                properties:
                                    key: { type: string }
                                    label: { type: string }
                                    sortable: { type: boolean }
                                    default: { type: boolean }
                                    locked: { type: boolean }
                        default_views: { type: array, items: { type: string } }
                CatalogProduct:
                    type: object
                    description: Something the firm sells, with its unit, an optional price per unit without VAT and how it is billed.
                    properties:
                        custom_fields: { $ref: '#/components/schemas/ProductCustomFields' }
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string }
                        unit: { type: string, description: 'Such as hour or piece; may be empty.' }
                        unit_price: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'Null when the price is agreed each time.' }
                        billing_kind: { type: string, enum: [one_off, recurring, time_based], description: 'time_based is billed by the hour: the unit is h and the unit price is the hourly rate.' }
                        recurrence_unit: { type: string, enum: [day, week, month, year], nullable: true }
                        interval: { type: integer, nullable: true, description: 'A recurring product is billed every interval recurrence_units.' }
                        cycles: { type: integer, nullable: true, description: 'How many times a recurring product is billed; null for no end.' }
                        archived: { type: boolean }
                        archived_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                MeetingSeries:
                    type: object
                    description: A series of recurring meetings with its people and agenda template.
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        visibility: { type: string, enum: [members, organisation], description: 'members: its members, the attendees and the owners see its meetings; organisation: everyone in the firm.' }
                        agenda_template: { type: string, description: 'Markdown copied into the minutes of each new meeting.' }
                        default_project_id: { type: string, format: uuid, nullable: true }
                        members: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, default_attendee: { type: boolean } } } }
                        meetings: { type: integer, description: 'How many meetings of the series are not in the trash.' }
                        last_held_on: { type: string, format: date, nullable: true }
                        archived: { type: boolean }
                        archived_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                Meeting:
                    type: object
                    description: A meeting of a series or a one-off, with its attendees, the records it is about and its minutes; a list leaves the minutes out.
                    properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        series: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
                        held_on: { type: string, format: date }
                        starts_at: { type: string, nullable: true, description: 'HH:MM in the instance''s zone.' }
                        attendees: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
                        links: { type: array, items: { type: object, properties: { kind: { type: string }, id: { type: string, format: uuid }, label: { type: string } } }, description: 'The linked records you see.' }
                        minutes: { type: string, description: 'Markdown; left out of a list.' }
                        version: { type: integer, description: 'The version of the minutes, sent back with foresi_set_meeting_minutes.' }
                        trashed: { type: boolean }
                        deleted_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                SalesDealSummary:
                    type: object
                    description: A deal with a client as a list shows it, without its lines, links and contact persons.
                    properties:
                        custom_fields: { $ref: '#/components/schemas/DealCustomFields' }
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string, enum: [open, won, lost] }
                        client: { $ref: '#/components/schemas/Reference' }
                        owner_user_id: { type: string, format: uuid, description: 'The owner or member who works on it.' }
                        stage: { allOf: [{ $ref: '#/components/schemas/SalesStageReference' }], nullable: true }
                        won_at: { type: string, format: date-time, nullable: true }
                        lost_at: { type: string, format: date-time, nullable: true }
                        lost_reason: { allOf: [{ $ref: '#/components/schemas/SalesStageReference' }], nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                SalesDeal:
                    type: object
                    description: A deal with a client, with its lines, their value, its links to other deals and its contact persons.
                    properties:
                        custom_fields: { $ref: '#/components/schemas/DealCustomFields' }
                        id: { type: string, format: uuid }
                        title: { type: string }
                        description: { type: string, description: Markdown. }
                        status: { type: string, enum: [open, won, lost] }
                        client: { $ref: '#/components/schemas/Reference' }
                        owner_user_id: { type: string, format: uuid, description: 'The owner or member who works on it.' }
                        stage: { allOf: [{ $ref: '#/components/schemas/SalesStageReference' }], nullable: true }
                        won_at: { type: string, format: date-time, nullable: true }
                        lost_at: { type: string, format: date-time, nullable: true }
                        lost_reason: { allOf: [{ $ref: '#/components/schemas/SalesStageReference' }], nullable: true }
                        lost_note: { type: string, nullable: true }
                        contacts: { type: array, description: 'The contact persons of the client the deal is talked through with, in order.', items: { $ref: '#/components/schemas/Reference' } }
                        lines:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    position: { type: integer }
                                    product_id: { type: string, format: uuid, nullable: true, description: 'The product it was copied from; a later change of the product leaves the line as it is.' }
                                    name: { type: string }
                                    unit: { type: string }
                                    quantity: { type: string, nullable: true, example: '1.500', description: 'A decimal number with three decimals. For a time_based line the hours expected; null means not estimated, which only a time_based line may be.' }
                                    unit_price: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'Null for a line without a price, left out of the value.' }
                                    billing_kind: { type: string, enum: [one_off, recurring, time_based] }
                                    recurrence_unit: { type: string, enum: [day, week, month, year], nullable: true }
                                    interval: { type: integer, nullable: true }
                                    cycles: { type: integer, nullable: true }
                                    project: { type: object, nullable: true, description: 'The project whose billable time a time_based line bills at its rate; null for none. The name is null for a project the caller does not see.', properties: { id: { type: string, format: uuid }, name: { type: string, nullable: true } } }
                                    logged_billable_minutes: { type: integer, nullable: true, description: 'The billable minutes logged on the project that the caller sees, the trash left out; null without a project.' }
                        value:
                            type: object
                            description: What the priced lines are worth, one total per currency, never converted; both lists are empty without a priced line.
                            properties:
                                one_off: { type: array, items: { $ref: '#/components/schemas/Money' } }
                                monthly: { type: array, items: { $ref: '#/components/schemas/Money' } }
                                approximate: { type: boolean, description: 'A weekly or daily line was put on a month''s terms.' }
                                hourly:
                                    type: array
                                    description: The time_based lines with their rate per hour, never added into one_off or monthly.
                                    items:
                                        type: object
                                        properties:
                                            rate: { $ref: '#/components/schemas/Money' }
                                            expected_hours: { type: string, nullable: true, example: '40.000', description: 'The hours expected; null when not estimated.' }
                                            expected_amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'The rate times the hours expected; null when not estimated.' }
                        links:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    type: { type: string, enum: [follows_from] }
                                    direction: { type: string, enum: [outgoing, incoming], description: 'outgoing: this deal follows from the other; incoming: the other follows from this one.' }
                                    deal:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            title: { type: string }
                                            status: { type: string, enum: [open, won, lost] }
                        trashed: { type: boolean }
                        trashed_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                SalesStageReference:
                    type: object
                    description: A stage or a lost reason as a deal names it.
                    properties:
                        id: { type: string, format: uuid }
                        key: { type: string, nullable: true, description: 'Set on the ones Foresi seeded.' }
                        name: { type: string }
                SalesStage:
                    type: object
                    description: A stage a deal moves through.
                    properties:
                        id: { type: string, format: uuid }
                        key: { type: string, nullable: true, description: 'Set on the stages Foresi seeded; their name is translated until renamed.' }
                        name: { type: string }
                        position: { type: integer }
                        archived: { type: boolean }
                        archived_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                SalesStageList:
                    type: object
                    description: The stages in their new order.
                    properties:
                        items: { type: array, items: { $ref: '#/components/schemas/SalesStage' } }
                SalesLostReason:
                    type: object
                    description: A reason a deal is lost for.
                    properties:
                        id: { type: string, format: uuid }
                        key: { type: string, nullable: true, description: 'Set on the reasons Foresi seeded; their name is translated until renamed.' }
                        name: { type: string }
                        position: { type: integer }
                        archived: { type: boolean }
                        archived_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                CashFlowPlannedItem:
                    type: object
                    description: Money a firm expects to receive or pay that no document carries yet, one-off or recurring.
                    properties:
                        id: { type: string, format: uuid }
                        firm: { $ref: '#/components/schemas/Reference' }
                        direction: { type: string, enum: [in, out] }
                        name: { type: string }
                        category: { type: string, enum: [revenue, purchases, rent, software, payroll, taxes, insurance, vat, loans, owner_draws, other] }
                        amount: { $ref: '#/components/schemas/Money' }
                        vat_mode: { type: string, enum: [none, included, excluded, reverse_charge], description: 'How the amount stands to its VAT: none stated, included in the amount, excluded and added on top, or reverse_charge for money out whose VAT the firm self-assesses as the recipient (a domestic reverse charge, a service from the EU or from outside it): the amount moves as stated and the VAT counts as both output and input. The VAT counts only on the days the firm is a VAT payer.' }
                        vat_rate: { type: string, nullable: true, example: '21', description: 'The VAT rate in percent; null with vat_mode none.' }
                        net: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'The net of one occurrence as stated; null with vat_mode none.' }
                        vat: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'The VAT of one occurrence as stated, self-assessed with reverse_charge; null with vat_mode none.' }
                        vat_missing: { type: boolean, description: 'True while the firm is a VAT payer and the item states no VAT, but for the categories without VAT (vat, taxes, insurance, loans, owner_draws).' }
                        counterparty: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true }
                        'on': { type: string, format: date, description: 'The day of a one-off item, the first day of a recurring one.' }
                        repeat: { type: string, enum: [day, week, month, year], nullable: true }
                        every: { type: integer, nullable: true }
                        last_day_of_month: { type: boolean }
                        ends_on: { type: string, format: date, nullable: true }
                        ends_after: { type: integer, nullable: true }
                        included: { type: boolean }
                        skipped_on: { type: array, items: { type: string, format: date } }
                        match:
                            type: object
                            properties:
                                account: { type: string, nullable: true }
                                variable_symbol: { type: string, nullable: true }
                                tolerance: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        created_at: { type: string, format: date-time }
                CashFlowPairing:
                    type: object
                    description: Whether a received document belongs to an occurrence of a planned item. An auto or confirmed pairing makes the forecast leave that occurrence out.
                    properties:
                        subject:
                            type: object
                            properties:
                                type: { type: string, example: received_document }
                                id: { type: string }
                                url: { type: string, nullable: true, description: 'Where the document can be read in the API.' }
                        state: { type: string, enum: [auto, confirmed, proposed, declined], description: 'auto: Cash flow paired it; confirmed: a person paired it; proposed: a person should decide among the candidates; declined: a person said it belongs to none, so Cash flow never pairs it again.' }
                        counterparty_id: { type: string, format: uuid, nullable: true }
                        planned_item_id: { type: string, format: uuid, nullable: true, description: 'The item it is paired or proposed with; null for a proposal with several candidates and for a declined pairing.' }
                        planned_item_name: { type: string, nullable: true }
                        occurrence_on: { type: string, format: date, nullable: true }
                        candidates:
                            type: array
                            description: The occurrences it was proposed with, kept in every state.
                            items:
                                type: object
                                properties:
                                    planned_item_id: { type: string, format: uuid }
                                    planned_item_name: { type: string, nullable: true }
                                    occurrence_on: { type: string, format: date }
                        decided_by: { type: string, format: uuid, nullable: true }
                        decided_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                CashFlowCheckpoint:
                    type: object
                    description: The balance of a firm bank account at the end of a day.
                    properties:
                        id: { type: string, format: uuid }
                        bank_account:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                iban: { type: string }
                                label: { type: string }
                        firm_id: { type: string, format: uuid }
                        'on': { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Money' }
                        recorded_at: { type: string, format: date-time }
                CashFlowExpectedDate:
                    type: object
                    properties:
                        subject_type: { type: string }
                        subject_id: { type: string }
                        expected_on: { type: string, format: date, nullable: true, description: Null once cleared. }
                CashFlowMinimumBalance:
                    type: object
                    properties:
                        firm_id: { type: string, format: uuid }
                        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                CashFlowTotals:
                    type: object
                    properties:
                        total: { $ref: '#/components/schemas/Money' }
                        by_category: { type: object, additionalProperties: { $ref: '#/components/schemas/Money' } }
                        by_certainty: { type: object, description: 'The same money by how sure it is (document, schedule, plan, estimate).', additionalProperties: { $ref: '#/components/schemas/Money' } }
                CashFlowItem:
                    type: object
                    description: One expected flow, counted in the period that holds counted_on.
                    properties:
                        source: { type: string, example: cash-flow.planned_items }
                        subject:
                            type: object
                            properties:
                                type: { type: string, example: planned_item }
                                id: { type: string }
                                url: { type: string, nullable: true }
                        direction: { type: string, enum: [in, out] }
                        label: { type: string }
                        category: { type: string, enum: [revenue, purchases, rent, software, payroll, taxes, insurance, vat, loans, owner_draws, other] }
                        certainty: { type: string, enum: [document, schedule, plan, estimate] }
                        flags: { type: array, items: { type: string, enum: [overdue, awaited, estimated, no_due_date, expected_date] } }
                        expected_on: { type: string, format: date }
                        counted_on: { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Money' }
                        amount_czk: { $ref: '#/components/schemas/Money' }
                        counterparty_id: { type: string, format: uuid, nullable: true }
                CashFlowForecast:
                    type: object
                    description: The forecast of a firm in CZK at today's ČNB rate, by ISO weeks until the end of next month, then by calendar months.
                    properties:
                        firm: { $ref: '#/components/schemas/Reference' }
                        currency: { type: string, example: CZK }
                        today: { type: string, format: date }
                        from: { type: string, format: date }
                        to: { type: string, format: date }
                        certainty: { type: array, description: 'The certainties counted; all four unless the certainty parameter chose some.', items: { type: string, enum: [document, schedule, plan, estimate] } }
                        balance:
                            type: object
                            properties:
                                amount: { $ref: '#/components/schemas/Money' }
                                as_of: { type: string, format: date, nullable: true }
                                stale: { type: boolean, description: 'The oldest balance is older than 7 days, or there is none.' }
                                accounts:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            iban: { type: string }
                                            label: { type: string }
                                            balance: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                            amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                            as_of: { type: string, format: date, nullable: true }
                                            source: { type: string, nullable: true }
                        periods:
                            type: array
                            items:
                                type: object
                                properties:
                                    key: { type: string, example: 2026-W47 }
                                    kind: { type: string, enum: [week, month] }
                                    start: { type: string, format: date }
                                    end: { type: string, format: date }
                                    opening: { $ref: '#/components/schemas/Money' }
                                    inflows: { $ref: '#/components/schemas/CashFlowTotals' }
                                    outflows: { $ref: '#/components/schemas/CashFlowTotals' }
                                    closing: { $ref: '#/components/schemas/Money' }
                                    items: { type: array, items: { $ref: '#/components/schemas/CashFlowItem' } }
                        lowest:
                            type: object
                            properties:
                                amount: { $ref: '#/components/schemas/Money' }
                                'on': { type: string, format: date }
                        minimum_balance: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        shortfall_on: { type: string, format: date, nullable: true }
                        incomplete: { type: boolean }
                        unavailable_sources: { type: array, items: { type: string } }
                        unavailable_rates: { type: array, items: { type: string } }
                TaxStatus:
                    type: object
                    description: A status of the owner from valid_from until the next status of its kind.
                    properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [legal_form, activity, vat_payer, flat_rate_band, sickness_insurance, health_minimum_exempt] }
                        value: { type: string, example: 'yes' }
                        valid_from: { type: string, format: date }
                        base: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                TaxStatusRemoved:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        removed: { type: boolean }
                TaxYear:
                    type: object
                    description: The inputs of one year of the owner profile; all amounts in CZK.
                    properties:
                        year: { type: integer, example: 2026 }
                        expense_methods: { type: array, items: { type: string, enum: [actual, lump_80, lump_60, lump_40, lump_30] } }
                        chosen_method: { type: string, nullable: true }
                        children:
                            type: array
                            items:
                                type: object
                                properties:
                                    label: { type: string }
                                    birth_date: { type: string, format: date }
                                    order: { type: integer, enum: [1, 2, 3] }
                                    ztp_p: { type: boolean }
                                    months: { type: integer, minimum: 0, maximum: 12 }
                        spouse:
                            type: object
                            nullable: true
                            properties:
                                months: { type: integer, minimum: 0, maximum: 12 }
                                ztp_p: { type: boolean }
                                low_income: { type: boolean }
                        deductions:
                            type: array
                            items:
                                type: object
                                properties:
                                    type: { type: string }
                                    amount: { $ref: '#/components/schemas/Money' }
                        other_bases:
                            type: object
                            properties:
                                employment: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                employment_tax_withheld: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                rental: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                other: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        last_known_tax: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        previous_year:
                            type: object
                            properties:
                                social_base: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                health_base: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                overview_filed_on: { type: string, format: date, nullable: true }
                                activity_months: { type: integer, minimum: 1, maximum: 12, nullable: true }
                        return_route: { type: string, enum: [paper, electronic, advisor] }
                        activity_start: { type: string, format: date, nullable: true }
                        average_wage_override: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                TaxAuthorityAccount:
                    type: object
                    properties:
                        authority: { type: string, enum: [social, health, sickness, income_tax, flat_rate] }
                        account: { type: string }
                        variable_symbol: { type: string }
                VatPeriods:
                    type: object
                    description: The VAT periods of the firm, always an estimate. With nothing to compute, periods is empty and reason says why.
                    required: [estimate, reason, country, from, to, periods, warnings, unverified, known_gaps, unavailable_sources, unassigned_payments, possible_duplicates]
                    properties:
                        estimate: { type: boolean, enum: [true] }
                        reason: { type: string, nullable: true, enum: [payer_date_missing, not_a_payer, country_not_supported, null], description: 'payer_date_missing when the firm is a payer but the day it became one is not stated: nothing is computed before a stated day.' }
                        country: { type: string, nullable: true, description: 'The country whose rules apply, ISO 3166-1 alpha-2; null without them.' }
                        from: { type: string, nullable: true, example: '2026-11', description: 'The first month asked for, null for the first period.' }
                        to: { type: string, example: '2027-11', description: The last month; the period that holds it is the last one. }
                        periods: { type: array, items: { $ref: '#/components/schemas/VatPeriod' } }
                        warnings: { type: array, items: { type: string }, example: [quarter_not_allowed], description: What the country does not allow in the VAT statuses of the firm; the statuses are kept. }
                        unverified: { type: array, items: { type: string }, example: [refund_timing], description: The rules nobody has confirmed from a primary source yet. }
                        known_gaps: { type: array, items: { type: string }, example: [deduction_before_registration], description: 'What the amounts do not count yet; deduction_before_registration: VAT on supplies before the payer day is never deducted.' }
                        unavailable_sources: { type: array, items: { type: string }, example: [purchasing.received_vat], description: 'The document and schedule sources not installed or not readable: invoicing.issued_vat, purchasing.received_vat, invoicing.recurring_vat. What they hold counts nothing; and the bank sources that could not be read, such as banking.movements, whose payments match nothing.' }
                        unassigned_payments: { type: array, description: 'The bank movements to or from the tax office that pay no period, oldest first, for a person to place with PUT /api/v1/vat/payments/{movementId}.', items: { $ref: '#/components/schemas/VatPayment' } }
                        possible_duplicates:
                            type: array
                            description: The active planned items of Cash flow in the category vat, which may count the VAT a second time. Nothing ends them but a person.
                            items: { type: object, required: [id, name, url], properties: { id: { type: string, format: uuid }, name: { type: string }, url: { type: string, nullable: true } } }
                VatPayment:
                    type: object
                    required: [movement_id, on, amount, direction, rule, period, manual, unverified]
                    properties:
                        movement_id: { type: string, description: 'The id of the bank movement.' }
                        on: { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Money', description: 'Positive, as the bank booked it; direction says which way.' }
                        direction: { type: string, enum: [in, out] }
                        rule: { type: string, enum: [payable, refund, other], description: 'payable: to the office account with the variable symbol; refund: from the office account, by the account alone; other: to the office account with another symbol, never matched on its own.' }
                        period: { type: string, nullable: true, example: '2026-11', description: 'The period it pays; null while it is unassigned.' }
                        manual: { type: boolean, description: 'A person placed it.' }
                        unverified: { type: array, items: { type: string }, example: [refund_account] }
                VatPaymentAssignment:
                    type: object
                    required: [movement_id, period, automatic]
                    properties:
                        movement_id: { type: string }
                        period: { type: string, nullable: true, description: 'The period it pays; null when it is no VAT payment, or when automatic.' }
                        automatic: { type: boolean, description: 'Nobody placed it any more, so the automatic matching decides.' }
                VatPeriodDetail:
                    allOf:
                        - { $ref: '#/components/schemas/VatPeriods' }
                        - type: object
                          required: [period, documents, schedules, plans, restricted_sources]
                          properties:
                              period: { $ref: '#/components/schemas/VatPeriod' }
                              documents: { type: array, description: 'The documents counted in the period, of the sources the caller may read.', items: { $ref: '#/components/schemas/VatDocument' } }
                              schedules: { type: array, description: 'The occurrences of schedules not issued yet counted in the period, such as the next invoices of recurring templates, of the sources the caller may read.', items: { $ref: '#/components/schemas/VatSchedule' } }
                              plans: { type: array, description: 'The plans counted in the period from today on, such as planned items with their VAT stated, of the sources the caller may read.', items: { $ref: '#/components/schemas/VatPlan' } }
                              restricted_sources: { type: array, items: { type: string }, example: [invoicing.issued_vat], description: 'The sources whose documents, schedules or plans the token may not read; their amounts still count in the totals.' }
                VatDocument:
                    type: object
                    required: [source, subject, label, counts_on, tax_point_on, output, input, missing_czk]
                    properties:
                        source: { type: string, example: invoicing.issued_vat }
                        subject: { type: object, required: [type, id, url], properties: { type: { type: string, enum: [invoice, received_document] }, id: { type: string, format: uuid }, url: { type: string, nullable: true } } }
                        label: { type: string, description: The number of the document. }
                        counts_on: { type: string, format: date, description: 'The day that decides its period: the tax point of an issued document, the first day of the deduction month of a received one.' }
                        tax_point_on: { type: string, format: date, description: 'It counts only when the firm is a payer on this day.' }
                        output: { $ref: '#/components/schemas/Money' }
                        input: { $ref: '#/components/schemas/Money' }
                        missing_czk: { type: boolean, description: 'The VAT has no CZK amount, so it counts zero.' }
                VatSchedule:
                    type: object
                    required: [source, subject, label, tax_point_on, output, output_in_currency, fx_today, missing_czk]
                    properties:
                        source: { type: string, example: invoicing.recurring_vat }
                        subject: { type: object, required: [type, id, url], properties: { type: { type: string, enum: [recurring_invoice] }, id: { type: string, format: uuid }, url: { type: string, nullable: true } } }
                        label: { type: string, example: 'Hosting (2026-12-01)', description: The name of the template and the day of the occurrence. }
                        tax_point_on: { type: string, format: date, description: 'The tax point the issued invoice would get; it decides the period, and it counts only when the firm is a payer on this day.' }
                        output: { $ref: '#/components/schemas/Money', description: The output VAT in CZK. }
                        output_in_currency: { $ref: '#/components/schemas/Money', description: The output VAT in the currency of the schedule. }
                        fx_today: { type: boolean, description: 'The output is converted from another currency at today''s rate.' }
                        missing_czk: { type: boolean, description: 'The currency has no rate today, so it counts zero.' }
                VatPlan:
                    type: object
                    required: [source, subject, label, 'on', output, input]
                    properties:
                        source: { type: string, example: cash-flow.planned_vat }
                        subject: { type: object, nullable: true, required: [type, id, url], properties: { type: { type: string, enum: [planned_item] }, id: { type: string, format: uuid }, url: { type: string, nullable: true } } }
                        label: { type: string, nullable: true, example: Office rent, description: The name of the planned item. }
                        'on': { type: string, format: date, description: 'The day of the occurrence; it decides the period, and it counts only when the firm is a payer on this day.' }
                        output: { $ref: '#/components/schemas/Money', description: 'The output VAT in CZK of money planned in.' }
                        input: { $ref: '#/components/schemas/Money', description: 'The input VAT in CZK of money planned out.' }
                VatPart:
                    type: object
                    required: [output, input]
                    properties:
                        output: { $ref: '#/components/schemas/Money' }
                        input: { $ref: '#/components/schemas/Money' }
                VatPeriod:
                    type: object
                    required: [key, length, start, end, due_on, refund_expected_on, output, input, result, return_amount, expected, state, paid, difference, payments, settled_mark, breakdown, steps, warnings, missing_czk]
                    properties:
                        key: { type: string, example: '2026-11', description: 'The calendar month, or the quarter such as "2026-Q4".' }
                        length: { type: string, enum: [month, quarter] }
                        start: { type: string, format: date, description: 'The first day; the day the firm became a payer in its first period.' }
                        end: { type: string, format: date, description: 'The last day; the last day as a payer in its last period.' }
                        due_on: { type: string, format: date, description: The day the return and the payment of the whole period are due. }
                        refund_expected_on: { type: string, format: date, description: 'The day a refund is expected at the earliest (unverified: refund_timing).' }
                        output: { $ref: '#/components/schemas/Money' }
                        input: { $ref: '#/components/schemas/Money' }
                        result: { $ref: '#/components/schemas/Money', description: 'Output minus input; positive to pay, negative to get back.' }
                        return_amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'The amount of the return a person entered; null until then.' }
                        expected: { $ref: '#/components/schemas/Money', description: 'What the period expects: the return amount when entered, else the result.' }
                        state: { type: string, enum: [estimated, return_entered, settled, not_yet_paid], description: 'settled once a movement pays it or a person marked it; not_yet_paid once its due date, or for a refund its expected date, has passed. Never overdue.' }
                        paid: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'What the movements paid, in the sign of the result; null without any.' }
                        difference: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'Paid minus expected, as information: a payment of another amount still settles the period.' }
                        payments: { type: array, items: { $ref: '#/components/schemas/VatPayment' } }
                        settled_mark: { type: object, nullable: true, required: [at, note], description: 'A person marked it settled.', properties: { at: { type: string, format: date-time }, note: { type: string, nullable: true } } }
                        breakdown:
                            type: object
                            required: [documents, schedules, plans]
                            properties:
                                documents: { $ref: '#/components/schemas/VatPart' }
                                schedules: { $ref: '#/components/schemas/VatPart' }
                                plans: { $ref: '#/components/schemas/VatPart' }
                        steps:
                            type: array
                            description: How the result comes about, output, input and result.
                            items:
                                type: object
                                required: [name, amount, rule, sources]
                                properties:
                                    name: { type: string, enum: [output, input, result] }
                                    amount: { $ref: '#/components/schemas/Money' }
                                    rule: { type: string, example: output VAT minus deductible input VAT }
                                    sources: { type: array, items: { type: string }, description: 'The document sources of the step, or the steps the result is computed from.' }
                        warnings: { type: array, items: { type: string }, example: [missing_czk_vat, fx_today], description: 'missing_czk_vat: a document or a schedule counted has no CZK amount of its VAT; missing_czk names it. fx_today: a schedule in another currency is converted at today''s rate.' }
                        missing_czk: { type: array, items: { type: string }, description: The labels of the documents and schedules counted without a CZK amount of their VAT. }
                VatSettings:
                    type: object
                    required: [office_account, variable_symbol, suggestion]
                    properties:
                        office_account: { type: string, nullable: true, description: The account of the tax office; null until it is set. }
                        variable_symbol: { type: string, nullable: true }
                        suggestion:
                            type: object
                            nullable: true
                            description: How the country of the firm suggests paying; null without its rules.
                            required: [account_hint, variable_symbol, source_url]
                            properties:
                                account_hint: { type: string, example: '705-<number of your tax office>/0710' }
                                variable_symbol: { type: string, example: '12345678' }
                                source_url: { type: string, format: uri }
                ExchangeRateSource:
                    type: object
                    description: Where the firm's exchange rates to CZK come from (ADR 0046).
                    required: [source, chosen, default, allowed, installed, country]
                    properties:
                        source: { type: string, nullable: true, example: cnb, description: 'The source in use; null when none is installed.' }
                        chosen: { type: boolean, description: 'True when a person chose it, false while the default applies.' }
                        default: { type: string, nullable: true, example: cnb, description: 'The default of the firm''s country, or the first installed source without its rules.' }
                        allowed: { type: array, items: { type: string }, example: [cnb, ecb], description: The installed sources the firm may choose. }
                        installed: { type: array, items: { type: string }, example: [cnb, ecb], description: Every installed source. }
                        country: { type: string, nullable: true, example: CZ, description: 'The country whose rules decide; null without rules.' }
                MarginTable:
                    type: object
                    description: Revenue, costs and margin in CZK of the clients by month, with the firm's own use and what nobody claims.
                    required: [from, to, months, rows, month_totals, total, known_gaps]
                    properties:
                        from: { type: string, example: '2026-10' }
                        to: { type: string, example: '2026-12' }
                        months: { type: array, items: { type: string, example: '2026-10' } }
                        rows:
                            type: array
                            description: 'The clients with revenue or costs in the range, the highest revenue first; then own; then unassigned, which is always there.'
                            items:
                                type: object
                                required: [row, kind, client_id, label, cells, total]
                                properties:
                                    row: { type: string, example: 'client:0198a1c0-0000-7000-8000-000000000001', description: 'client:<contact id>, own or unassigned.' }
                                    kind: { type: string, enum: [client, own, unassigned] }
                                    client_id: { type: string, format: uuid, nullable: true }
                                    label: { type: string, description: 'The name of the client; the contact id when the contact no longer resolves.' }
                                    cells: { type: array, items: { $ref: '#/components/schemas/MarginMonthFigures' } }
                                    total: { $ref: '#/components/schemas/MarginFigures' }
                        month_totals: { type: array, items: { $ref: '#/components/schemas/MarginMonthFigures' } }
                        total: { $ref: '#/components/schemas/MarginFigures' }
                        known_gaps:
                            type: array
                            items:
                                type: object
                                required: [code, document_ids]
                                properties:
                                    code: { type: string, enum: [missing_exchange_rate] }
                                    document_ids: { type: array, items: { type: string, format: uuid } }
                MarginFigures:
                    type: object
                    required: [revenue, costs, margin, unrebilled]
                    properties:
                        revenue: { $ref: '#/components/schemas/Money' }
                        costs: { $ref: '#/components/schemas/Money' }
                        margin: { $ref: '#/components/schemas/Money' }
                        unrebilled: { type: integer, description: 'How many paid costs were not rebilled (paid, not rebilled); a client sums its months, the table every client.' }
                MarginMonthFigures:
                    type: object
                    required: [month, revenue, costs, margin, unrebilled]
                    properties:
                        month: { type: string, example: '2026-11' }
                        revenue: { $ref: '#/components/schemas/Money' }
                        costs: { $ref: '#/components/schemas/Money' }
                        margin: { $ref: '#/components/schemas/Money' }
                        unrebilled: { type: integer, description: 'How many costs paid that month were not rebilled to the client; the cell detail lists them.' }
                MarginCell:
                    type: object
                    description: The documents and cost shares behind one cell of the margin table.
                    required: [row, label, month, revenue, costs, margin, revenue_items, cost_items, unrebilled]
                    properties:
                        row: { type: string }
                        label: { type: string }
                        month: { type: string, example: '2026-11' }
                        revenue: { $ref: '#/components/schemas/Money' }
                        costs: { $ref: '#/components/schemas/Money' }
                        margin: { $ref: '#/components/schemas/Money' }
                        revenue_items: { type: array, items: { $ref: '#/components/schemas/MarginCellItem' } }
                        cost_items: { type: array, items: { $ref: '#/components/schemas/MarginCellItem' } }
                        unrebilled:
                            type: array
                            description: 'The costs of a client row paid in the month and not rebilled; empty for own and unassigned.'
                            items: { $ref: '#/components/schemas/MarginUnrebilled' }
                MarginUnrebilled:
                    type: object
                    description: An occurrence of a planned cost that was paid and not rebilled to a client whose recurring invoice rebills it.
                    required: [label, planned_item_id, planned_item_url, occurrence_on, month, recipient_id, template_id, template_url, recurring_line_id]
                    properties:
                        label: { type: string, description: 'The name of the planned cost.' }
                        planned_item_id: { type: string, format: uuid }
                        planned_item_url: { type: string, nullable: true, description: 'Where a person reads the planned cost in Foresi.' }
                        occurrence_on: { type: string, format: date }
                        month: { type: string, example: '2026-11', description: 'The month of the occurrence.' }
                        recipient_id: { type: string, format: uuid, description: 'The client, a contact.' }
                        template_id: { type: string, format: uuid, description: 'The recurring invoice whose line rebills the cost.' }
                        template_url: { type: string }
                        recurring_line_id: { type: string, format: uuid }
                MarginRebillLink:
                    type: object
                    description: The planned cost a line of a recurring invoice template rebills; every field but the line is null where it rebills none.
                    required: [recurring_line_id, planned_item_id, planned_item_name, planned_item_url, created_on, warnings]
                    properties:
                        recurring_line_id: { type: string, format: uuid }
                        planned_item_id: { type: string, format: uuid, nullable: true }
                        planned_item_name: { type: string, nullable: true }
                        planned_item_url: { type: string, nullable: true }
                        created_on: { type: string, format: date, nullable: true, description: 'The day the link was made, in the zone of the instance; costs of earlier months are never flagged.' }
                        warnings:
                            type: array
                            description: 'Does not stop the link. customer_not_a_recipient: the customer of the template bears no share of the mapping of the planned cost this month, so no invoice would be paired.'
                            items: { type: string, enum: [customer_not_a_recipient] }
                MarginRebillPairing:
                    type: object
                    description: An invoice line paired with an occurrence of a planned cost.
                    required: [invoice_line_id, invoice_id, planned_item_id, planned_item_name, planned_item_url, occurrence_on, manual]
                    properties:
                        invoice_line_id: { type: string, format: uuid }
                        invoice_id: { type: string, format: uuid }
                        planned_item_id: { type: string, format: uuid }
                        planned_item_name: { type: string }
                        planned_item_url: { type: string, nullable: true }
                        occurrence_on: { type: string, format: date }
                        manual: { type: boolean, description: 'True where a person paired the line; a pairing made on issue is false.' }
                MarginRebillUnpaired:
                    type: object
                    required: [invoice_line_id, unpaired]
                    properties:
                        invoice_line_id: { type: string, format: uuid }
                        unpaired: { type: boolean }
                MarginCellItem:
                    type: object
                    required: [document_id, label, text, amount, source, kind, url, planned_item_id, occurrence_on]
                    properties:
                        document_id: { type: string }
                        label: { type: string, description: 'The number of an issued document, or the number and the supplier of a cost document.' }
                        text: { type: string, nullable: true, description: 'The text of the cost line; null for revenue.' }
                        amount: { $ref: '#/components/schemas/Money' }
                        source: { type: string, enum: [revenue, line, document, planned_item, supplier, unassigned] }
                        kind: { type: string, nullable: true, description: 'The kind of a revenue document (invoice, payment tax document, correction); null for a cost.' }
                        url: { type: string, nullable: true, description: 'Where a person reads the document in Foresi.' }
                        planned_item_id: { type: string, format: uuid, nullable: true }
                        occurrence_on: { type: string, format: date, nullable: true }
                MarginDocumentAllocation:
                    type: object
                    description: Who bears the cost of a recorded received document, line by line.
                    required: [document_id, label, url, trashed, document_allocation, lines, known_gaps]
                    properties:
                        document_id: { type: string, format: uuid }
                        label: { type: string, description: 'The number and the supplier of the document, for people.' }
                        url: { type: string, description: 'Where a person reads the document in Foresi.' }
                        trashed: { type: boolean, description: 'A document in the trash has no shares; its mapping stays for a restore.' }
                        document_allocation:
                            type: object
                            nullable: true
                            description: 'The assignment of the whole document, for every line without a mapping of its own; null without one.'
                            properties:
                                recipient: { type: string, description: 'own, or the id of a contact.' }
                                recipient_name: { type: string, nullable: true }
                        known_gaps: { type: array, items: { type: string, enum: [missing_exchange_rate] }, description: 'missing_exchange_rate: a line of a foreign document has no base in CZK yet, so it has no share; it counts as unknown, never as zero.' }
                        lines:
                            type: array
                            items:
                                type: object
                                required: [key, text, base_czk, allocation, shares]
                                properties:
                                    key: { type: string, description: 'The id of the line, which stays the same when the line is edited or moved; rate:21 for the implicit line of a document without lines.' }
                                    text: { type: string }
                                    base_czk: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'The base without VAT in CZK; null while a foreign document has no exchange rate.' }
                                    allocation:
                                        type: object
                                        nullable: true
                                        description: 'The mapping of this line as it was typed; null when the line has none.'
                                        properties:
                                            kind: { type: string, enum: [whole, percent, fixed] }
                                            shares:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        recipient: { type: string, description: 'own, or the id of a contact.' }
                                                        recipient_name: { type: string, nullable: true }
                                                        percent: { type: string, nullable: true, example: '33.33' }
                                                        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                                        rest: { type: boolean }
                                    shares:
                                        type: array
                                        description: 'What follows from the mapping, in whole hellers of the base in CZK.'
                                        items:
                                            type: object
                                            properties:
                                                recipient: { type: string, nullable: true, description: 'own, the id of a contact, or null while nobody claims the cost.' }
                                                recipient_name: { type: string, nullable: true }
                                                amount: { $ref: '#/components/schemas/Money' }
                                                source: { type: string, enum: [line, document, planned_item, supplier, unassigned] }
                                planned_item_id: { type: string, format: uuid, nullable: true, description: 'The planned item whose mapping gave this share (source planned_item); otherwise null.' }
                                occurrence_on: { type: string, format: date, nullable: true, description: 'The day of the occurrence the document is paired with (source planned_item); otherwise null.' }
                MarginPlannedAllocations:
                    type: object
                    description: The versions of the mapping of a recurring planned cost, latest first. A version applies from its month on until a later one.
                    required: [planned_item_id, name, versions]
                    properties:
                        planned_item_id: { type: string, format: uuid }
                        name: { type: string }
                        versions:
                            type: array
                            items:
                                type: object
                                required: [from_month, allocation, current, created_at, created_by]
                                properties:
                                    from_month: { type: string, example: '2026-12', description: 'The first month the version applies to, YYYY-MM in the zone of the instance.' }
                                    allocation:
                                        type: object
                                        nullable: true
                                        description: 'The mapping as it was typed; null ends the mapping from this month.'
                                        properties:
                                            kind: { type: string, enum: [whole, percent, fixed] }
                                            shares:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        recipient: { type: string, description: 'own, or the id of a contact.' }
                                                        recipient_name: { type: string, nullable: true }
                                                        percent: { type: string, nullable: true, example: '33.33' }
                                                        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                                        rest: { type: boolean }
                                    current: { type: boolean, description: 'The version in force this month.' }
                                    created_at: { type: string, format: date-time }
                                    created_by: { type: string, description: 'The id of the person who set it.' }
                MarginSupplierDefaults:
                    type: object
                    description: The versions of the default recipient of a supplier, latest first. A version applies from its month on until a later one.
                    required: [supplier_id, supplier_name, versions]
                    properties:
                        supplier_id: { type: string, format: uuid }
                        supplier_name: { type: string, nullable: true }
                        versions:
                            type: array
                            items:
                                type: object
                                required: [from_month, recipient, recipient_name, current]
                                properties:
                                    from_month: { type: string, example: '2026-12' }
                                    recipient: { type: string, nullable: true, description: 'own, the id of a contact, or null where the default ends.' }
                                    recipient_name: { type: string, nullable: true }
                                    current: { type: boolean, description: 'The version in force this month.' }
                CalendarFeed:
                    type: object
                    description: One of your calendar feeds. Its address is never shown again after it is created.
                    required: [id, name, created_at, last_fetched_at, revoked_at]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string, example: Phone }
                        created_at: { type: string, format: date-time }
                        last_fetched_at: { type: string, format: date-time, nullable: true, description: 'When a calendar app last fetched it; recorded at most once an hour.' }
                        revoked_at: { type: string, format: date-time, nullable: true }
                CalendarFeedCreated:
                    description: A new calendar feed with its address, shown this once; only its hash is kept.
                    allOf:
                        - $ref: '#/components/schemas/CalendarFeed'
                        - type: object
                          required: [address, webcal]
                          properties:
                              address: { type: string, format: uri, example: 'https://foresi.example.com/calendar/feed/AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-AbCd.ics' }
                              webcal: { type: string, example: 'webcal://foresi.example.com/calendar/feed/AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-AbCd.ics', description: 'The same address with the webcal scheme, which opens the calendar app to subscribe.' }
                MailAddress:
                    type: object
                    description: One of your inbound mail addresses. The full address is shown only once, when it is created or replaced.
                    required: [id, purpose, label, masked_address, created_at, revoked_at, last_received_at, limit_reached_today, dropped_today]
                    properties:
                        id: { type: string, format: uuid }
                        purpose: { type: string, example: purchasing, description: 'What the address is for, the key a module registered.' }
                        label: { type: string, example: 'Receipts to the accountant' }
                        masked_address: { type: string, example: 'inbox+…@example.com', description: 'The address with its secret part left out.' }
                        created_at: { type: string, format: date-time }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        last_received_at: { type: string, format: date-time, nullable: true, description: 'When mail last reached it.' }
                        limit_reached_today: { type: boolean, description: 'Whether the address took its daily limit of e-mails today, so mail to it is dropped until tomorrow (the instance day).' }
                        dropped_today: { type: integer, minimum: 0, description: 'How many e-mails the daily limit dropped today; 0 unless limit_reached_today.' }
                MailAddressCreated:
                    description: A new inbound address with its full text, shown this once; only its hash is kept.
                    allOf:
                        - $ref: '#/components/schemas/MailAddress'
                        - type: object
                          required: [address]
                          properties:
                              address: { type: string, format: email, example: 'inbox+abcdefghijklmnopqrstuvwxyz@example.com' }
                InboxItemSummary:
                    type: object
                    description: One of your inbox items on the list, without its text. The sender and subject are the sender's own words.
                    required: [id, state, state_changed_at, received_at, from, subject, verdict, forwarded, original_from, contact_id, company_id, match_basis, thread_key, others_in_thread, output_count]
                    properties:
                        id: { type: string, format: uuid }
                        state: { type: string, enum: [new, done, discarded] }
                        state_changed_at: { type: string, format: date-time, description: 'When the state last changed; when it arrived while it is new.' }
                        received_at: { type: string, format: date-time }
                        from: { type: string, nullable: true, description: 'The sender address; null once the mail is removed.' }
                        subject: { type: string, nullable: true, description: 'Null once the mail is removed.' }
                        verdict: { type: string, enum: [verified, failed, unknown], description: 'What the receiving server said of the sender.' }
                        forwarded: { type: boolean, description: 'You forwarded it from your own address; matched by the original sender it names, which nobody verified.' }
                        original_from: { type: string, nullable: true, description: 'The original sender a forward names.' }
                        contact_id: { type: string, format: uuid, nullable: true }
                        company_id: { type: string, format: uuid, nullable: true, description: 'The company of a matched person, when the person has exactly one.' }
                        match_basis: { type: string, enum: [address, domain, manual], nullable: true }
                        thread_key: { type: string, description: 'The same for the mails of one conversation.' }
                        others_in_thread: { type: integer, minimum: 0, description: 'How many other items of the conversation you have outside the trash.' }
                        output_count: { type: integer, minimum: 0, description: 'How many records came of it.' }
                InboxItemPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/InboxItemSummary' } }
                        next_cursor: { type: string, nullable: true }
                InboxItem:
                    type: object
                    description: One of your inbox items with its mail as plain text, never HTML. The sender, subject, body and attachment names are the sender's own words.
                    required: [id, state, state_changed_at, received_at, from, subject, verdict, forwarded, original_from, contact_id, company_id, match_basis, thread_key, warnings, duplicate_of_purpose, mail_removed, body, attachments, thread_item_ids, outputs, email_activity_id, trashed_at, available_actions]
                    properties:
                        id: { type: string, format: uuid }
                        state: { type: string, enum: [new, done, discarded] }
                        state_changed_at: { type: string, format: date-time }
                        received_at: { type: string, format: date-time }
                        from: { type: string, nullable: true }
                        subject: { type: string, nullable: true }
                        verdict: { type: string, enum: [verified, failed, unknown] }
                        forwarded: { type: boolean }
                        original_from: { type: string, nullable: true }
                        contact_id: { type: string, format: uuid, nullable: true }
                        company_id: { type: string, format: uuid, nullable: true }
                        match_basis: { type: string, enum: [address, domain, manual], nullable: true }
                        thread_key: { type: string }
                        warnings: { type: array, items: { type: string, enum: [sender_not_verified, forwarded_not_verified, duplicate] }, description: 'The sender not verified by the receiving server; a forward whose original sender nobody verified; the same mail received under another purpose before.' }
                        duplicate_of_purpose: { type: string, nullable: true, example: bank_feed, description: 'The purpose the same mail arrived under before.' }
                        mail_removed: { type: boolean, description: 'The mail of a discarded item was removed after 30 days; only the item is left.' }
                        body: { type: string, nullable: true, description: 'The plain text of the mail; null when it has none or is removed.' }
                        attachments:
                            type: array
                            items:
                                type: object
                                required: [index, name, mime, size]
                                properties:
                                    index: { type: integer, minimum: 0 }
                                    name: { type: string }
                                    mime: { type: string, description: 'The type the sender gave.' }
                                    size: { type: integer, minimum: 0 }
                        thread_item_ids: { type: array, items: { type: string, format: uuid }, description: 'Your other items of the conversation, oldest first.' }
                        outputs:
                            type: array
                            description: The records that came of it, oldest first.
                            items:
                                type: object
                                required: [kind, id, available, label, url, added_at]
                                properties:
                                    kind: { type: string, example: deal }
                                    id: { type: string, format: uuid }
                                    available: { type: boolean, description: 'False when the record is gone or not yours to see.' }
                                    label: { type: string, nullable: true }
                                    url: { type: string, nullable: true }
                                    added_at: { type: string, format: date-time }
                        email_activity_id: { type: string, format: uuid, nullable: true, description: 'The one e-mail activity, made on the first output.' }
                        trashed_at: { type: string, format: date-time, nullable: true }
                        available_actions:
                            type: array
                            description: 'The actions the installed modules offer on the item that the token may run (its scope and inbox:read), in their order; none on an item in the trash. Run one with its operation (REST) or tool (MCP); it records what it made as an output and marks the item done unless mark_done is false.'
                            items:
                                type: object
                                required: [operation, tool, label, input_schema, prefill]
                                properties:
                                    operation: { type: string, example: inbox.actions.create_task }
                                    tool: { type: string, example: foresi_create_task_from_email }
                                    label: { type: string, description: 'The name of the action in English.' }
                                    input_schema: { type: object, description: 'The JSON Schema of the input, as the MCP tool publishes it.' }
                                    prefill: { type: object, description: 'The values the fields start with, by field name, such as a title from the subject; inbox_item_id always.' }
                                    choices: { type: object, description: 'Per field name, value => label, for a field picked from a list, such as the projects of the matched client; only when a field has any.' }
                TaxProfile:
                    type: object
                    description: The owner profile; only the owner reads it.
                    properties:
                        statuses: { type: array, items: { $ref: '#/components/schemas/TaxStatus' } }
                        years: { type: array, items: { $ref: '#/components/schemas/TaxYear' } }
                        authorities: { type: array, items: { $ref: '#/components/schemas/TaxAuthorityAccount' } }
                TaxAmountFigures:
                    type: object
                    description: 'Amounts in CZK. counted is what the records count: the gross before the day the owner became a VAT payer, the net from it.'
                    properties:
                        gross: { $ref: '#/components/schemas/Money' }
                        net: { $ref: '#/components/schemas/Money' }
                        vat: { $ref: '#/components/schemas/Money' }
                        counted: { $ref: '#/components/schemas/Money' }
                TaxEstimateResult:
                    type: object
                    description: 'A year computed by a regime, such as the Czech sole trader: one result per expense method, each with its steps.'
                    properties:
                        regime: { type: string, example: cz.sole_trader }
                        rules:
                            type: object
                            properties:
                                year: { type: integer, example: 2026 }
                                status: { type: string, enum: [published, derived, latest_used] }
                                values:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            key: { type: string, example: social.minimum_share.main }
                                            value: { type: string, example: '35' }
                                            valid_from: { type: string, format: date }
                                            source_url: { type: string, format: uri }
                                            unverified: { type: boolean }
                        methods:
                            type: array
                            items:
                                type: object
                                properties:
                                    method: { type: string, enum: [actual, lump_80, lump_60, lump_40, lump_30] }
                                    totals:
                                        type: object
                                        properties:
                                            income: { $ref: '#/components/schemas/Money' }
                                            costs: { $ref: '#/components/schemas/Money' }
                                            expenses: { $ref: '#/components/schemas/Money' }
                                            profit: { $ref: '#/components/schemas/Money' }
                                            social: { $ref: '#/components/schemas/Money' }
                                            health: { $ref: '#/components/schemas/Money' }
                                            sickness: { $ref: '#/components/schemas/Money' }
                                            income_tax: { $ref: '#/components/schemas/Money' }
                                            child_bonus: { $ref: '#/components/schemas/Money' }
                                            levies: { $ref: '#/components/schemas/Money' }
                                            take_home: { $ref: '#/components/schemas/Money' }
                                            social_base: { $ref: '#/components/schemas/Money' }
                                            flat_rate: { $ref: '#/components/schemas/Money', description: 'The flat-rate tax of the months in it; the levies add it. Social, health and income tax are those of the other months.' }
                                    steps:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                key: { type: string, enum: [profit, social, health, sickness, tax_base, income_tax, credits, child_benefit, flat_rate], description: 'flat_rate only in a year with flat-rate months.' }
                                                input: { type: object, additionalProperties: { type: string } }
                                                rule: { type: string }
                                                source_url: { type: string, format: uri }
                                                result: { type: string, example: '60056.00' }
                        cheaper_method: { type: string, nullable: true, enum: [actual, lump_80, lump_60, lump_40, lump_30] }
                        break_even: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: How much more real cost would make the actual costs cost as much as the cheapest lump sum. }
                        credits:
                            type: array
                            items:
                                type: object
                                properties:
                                    key: { type: string, example: taxpayer }
                                    claimed: { type: boolean }
                                    amount: { $ref: '#/components/schemas/Money' }
                                    explanation: { type: string }
                        months:
                            type: array
                            items:
                                type: object
                                properties:
                                    month: { type: string, example: '2026-07' }
                                    activity: { type: string, enum: [none, secondary, main] }
                                    health_minimum_exempt: { type: boolean }
                                    sickness_insurance: { type: boolean }
                                    minimum_social_advance: { $ref: '#/components/schemas/Money' }
                                    minimum_health_advance: { $ref: '#/components/schemas/Money' }
                                    flat_rate_band: { type: string, nullable: true, enum: ['1', '2', '3'], description: 'The band when the month is in the flat-rate tax; its smallest advances are then the social and health parts of the band.' }
                        flat_rate:
                            type: object
                            nullable: true
                            description: 'The flat-rate regime of the year, the same for every expense method; null without a flat-rate month. A month whose flat_rate_band is 1, 2 or 3 on its first day pays the band amount, which replaces social, health and income tax; no credit, deduction or child benefit applies. Becoming a VAT payer ends it at the end of that year.'
                            properties:
                                months:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            month: { type: string, example: '2026-07' }
                                            band: { type: string, enum: ['1', '2', '3'] }
                                            income_tax: { $ref: '#/components/schemas/Money' }
                                            social: { $ref: '#/components/schemas/Money' }
                                            health: { $ref: '#/components/schemas/Money' }
                                            total: { $ref: '#/components/schemas/Money' }
                                income_tax: { $ref: '#/components/schemas/Money' }
                                social: { $ref: '#/components/schemas/Money' }
                                health: { $ref: '#/components/schemas/Money' }
                                total: { $ref: '#/components/schemas/Money' }
                        switch_adjustment:
                            type: object
                            nullable: true
                            description: 'The adjustment of the year before when the expense method changes (ZDP § 23 (8)): from actual costs to a lump sum, or into a whole year of the flat-rate tax. The receivables open at the end of the year before raise its tax base and, with actual costs before, the open payables lower it; advances stay out. The tax on the change, at the marginal rate of the year before, is due with an additional return by the return deadline of this year, as the payment of kind switch_adjustment. It is never inside the totals, and the warning switch_adjustment names it; unverified, and its effect on the insurance (switch_adjustment_insurance) too.'
                            properties:
                                adjusted_year: { type: integer, example: 2026 }
                                from_method: { type: string, enum: [actual, lump_80, lump_60, lump_40, lump_30] }
                                into: { type: string, enum: [lump_80, lump_60, lump_40, lump_30, flat_rate] }
                                open_on: { type: string, format: date, description: 'The last day of the year before, when the documents were open.' }
                                receivables: { $ref: '#/components/schemas/Money', description: 'Open issued invoices, without VAT when the owner was a VAT payer on that day.' }
                                payables: { $ref: '#/components/schemas/Money', description: 'Open received documents; zero when the year before had a lump sum.' }
                                base_change: { $ref: '#/components/schemas/Money', description: 'The receivables less the payables; below zero it lowers the base.' }
                                previous_tax_base: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'Null when the year before has no rules; the tax then takes the basic rate of this year.' }
                                rate: { type: string, example: '15', description: 'The marginal rate in per cent.' }
                                tax: { $ref: '#/components/schemas/Money', description: 'The change of the tax of the year before; below zero no payment comes of it.' }
                                due_on: { type: string, format: date }
                                source_url: { type: string, format: uri }
                TaxEstimate:
                    type: object
                    description: 'The estimate of the taxes and contributions of a year, never a basis for the tax return. "To date" and "year end" are never mixed; a part that cannot be computed is null with its reason. Only the owner reads it.'
                    properties:
                        estimate: { type: boolean, enum: [true] }
                        year: { type: integer, example: 2026 }
                        today: { type: string, format: date }
                        to_date: { allOf: [{ $ref: '#/components/schemas/TaxEstimateResult' }], nullable: true }
                        to_date_reason: { type: string, nullable: true, enum: [year_not_started, rules_not_available] }
                        year_end: { allOf: [{ $ref: '#/components/schemas/TaxEstimateResult' }], nullable: true }
                        year_end_reason: { type: string, nullable: true, enum: [year_not_started, rules_not_available, cash_flow_not_installed, forecast_unavailable] }
                        forecast:
                            type: object
                            nullable: true
                            description: 'The forecast part of the year end, from today to 31 December: open documents split into net and VAT in their own ratio, recurring invoices and planned items as stated. It leaves out the estimate itself and the categories taxes, insurance, vat, loans and owner_draws. Null for a past year and without Cash flow.'
                            properties:
                                from: { type: string, format: date }
                                to: { type: string, format: date }
                                totals:
                                    type: object
                                    properties:
                                        income: { $ref: '#/components/schemas/TaxAmountFigures' }
                                        cost: { $ref: '#/components/schemas/TaxAmountFigures' }
                                flags: { type: array, items: { type: string, enum: [forecast.plan_no_vat_split, forecast.no_vat_split_restricted, forecast.no_vat_split_unknown] }, description: Where the forecast could not split the VAT. }
                                incomplete: { type: boolean, description: A source failed or an amount had no rate; what failed is left out. }
                                unavailable_sources: { type: array, items: { type: string } }
                                restricted_sources: { type: array, items: { type: string } }
                        forecast_by_certainty:
                            type: object
                            nullable: true
                            description: The forecast part split by how sure it is.
                            properties:
                                document: { $ref: '#/components/schemas/TaxForecastPart' }
                                schedule: { $ref: '#/components/schemas/TaxForecastPart' }
                                plan: { $ref: '#/components/schemas/TaxForecastPart' }
                        accruals:
                            type: array
                            description: "The levies of the year end spread over its months by each month's share of the profit, with the smallest advances in a month of low profit; the months add up to the levies of the year."
                            items:
                                type: object
                                properties:
                                    method: { type: string, enum: [actual, lump_80, lump_60, lump_40, lump_30] }
                                    months:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                month: { type: string, example: '2026-11' }
                                                profit: { $ref: '#/components/schemas/Money' }
                                                minimum: { $ref: '#/components/schemas/Money' }
                                                levies: { $ref: '#/components/schemas/Money' }
                        amounts:
                            type: object
                            nullable: true
                            properties:
                                from: { type: string, format: date }
                                to: { type: string, format: date }
                                totals:
                                    type: object
                                    properties:
                                        income: { $ref: '#/components/schemas/TaxAmountFigures' }
                                        cost: { $ref: '#/components/schemas/TaxAmountFigures' }
                                unavailable_sources: { type: array, items: { type: string } }
                                restricted_sources: { type: array, items: { type: string } }
                                missing_rates: { type: array, items: { type: string } }
                        payments:
                            type: array
                            description: 'The payments of the year by due day: every advance, and the settlement in the next year once the year end is known; an overpayment comes back. A bank movement that meets the match rule of its authority (the account and variable symbol in the profile) pays it; one unpaid after its due day is overdue. The payments not yet paid are the estimate flows of the cash flow.'
                            items:
                                type: object
                                properties:
                                    key: { type: string, example: social.advance.2026-12 }
                                    authority: { type: string, enum: [social, health, sickness, income_tax, flat_rate] }
                                    kind: { type: string, enum: [advance, settlement, overpayment, switch_adjustment], description: 'switch_adjustment is the tax of a change of the expense method, of the year of the change.' }
                                    period: { type: string, example: '2026-12', description: 'The month ("2026-12") or the year ("2026") it covers.' }
                                    direction: { type: string, enum: [in, out] }
                                    payable_from: { type: string, format: date }
                                    due_on: { type: string, format: date }
                                    amount: { $ref: '#/components/schemas/Money' }
                                    state: { type: string, enum: [expected, paid, overdue] }
                                    match_rule:
                                        type: object
                                        nullable: true
                                        description: Null until the authority's account is in the profile.
                                        properties:
                                            account: { type: string }
                                            variable_symbol: { type: string }
                                    paid_by:
                                        type: object
                                        nullable: true
                                        properties:
                                            bank_movement_id: { type: string }
                                            booked_on: { type: string, format: date }
                        possible_duplicates:
                            type: array
                            description: 'Active planned items of Cash flow in the categories taxes and insurance, which the estimate flows may count twice. The estimate never ends them; the owner does.'
                            items:
                                type: object
                                properties:
                                    planned_item_id: { type: string, format: uuid }
                                    name: { type: string }
                                    category: { type: string, enum: [taxes, insurance] }
                        warnings: { type: array, items: { type: string, example: sources_unavailable } }
                        unverified: { type: array, items: { type: string, example: vat_cash_basis }, description: Rules an accountant should confirm. }
                        known_gaps: { type: array, items: { type: string } }
                TaxForecastPart:
                    type: object
                    properties:
                        income: { $ref: '#/components/schemas/TaxAmountFigures' }
                        cost: { $ref: '#/components/schemas/TaxAmountFigures' }
                TaxAmounts:
                    type: object
                    description: 'The actual income and costs on a cash basis: each payment on its own day, split into net and VAT in the ratio of its document, at the ČNB rate of its day. Refunds and credit notes are negative. Only the owner reads them.'
                    properties:
                        from: { type: string, format: date }
                        to: { type: string, format: date }
                        totals:
                            type: object
                            properties:
                                income: { $ref: '#/components/schemas/TaxAmountFigures' }
                                cost: { $ref: '#/components/schemas/TaxAmountFigures' }
                        months:
                            type: array
                            items:
                                allOf:
                                    - $ref: '#/components/schemas/TaxAmountFigures'
                                    - type: object
                                      properties:
                                          month: { type: string, example: '2026-11' }
                                          kind: { type: string, enum: [income, cost] }
                                          source: { type: string, example: invoicing.payments }
                        amounts:
                            type: array
                            description: The payments of the documents the caller may read.
                            items:
                                type: object
                                properties:
                                    source: { type: string, example: invoicing.payments }
                                    subject:
                                        type: object
                                        properties:
                                            type: { type: string, example: invoice }
                                            id: { type: string, format: uuid }
                                            url: { type: string, nullable: true }
                                    kind: { type: string, enum: [income, cost] }
                                    paid_on: { type: string, format: date }
                                    tax_point_on: { type: string, format: date, nullable: true }
                                    advance: { type: boolean }
                                    gross: { $ref: '#/components/schemas/Money' }
                                    net: { $ref: '#/components/schemas/Money' }
                                    vat: { $ref: '#/components/schemas/Money' }
                                    gross_czk: { $ref: '#/components/schemas/Money' }
                                    net_czk: { $ref: '#/components/schemas/Money' }
                                    vat_czk: { $ref: '#/components/schemas/Money' }
                                    counted_czk: { $ref: '#/components/schemas/Money' }
                        unavailable_sources: { type: array, items: { type: string }, description: The sources not installed or that failed; their amounts are missing. }
                        restricted_sources: { type: array, items: { type: string }, description: The sources whose documents the caller may not read; they count in the sums only. }
                        missing_rates: { type: array, items: { type: string }, description: The currencies without a rate on a payment day; those payments are left out. }
                        unverified: { type: array, items: { type: string, enum: [fx_payment_day, vat_cash_basis] }, description: Rules an accountant should confirm. }
                        known_gaps: { type: array, items: { type: string, enum: [non_deductible_costs, assets] }, description: What the received documents cannot say yet. }
                ReceivedDocument:
                    type: object
                    description: 'A document a firm received from a supplier. Paid and remaining are positive, also for a credit note, whose total is negative.'
                    properties:
                        id: { type: string, format: uuid }
                        firm: { $ref: '#/components/schemas/Reference' }
                        state: { type: string, enum: [draft, recorded] }
                        kind: { type: string, enum: [tax_invoice, simplified_receipt, foreign_invoice, credit_note, advance_request, other] }
                        treatment: { type: string, enum: [domestic, domestic_reverse_charge, eu_service, non_eu_service, not_vat_document, non_deductible] }
                        evidence_number: { type: string, nullable: true }
                        supplier: { allOf: [{ $ref: '#/components/schemas/Reference' }], nullable: true }
                        supplier_number: { type: string }
                        variable_symbol: { type: string }
                        issue_date: { type: string, format: date, nullable: true }
                        tax_point_date: { type: string, format: date, nullable: true }
                        due_date: { type: string, format: date, nullable: true }
                        received_date: { type: string, format: date, nullable: true }
                        total: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        base: { $ref: '#/components/schemas/Money' }
                        vat: { $ref: '#/components/schemas/Money' }
                        vat_czk: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                        paid: { $ref: '#/components/schemas/Money' }
                        remaining: { $ref: '#/components/schemas/Money' }
                        is_paid: { type: boolean }
                        last_paid_on: { type: string, format: date, nullable: true }
                        has_original_file: { type: boolean }
                        recorded_at: { type: string, format: date-time, nullable: true }
                        trashed_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                ReceivedDocumentPayment:
                    type: object
                    properties:
                        id: { type: string, format: uuid }
                        paid_on: { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Money' }
                        method: { type: string, enum: [bank_transfer, card, cash, other] }
                        bank_movement_id: { type: string, format: uuid, nullable: true }
                        created_at: { type: string, format: date-time }
                ReceivedDocumentDetail:
                    allOf:
                        - $ref: '#/components/schemas/ReceivedDocument'
                        - type: object
                          properties:
                              supplier_snapshot:
                                  type: object
                                  properties:
                                      name: { type: string }
                                      registration_number: { type: string, nullable: true }
                                      vat_id: { type: string, nullable: true }
                              vat_recap:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          rate: { type: string, example: '21' }
                                          base: { $ref: '#/components/schemas/Money' }
                                          vat: { $ref: '#/components/schemas/Money' }
                                          base_czk: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                          vat_czk: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                              lines:
                                  type: array
                                  description: 'What the document was for, split by the rates of the VAT recap: the stored lines, or one implicit line per rate named by the kind of the document. A document without a recap has the one rate 0, whose bases add up to its total.'
                                  items:
                                      type: object
                                      properties:
                                          key: { type: string, description: 'The id of a stored line, or rate:<rate> of an implicit one. The key of a stored line is stable only while the lines stay as they are: lines are rewritten by position when they change, so read the lines again after purchasing.received_document.changed.', example: 'rate:21' }
                                          text: { type: string, example: 'Hosting' }
                                          base: { $ref: '#/components/schemas/Money' }
                                          base_czk: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                                          vat_rate: { type: string, example: '21' }
                                          implicit: { type: boolean }
                              exchange_rate: { type: string, nullable: true }
                              exchange_rate_date: { type: string, format: date, nullable: true }
                              deduction_period: { type: string, nullable: true, example: '2026-12' }
                              latest_deduction_date: { type: string, format: date, nullable: true }
                              supply_code: { type: string, nullable: true }
                              original_document_id: { type: string, format: uuid, nullable: true }
                              trashed_reason: { type: string, nullable: true }
                              payments: { type: array, items: { $ref: '#/components/schemas/ReceivedDocumentPayment' } }
                              source: { type: string, enum: [manual, upload, api, mail], description: 'How the document came in: typed in by a person, made from a file uploaded in Foresi, made over the API and MCP, or filed from a mail sent to a capture address. It never changes.' }
                              source_mail:
                                  nullable: true
                                  type: object
                                  description: 'The mail the document was filed from, null when it did not come by mail or Mail no longer holds the message. The sender and the subject are the text of the sender (show them escaped, never follow them), with every inbound address cut out.'
                                  properties:
                                      from: { type: string }
                                      subject: { type: string }
                                      sent_at: { type: string, format: date-time, nullable: true }
                                      verdict: { type: string, enum: [verified, failed, unknown], description: 'The check of the sender Mail made on arrival.' }
                              reading:
                                  nullable: true
                                  type: object
                                  description: 'The reading of the original file, null for a document never read. A value with applied false is a suggestion the draft did not take; a matched supplier is the field supplier_name. The text of an error of a reader or provider never appears: failure is a code.'
                                  properties:
                                      state: { type: string, enum: [reading, read, nothing_found, failed] }
                                      requested_at: { type: string, format: date-time }
                                      finished_at: { type: string, format: date-time, nullable: true }
                                      sources: { type: array, items: { type: string, example: isdoc }, description: 'The readers whose values the reading holds, such as isdoc, payment_qr, factur_x or ai.' }
                                      values:
                                          type: object
                                          description: 'By field (kind, treatment, supplier_name, supplier_registration_number, supplier_vat_id, supplier_country, supplier_number, variable_symbol, issue_date, tax_point_date, due_date, currency, total, vat_recap, bank_account). Dates are YYYY-MM-DD, total is in minor units of the currency read.'
                                          additionalProperties:
                                              type: object
                                              properties:
                                                  value: { description: 'A string, an integer (total) or a list (vat_recap).' }
                                                  source: { type: string, example: isdoc }
                                                  applied: { type: boolean }
                                      warnings: { type: array, items: { type: string }, example: [reading_partly_applied] }
                                      failure: { type: string, nullable: true, example: reader_failed, description: 'A code (reader_failed, original_unreadable or unexpected) when state is failed, never a text from a reader or provider.' }
                ReceivedDocumentPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/ReceivedDocument' } }
                        next_cursor: { type: string, nullable: true }
                        applied_view: { allOf: [{ $ref: '#/components/schemas/SavedView' }], nullable: true, description: 'The saved view the view parameter named; null without one.' }
                WebhookEndpoint:
                    type: object
                    description: An HTTPS address that receives the events it subscribes to as signed Standard Webhooks requests. It never holds the secret.
                    required: [id, url, description, event_types, version, active, disabled_reason, owner_id, previous_secret_expires_at, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid }
                        url: { type: string, example: 'https://hooks.example.com/foresi' }
                        description: { type: string, nullable: true }
                        event_types: { type: array, items: { type: string }, example: ['invoicing.invoice.paid', 'invoicing.payment.*'] }
                        version: { type: integer, description: 'The event version the endpoint receives; an event of another version is not sent to it.' }
                        active: { type: boolean }
                        disabled_reason: { type: string, nullable: true, enum: [gone, failing, owner_lost_access, manual, null] }
                        owner_id: { type: string, format: uuid, description: 'The person who registered the endpoint.' }
                        previous_secret_expires_at: { type: string, format: date-time, nullable: true, description: 'Until when the secret before the last rotation still signs.' }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                WebhookEndpointWithSecret:
                    allOf:
                        - $ref: '#/components/schemas/WebhookEndpoint'
                        - type: object
                          required: [secret]
                          properties:
                              secret: { type: string, example: 'whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw', description: 'The signing secret. Store it now.' }
                WebhookEndpointPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
                        next_cursor: { type: string, nullable: true }
                WebhookEndpointCreate:
                    type: object
                    required: [url, event_types]
                    properties:
                        url: { type: string, description: 'https, with a host that resolves outside private networks, at most 2048 characters.' }
                        event_types: { type: array, items: { type: string }, description: 'Event names or "module.*"; "*" is refused.' }
                        description: { type: string, nullable: true, maxLength: 255 }
                        version: { type: integer, default: 1 }
                WebhookEndpointUpdate:
                    type: object
                    description: Only the fields sent change. A description of null clears it.
                    properties:
                        url: { type: string }
                        event_types: { type: array, items: { type: string } }
                        description: { type: string, nullable: true, maxLength: 255 }
                        version: { type: integer }
                        active: { type: boolean, description: 'false disables the endpoint (reason manual), true enables it.' }
                WebhookSecret:
                    type: object
                    required: [secret, previous_secret_expires_at]
                    properties:
                        secret: { type: string, example: 'whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw' }
                        previous_secret_expires_at: { type: string, format: date-time, nullable: true }
                WebhookQueuedAttempt:
                    type: object
                    required: [delivery_id, attempt_id]
                    properties:
                        delivery_id: { type: string, format: uuid }
                        attempt_id: { type: string, format: uuid, description: 'The attempt as it will show in the delivery once it is made.' }
                WebhookDelivery:
                    type: object
                    description: One event, or one ping, for one endpoint. The body is not part of it.
                    required: [id, endpoint_id, event_id, event_type, kind, status, attempt_count, last_status_code, next_attempt_at, created_at, finished_at]
                    properties:
                        id: { type: string, format: uuid }
                        endpoint_id: { type: string, format: uuid }
                        event_id: { type: string, format: uuid, description: 'The webhook-id header of every attempt.' }
                        event_type: { type: string, example: invoicing.invoice.paid }
                        kind: { type: string, enum: [event, ping] }
                        status: { type: string, enum: [pending, succeeded, failed] }
                        attempt_count: { type: integer }
                        last_status_code: { type: integer, nullable: true }
                        next_attempt_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                        finished_at: { type: string, format: date-time, nullable: true }
                WebhookAttempt:
                    type: object
                    required: [id, attempted_at, duration_ms, status_code, error, trigger]
                    properties:
                        id: { type: string, format: uuid }
                        attempted_at: { type: string, format: date-time }
                        duration_ms: { type: integer }
                        status_code: { type: integer, nullable: true }
                        error: { type: string, nullable: true, enum: [timeout, tls, blocked_address, connection, redirect, endpoint_disabled, null] }
                        trigger: { type: string, enum: [schedule, manual, ping] }
                WebhookDeliveryDetail:
                    allOf:
                        - $ref: '#/components/schemas/WebhookDelivery'
                        - type: object
                          required: [attempts]
                          properties:
                              attempts: { type: array, items: { $ref: '#/components/schemas/WebhookAttempt' } }
                WebhookDeliveryPage:
                    type: object
                    required: [data, next_cursor]
                    properties:
                        data: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                        next_cursor: { type: string, nullable: true }
                ActivitiesType:
                    type: object
                    description: A kind of activity, such as a meeting, and the time it has.
                    properties:
                        id: { type: string, format: uuid }
                        key: { type: string, example: meeting, description: 'Unique; it never changes.' }
                        name: { type: string, example: Meeting, description: 'A seeded type that was never renamed shows under its name in the language of the caller.' }
                        timing: { type: string, enum: [timed, date, none], description: 'timed: at a time with a duration; date: on a day; none: no time, done when written.' }
                        default_duration_minutes: { type: integer, nullable: true, example: 60 }
                        archived: { type: boolean }
                ActivitiesActivity:
                    type: object
                    description: A meeting, call, note or task, planned ahead or logged as done, with the records it is about and its files.
                    properties:
                        id: { type: string, format: uuid }
                        type:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                key: { type: string, example: meeting }
                                name: { type: string, example: Meeting }
                                timing: { type: string, enum: [timed, date, none] }
                        subject: { type: string, example: Kick-off meeting }
                        body: { type: string, description: 'Notes, in Markdown.' }
                        planned_on: { type: string, format: date, nullable: true }
                        planned_at: { type: string, format: date-time, nullable: true }
                        duration_minutes: { type: integer, nullable: true }
                        done: { type: boolean }
                        done_at: { type: string, format: date-time, nullable: true }
                        outcome: { type: string, nullable: true }
                        owner_user_id: { type: string, format: uuid }
                        created_by: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                        trashed: { type: boolean }
                        links:
                            type: array
                            description: 'The records it is about; one that is gone or not the caller''s to see is available: false, without its label.'
                            items:
                                type: object
                                properties:
                                    kind: { type: string, example: contact }
                                    id: { type: string, format: uuid }
                                    available: { type: boolean }
                                    label: { type: string, nullable: true }
                        files:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    name: { type: string, example: recording.m4a }
                                    media_type: { type: string }
                                    size: { type: integer }
                                    url: { type: string, format: uri }
                        next:
                            description: 'Only in the answer of activities.complete: the next activity it planned, or null.'
                            nullable: true
                            allOf: [{ $ref: '#/components/schemas/ActivitiesActivity' }]
                DocumentsType:
                    type: object
                    description: A kind of document, such as an NDA, and whether and how it is signed.
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string, example: NDA }
                        code: { type: string, example: nda, description: 'Unique; it never changes.' }
                        needs_signing: { type: boolean }
                        signature_level: { type: string, enum: [simple, advanced, qualified] }
                        archived: { type: boolean }
                DocumentsTemplateVersion:
                    type: object
                    description: A version of a template. It is edited in place until a document is generated from it; then it is frozen, and saving makes the next number.
                    properties:
                        id: { type: string, format: uuid }
                        number: { type: integer, example: 1 }
                        body: { type: string, description: 'The HTML body in the subset of ADR 0042, with placeholders such as {{ firm.name }}.' }
                        frozen: { type: boolean }
                        page:
                            type: object
                            properties:
                                paper: { type: string, enum: [a4, letter] }
                                landscape: { type: boolean }
                                margin_top: { type: number, description: 'Millimetres.' }
                                margin_right: { type: number, description: 'Millimetres.' }
                                margin_bottom: { type: number, description: 'Millimetres.' }
                                margin_left: { type: number, description: 'Millimetres.' }
                        uses: { type: array, items: { type: string, example: firm.name }, description: 'The variables the body uses.' }
                DocumentsTemplateRow:
                    type: object
                    description: A template in a list, with its latest version without the body.
                    properties:
                        id: { type: string, format: uuid }
                        type_id: { type: string, format: uuid }
                        name: { type: string }
                        archived: { type: boolean }
                        version:
                            type: object
                            nullable: true
                            properties:
                                id: { type: string, format: uuid }
                                number: { type: integer }
                                frozen: { type: boolean }
                DocumentsTemplate:
                    type: object
                    description: A template with its latest version, all its versions and every variable a body can use.
                    properties:
                        id: { type: string, format: uuid }
                        type_id: { type: string, format: uuid }
                        name: { type: string }
                        archived: { type: boolean }
                        version: { allOf: [{ $ref: '#/components/schemas/DocumentsTemplateVersion' }], nullable: true }
                        versions:
                            type: array
                            description: Newest first.
                            items:
                                type: object
                                properties:
                                    id: { type: string, format: uuid }
                                    number: { type: integer }
                                    frozen: { type: boolean }
                        variables:
                            type: array
                            description: What the installed modules offer, such as the firm and the linked client.
                            items:
                                type: object
                                properties:
                                    name: { type: string, example: firm.name }
                                    label: { type: string, example: Firm name }
                                    example: { type: string, example: Example Firm s.r.o. }
                DocumentsSigner:
                    type: object
                    description: Who signs a document, in a signing order; signers of one order sign in parallel. The order is shown, not enforced.
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string, format: email, nullable: true }
                        party_person_id: { type: string, format: uuid, nullable: true }
                        side: { type: string, enum: [ours, theirs] }
                        order: { type: integer, minimum: 1 }
                        status: { type: string, enum: [pending, signed, declined] }
                        signed_at: { type: string, format: date-time, nullable: true }
                        method: { type: string, nullable: true, example: manual, description: 'manual, or the code of a signature provider.' }
                DocumentsFile:
                    type: object
                    nullable: true
                    description: A stored file of a document; GET /api/v1/documents/{documentId}/files/{file} downloads it.
                    properties:
                        attachment_id: { type: string, format: uuid }
                        sha256: { type: string, nullable: true }
                DocumentsDocumentRow:
                    type: object
                    description: A document in a list.
                    properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string, enum: [draft, ready, out_for_signature, completed, declined, cancelled, expired] }
                        type:
                            type: object
                            properties:
                                id: { type: string, format: uuid }
                                code: { type: string, nullable: true }
                                name: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        generated_at: { type: string, format: date-time, nullable: true }
                        completed_at: { type: string, format: date-time, nullable: true }
                        trashed: { type: boolean, description: 'True for a cancelled document in the trash.' }
                        trashed_at: { type: string, format: date-time, nullable: true }
                DocumentsDocument:
                    allOf:
                        - $ref: '#/components/schemas/DocumentsDocumentRow'
                        - type: object
                          properties:
                              template:
                                  type: object
                                  properties:
                                      id: { type: string, format: uuid }
                                      version_id: { type: string, format: uuid, nullable: true }
                                      version_number: { type: integer, nullable: true }
                              links:
                                  type: array
                                  items:
                                      type: object
                                      properties:
                                          kind: { type: string, example: contact }
                                          id: { type: string, format: uuid }
                                          available: { type: boolean, description: 'False when the record is gone or no module offers its kind any more.' }
                                          label: { type: string, nullable: true }
                                          url: { type: string, nullable: true }
                              signers: { type: array, items: { $ref: '#/components/schemas/DocumentsSigner' }, description: 'In signing order.' }
                              files:
                                  type: object
                                  properties:
                                      pdf: { $ref: '#/components/schemas/DocumentsFile' }
                                      signed: { $ref: '#/components/schemas/DocumentsFile' }
                                      certificate: { $ref: '#/components/schemas/DocumentsFile' }
                              values: { type: object, nullable: true, additionalProperties: true, description: 'The values frozen when the document was generated, by prefix.' }
                              provider: { type: string, nullable: true, description: 'The signature provider; null for manual signing.' }
                              envelope_id: { type: string, nullable: true }
                              sent_at: { type: string, format: date-time, nullable: true }
                              closed_at: { type: string, format: date-time, nullable: true }
    areas:
        default:
            # The API itself; the document is not one of its operations.
            path_patterns: ['^/api/v1/(?!openapi\.json$)']
