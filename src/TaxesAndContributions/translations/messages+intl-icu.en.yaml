    step:
      profit:
        title: Profit
        rule: '{method, select, actual {Income less the costs actually paid, both on the cash basis.} other {Income less {rate} of it as the lump sum, at most {cap}; the real costs do not count.}}'
      social:
        title: Social insurance
        rule: '{counted, select, no {No month takes part in social insurance: no main activity, and a secondary activity below the decisive amount.} other {A share of the profit, at least the minimum base of each month taking part, at most the maximum base; times {rate}, rounded up.}}'
      health:
        title: Health insurance
        rule: '{counted, select, no {No active month: no health insurance as a sole trader.} other {A share of the profit, at least the minimum base for each active month with the minimum; times {rate}, rounded up.}}'
      sickness:
        title: Sickness insurance
        rule: 'For each month it is on: {rate} of the chosen monthly base, at least the minimum base, rounded up.'
      tax_base:
        title: Tax base
        rule: The profit and the other partial bases, less the deductions within their caps, rounded down to whole hundreds.
      income_tax:
        title: Tax before credits
        rule: '{rate} of the base up to {threshold}, {higher} of the part above; rounded up.'
      credits:
        title: Tax credits
        rule: The credits claimed lower the tax, down to zero.
      child_benefit:
        title: Child benefit
        rule: The child benefit lowers the tax first; the rest is a bonus paid out when it is at least the minimum and the income reaches six minimum wages.
      flat_rate:
        title: Flat-rate tax
        rule: For each month in the flat-rate tax, its band's monthly amount, which replaces social, health and income tax; no credit, deduction or child benefit applies.
        covered: Every active month is in the flat-rate tax, whose amount covers this; no credit, deduction or child benefit applies.
