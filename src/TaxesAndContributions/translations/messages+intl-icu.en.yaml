    warning:
      sources_unavailable: Some sources of income and costs are not available, so the estimate is incomplete.
      forecast_incomplete: Part of the Cash flow forecast could not be read, so the year end is incomplete.
      activity_assumed_main: The profile names no activity, so a main activity is assumed.
      flat_rate_ends_vat_payer: You become a VAT payer this year, so the flat-rate tax ends on 31 December and next year is standard. Change the band in the profile yourself.
      flat_rate_ended_vat_payer: The flat-rate tax ended when you became a VAT payer, so this year counts as standard. End the band in the profile.
      flat_rate_over_income_limit: The income of the year is above the band's limit for any activity. A higher limit holds only when most of the income comes from activities with 80 % or 60 % lump sums.
      deduction_not_computed: Union fees and further education exams are not deducted yet.
      possible_duplicates: Planned items in Cash flow may count a levy twice.
      no_match_rule: Some authorities have no account in the profile, so the bank cannot tell which of their payments are paid.
      payments_unavailable: The bank movements could not be read, so the payments may be paid already.
